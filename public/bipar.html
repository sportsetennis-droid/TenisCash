<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem por Bipe — Sports & Tennis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; padding: 20px; max-width: 900px; margin: 0 auto; min-height: 100vh; }
  h1 { font-size: 22px; margin-bottom: 4px; color: #E5571E; }
  p.sub { font-size: 12px; color: #666; margin-bottom: 16px; }

  .setup { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #e5e5ea; }
  .setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .setup label { display: block; font-size: 11px; letter-spacing: 1px; color: #888; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
  .setup select { width: 100%; padding: 12px; font-size: 15px; border: 1.5px solid #d2d2d7; border-radius: 8px; background: #fff; cursor: pointer; }
  .setup-status { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-top: 4px; }
  .status-ok { background: #d1fae5; color: #065f46; }
  .status-warn { background: #fef3c7; color: #92400e; }

  .bipe-box { background: #fff; border: 3px solid #E5571E; border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(229,87,30,0.15); }
  .bipe-box.locked { border-color: #d2d2d7; background: #f5f5f7; opacity: 0.6; pointer-events: none; }
  .bipe-box label { display: block; font-size: 11px; letter-spacing: 1px; color: #E5571E; font-weight: 700; margin-bottom: 8px; }
  #codigo { width: 100%; padding: 16px; font-size: 22px; font-family: 'SF Mono', Monaco, monospace; border: 2px solid #d2d2d7; border-radius: 10px; outline: none; transition: border 0.15s; }
  #codigo:focus { border-color: #E5571E; box-shadow: 0 0 0 4px rgba(229,87,30,0.15); }
  #codigo:disabled { background: #eee; cursor: not-allowed; }

  .last-bipe { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; min-height: 60px; display: flex; align-items: center; gap: 12px; border: 1px solid #e5e5ea; }
  .last-bipe img { width: 50px; height: 60px; object-fit: cover; border-radius: 6px; background: #eee; }
  .last-bipe-info { flex: 1; min-width: 0; }
  .last-bipe-info .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .last-bipe-info .meta { font-size: 12px; color: #666; margin-top: 2px; }
  .last-bipe.not-found { background: #fee; border-color: #d70015; }
  .last-bipe.not-found .name { color: #d70015; }
  .last-bipe.idle { background: #fafafc; color: #aaa; justify-content: center; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5e5ea; }
  .stat-label { font-size: 10px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-size: 24px; font-weight: 800; color: #E5571E; margin-top: 2px; }
  .stat-value.green { color: #25d366; }
  .stat-value.red { color: #d70015; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { padding: 10px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary { background: #25d366; color: #fff; }
  .btn-secondary { background: #fff; color: #1d1d1f; border: 1.5px solid #d2d2d7; }
  .btn-danger { background: #fff; color: #d70015; border: 1.5px solid #d70015; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .lista-wrap { background: #fff; border-radius: 12px; border: 1px solid #e5e5ea; overflow: hidden; }
  .lista-head { padding: 10px 14px; border-bottom: 1px solid #e5e5ea; font-size: 11px; letter-spacing: 1px; color: #888; text-transform: uppercase; display: flex; justify-content: space-between; }
  .lista { max-height: 50vh; overflow-y: auto; }
  .item { padding: 8px 14px; border-bottom: 1px solid #f0f0f5; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
  .item:last-child { border-bottom: none; }
  .item:nth-child(odd) { background: #fafafc; }
  .item.not-found { background: #fff5f5; }
  .item .ts { font-size: 11px; color: #888; min-width: 60px; }
  .item .info { flex: 1; min-width: 0; }
  .item .code { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; color: #555; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .del { background: none; border: none; color: #d70015; cursor: pointer; font-size: 16px; padding: 0 4px; }
  .empty { padding: 30px 20px; text-align: center; color: #888; font-size: 14px; }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .setup-row { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat { padding: 8px 10px; }
    .stat-value { font-size: 20px; }
    #codigo { font-size: 18px; padding: 14px; }
  }
</style>
</head>
<body>
  <h1>📦 Contagem por Bipe — Sports & Tennis</h1>
  <p class="sub">Selecione a loja + vendedor. Bipe cada produto. Tudo entra direto no sistema.</p>

  <div class="setup">
    <div class="setup-row">
      <div>
        <label>LOJA</label>
        <select id="loja"><option value="">Carregando...</option></select>
      </div>
      <div>
        <label>VENDEDOR</label>
        <select id="vendedor"><option value="">Selecione a loja primeiro</option></select>
        <input type="text" id="vendedor-manual" placeholder="Digite o nome do vendedor" style="width:100%;padding:12px;font-size:15px;border:1.5px solid #d2d2d7;border-radius:8px;margin-top:6px;display:none">
      </div>
    </div>
    <div id="setup-status" class="setup-status status-warn">⚠️ Selecione loja e vendedor antes de bipar</div>
  </div>

  <div class="bipe-box locked" id="bipe-box">
    <label for="codigo">CÓDIGO DE BARRAS</label>
    <input type="text" id="codigo" autocomplete="off" inputmode="numeric" placeholder="Aguardando loja/vendedor..." disabled>
  </div>

  <div class="last-bipe idle" id="last-bipe">Aguardando primeiro bipe...</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Encontrados</div>
      <div class="stat-value green" id="stat-found">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Não Achados</div>
      <div class="stat-value red" id="stat-notfound">0</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="abrirContagem()">📋 Ver minha contagem do dia</button>
    <button class="btn btn-danger" onclick="limparTela()">🗑 Limpar tela (não apaga do sistema)</button>
  </div>

  <div class="lista-wrap">
    <div class="lista-head">
      <span>Bipes desta sessão</span>
      <span id="lista-count">0 itens</span>
    </div>
    <div class="lista" id="lista">
      <div class="empty">Os bipes aparecerão aqui em tempo real</div>
    </div>
  </div>

<script>
  const STORAGE_LOJA = 'sports_tennis_bipar_loja';
  const STORAGE_VEND = 'sports_tennis_bipar_vendedor';
  const STORAGE_VENDNAME = 'sports_tennis_bipar_vendedor_nome';

  let stores = [];
  let sellers = [];
  let bipes = []; // sessão local (memória)

  async function carregarLojas() {
    try {
      const r = await fetch('/api/stocktake/stores');
      const d = await r.json();
      stores = d.stores || [];
      const sel = document.getElementById('loja');
      sel.innerHTML = '<option value="">Selecione a loja</option>' + stores.map(s => `<option value="${s.id}">${s.name}${s.code ? ' (' + s.code + ')' : ''}</option>`).join('');
      // restaura seleção
      const savedLoja = localStorage.getItem(STORAGE_LOJA);
      if (savedLoja) {
        sel.value = savedLoja;
        await carregarVendedores(savedLoja);
      }
    } catch (e) {
      document.getElementById('loja').innerHTML = '<option>Erro ao carregar</option>';
      console.error(e);
    }
  }

  async function carregarVendedores(storeId) {
    if (!storeId) {
      document.getElementById('vendedor').innerHTML = '<option value="">Selecione a loja primeiro</option>';
      return;
    }
    try {
      const r = await fetch('/api/stocktake/sellers?storeId=' + encodeURIComponent(storeId));
      const d = await r.json();
      sellers = d.sellers || [];
      const sel = document.getElementById('vendedor');
      sel.innerHTML = '<option value="">Selecione o vendedor</option>'
        + sellers.map(s => `<option value="${s.id}">${s.name}${s.employeeCode ? ' (' + s.employeeCode + ')' : ''}</option>`).join('')
        + '<option value="__manual__">✏️ Digitar manualmente...</option>';
      const savedVend = localStorage.getItem(STORAGE_VEND);
      if (savedVend === '__manual__') {
        sel.value = '__manual__';
        const manualInput = document.getElementById('vendedor-manual');
        manualInput.style.display = 'block';
        manualInput.value = localStorage.getItem(STORAGE_VENDNAME) || '';
      } else if (savedVend && sellers.find(s => s.id === savedVend)) {
        sel.value = savedVend;
      }
      atualizarStatus();
    } catch (e) {
      document.getElementById('vendedor').innerHTML = '<option>Erro ao carregar</option>';
    }
  }

  function atualizarStatus() {
    const loja = document.getElementById('loja').value;
    const vend = document.getElementById('vendedor').value;
    const manualNome = document.getElementById('vendedor-manual').value.trim();
    const status = document.getElementById('setup-status');
    const box = document.getElementById('bipe-box');
    const input = document.getElementById('codigo');
    let vendNome = '';
    let temVendedor = false;
    if (vend === '__manual__') {
      vendNome = manualNome;
      temVendedor = manualNome.length >= 2;
    } else if (vend) {
      vendNome = sellers.find(s => s.id === vend)?.name || '';
      temVendedor = true;
    }
    if (loja && temVendedor) {
      const lojaNome = stores.find(s => s.id === loja)?.name || '';
      status.className = 'setup-status status-ok';
      status.textContent = '✓ Pronto: ' + vendNome + ' em ' + lojaNome;
      box.classList.remove('locked');
      input.disabled = false;
      input.placeholder = 'Bipe ou digite aqui...';
      // Só dá foco no input do bipe se o usuário NÃO estiver digitando em outro campo
      const active = document.activeElement;
      if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'SELECT') || active === input) {
        setTimeout(() => input.focus(), 0);
      }
    } else {
      status.className = 'setup-status status-warn';
      status.textContent = vend === '__manual__' && !manualNome ? '⚠️ Digite o nome do vendedor' : '⚠️ Selecione loja e vendedor antes de bipar';
      box.classList.add('locked');
      input.disabled = true;
      input.placeholder = 'Aguardando loja/vendedor...';
    }
  }

  document.getElementById('loja').addEventListener('change', async (e) => {
    const v = e.target.value;
    localStorage.setItem(STORAGE_LOJA, v);
    localStorage.removeItem(STORAGE_VEND);
    await carregarVendedores(v);
  });

  document.getElementById('vendedor').addEventListener('change', (e) => {
    const v = e.target.value;
    localStorage.setItem(STORAGE_VEND, v);
    const manualInput = document.getElementById('vendedor-manual');
    if (v === '__manual__') {
      manualInput.style.display = 'block';
      manualInput.focus();
      localStorage.setItem(STORAGE_VENDNAME, manualInput.value || '');
    } else {
      manualInput.style.display = 'none';
      const nome = sellers.find(s => s.id === v)?.name || '';
      localStorage.setItem(STORAGE_VENDNAME, nome);
    }
    atualizarStatus();
  });

  document.getElementById('vendedor-manual').addEventListener('input', (e) => {
    localStorage.setItem(STORAGE_VENDNAME, e.target.value.trim());
    atualizarStatus();
  });

  async function enviarBipe(barcode) {
    const storeId = document.getElementById('loja').value;
    const sellerSel = document.getElementById('vendedor').value;
    const manualNome = document.getElementById('vendedor-manual').value.trim();
    const sellerName = localStorage.getItem(STORAGE_VENDNAME) || (sellerSel === '__manual__' ? manualNome : '');
    const sellerId = sellerSel === '__manual__' ? null : sellerSel;
    if (!storeId || (!sellerId && !sellerName)) {
      alert('Selecione loja e vendedor primeiro!');
      return;
    }
    try {
      const r = await fetch('/api/stocktake/bipe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ barcode, storeId, sellerId, sellerName }),
      });
      const d = await r.json();
      const ts = new Date().toISOString();
      const bipe = { ts, code: barcode, ...d };
      bipes.push(bipe);
      renderLast(bipe);
      renderLista();
      renderStats();
    } catch (e) {
      const bipe = { ts: new Date().toISOString(), code: barcode, found: false, error: e.message };
      bipes.push(bipe);
      renderLast(bipe);
      renderLista();
      renderStats();
    }
  }

  function renderLast(bipe) {
    const el = document.getElementById('last-bipe');
    if (bipe.found && bipe.product) {
      el.className = 'last-bipe';
      el.innerHTML = `
        ${bipe.product.imageUrl ? `<img src="${bipe.product.imageUrl}" onerror="this.style.display='none'">` : '<div style="width:50px;height:60px;background:#eee;border-radius:6px"></div>'}
        <div class="last-bipe-info">
          <div class="name">${bipe.product.name}</div>
          <div class="meta">${bipe.product.brand || ''} · Tam ${bipe.product.size || '—'} · ${bipe.code}</div>
        </div>
      `;
    } else {
      el.className = 'last-bipe not-found';
      el.innerHTML = `
        <div style="width:50px;height:60px;background:#fff;border:1.5px solid #d70015;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#d70015;font-size:24px;font-weight:900">?</div>
        <div class="last-bipe-info">
          <div class="name">Produto não encontrado</div>
          <div class="meta">${bipe.code} — bipe salvo no sistema pra revisão</div>
        </div>
      `;
    }
  }

  function renderLista() {
    const lista = document.getElementById('lista');
    document.getElementById('lista-count').textContent = bipes.length + ' itens';
    if (bipes.length === 0) {
      lista.innerHTML = '<div class="empty">Os bipes aparecerão aqui em tempo real</div>';
      return;
    }
    const visiveis = bipes.slice().reverse().slice(0, 100);
    lista.innerHTML = visiveis.map((b, idx) => {
      const realIdx = bipes.length - 1 - idx;
      const hora = new Date(b.ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const cls = b.found ? '' : 'not-found';
      return `<div class="item ${cls}">
        <span class="ts">${hora}</span>
        <span class="info">
          <div class="name">${b.found && b.product ? b.product.name : '❌ Não encontrado'}</div>
          <div class="code">${b.code}${b.product?.size ? ' · Tam ' + b.product.size : ''}</div>
        </span>
        <button class="del" onclick="removerBipe(${realIdx})" title="Remover da tela">✕</button>
      </div>`;
    }).join('');
  }

  function renderStats() {
    document.getElementById('stat-total').textContent = bipes.length;
    document.getElementById('stat-found').textContent = bipes.filter(b => b.found).length;
    document.getElementById('stat-notfound').textContent = bipes.filter(b => !b.found).length;
  }

  function removerBipe(idx) {
    if (!confirm('Remover este bipe da tela?\n(O registro fica no sistema — pra apagar de verdade, peça ao admin.)')) return;
    bipes.splice(idx, 1);
    renderLista();
    renderStats();
  }

  function limparTela() {
    if (bipes.length === 0) return;
    if (!confirm('Limpar a tela?\nOs bipes JÁ FORAM SALVOS no sistema. Esta ação só esconde da tela.')) return;
    bipes = [];
    renderLista();
    renderStats();
    document.getElementById('last-bipe').className = 'last-bipe idle';
    document.getElementById('last-bipe').textContent = 'Aguardando próximo bipe...';
  }

  function abrirContagem() {
    alert('Pra ver a contagem completa do dia, peça ao admin.\nNo sistema admin: aba "Estoque" → "Bipes da Contagem".');
  }

  const input = document.getElementById('codigo');

  // ============================================================
  // DEFESAS ANTI-BIPADOR-BUGADO
  // ============================================================
  // Alguns bipadores USB sem fio bugam e disparam keystroke
  // repetido infinito ("333333..." ou similar). Defesas:
  //   1. Se chegarem >12 chars iguais consecutivos sem Enter → reset
  //   2. Se input passar de 60 chars sem Enter → trava e mostra alerta
  //      (códigos de barras reais têm 8-14 dígitos)
  //   3. Botão "Reset" emergencial sempre disponível
  //   4. Overlay opcional de debug (#debug=1 na URL)
  // ============================================================

  const DEBUG = new URLSearchParams(location.search).get('debug') === '1';
  let lastChar = '';
  let sameCharCount = 0;
  let lastKeyTime = 0;
  let debugOverlay = null;

  if (DEBUG) {
    debugOverlay = document.createElement('div');
    debugOverlay.id = 'debug-overlay';
    debugOverlay.style.cssText = 'position:fixed;bottom:10px;right:10px;width:300px;max-height:240px;overflow:auto;background:rgba(0,0,0,0.85);color:#0f0;font:11px/1.3 monospace;padding:8px;border-radius:6px;z-index:99999';
    debugOverlay.innerHTML = '<b style="color:#fff">DEBUG (?debug=1)</b><br>Aperte trigger do bipador...';
    document.body.appendChild(debugOverlay);
  }

  function logDebug(line) {
    if (!debugOverlay) return;
    const div = document.createElement('div');
    div.textContent = `[${new Date().toISOString().slice(11,23)}] ${line}`;
    debugOverlay.appendChild(div);
    debugOverlay.scrollTop = debugOverlay.scrollHeight;
    while (debugOverlay.children.length > 50) debugOverlay.firstChild?.remove();
  }

  function resetInput(reason) {
    input.value = '';
    lastChar = '';
    sameCharCount = 0;
    if (reason) {
      console.warn('[bipar] reset:', reason);
      logDebug('RESET: ' + reason);
      const el = document.getElementById('last-bipe');
      if (el) {
        el.className = 'last-bipe error';
        el.textContent = '⚠️ Leitor bugado, resetei. Tente bipar de novo. (' + reason + ')';
      }
    }
  }

  input.addEventListener('keydown', (e) => {
    const now = Date.now();
    const dt = now - lastKeyTime;
    lastKeyTime = now;

    if (DEBUG) logDebug(`key="${e.key}" code=${e.code} dt=${dt}ms len=${input.value.length}`);

    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value.trim();
      if (v) {
        // Valida: código de barras esperado tem 6-20 dígitos (EAN-8/13, GTIN, UPC, Code128)
        // Mas NÃO bloqueia: deixa enviar e backend valida — só avisa
        if (v.length > 20) {
          resetInput('código muito longo (' + v.length + ' chars). Bipador travado?');
          return;
        }
        if (/^(.)\1{6,}$/.test(v)) {
          // String tipo "33333333" ou "11111111" — claro bug do leitor
          resetInput('código com char repetido (bipador bugado): ' + v.slice(0, 20));
          return;
        }
        enviarBipe(v);
        input.value = '';
        lastChar = '';
        sameCharCount = 0;
      }
      return;
    }

    // Detecta stream de char repetido (bug do bipador)
    // Real barcode é unique pattern (várias letras/dígitos diferentes), nunca 12x mesmo char.
    if (e.key.length === 1) { // ignora teclas especiais
      if (e.key === lastChar) {
        sameCharCount++;
        if (sameCharCount >= 12) {
          e.preventDefault();
          resetInput('detectei ' + sameCharCount + 'x o char "' + lastChar + '" — bipador bugado');
          return;
        }
      } else {
        lastChar = e.key;
        sameCharCount = 1;
      }
    }

    // Trava input gigante (>60 chars = bipador travado em loop)
    if (input.value.length > 60) {
      e.preventDefault();
      resetInput('input ultrapassou 60 chars — bipador travado');
    }
  });

  // Reset automático se ficar input parado >2s sem Enter (leitor enviou parcial e parou)
  setInterval(() => {
    if (input.value.length > 0 && Date.now() - lastKeyTime > 2000) {
      // tinha algo digitado, parou de receber, nunca veio Enter → provavelmente lixo
      if (input.value.length > 25 || /^(.)\1{6,}$/.test(input.value)) {
        resetInput('input ficou parado com lixo: ' + input.value.slice(0, 20));
      }
    }
  }, 1000);

  // Atalho global: tecla F2 reseta input emergencial
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') { e.preventDefault(); resetInput('manual via F2'); }
  });

  // Mantém foco no campo do bipe APENAS se o usuário não estiver editando outro input/select
  // Não rouba foco de inputs (vendedor-manual) nem dropdowns.
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' ||
        e.target.tagName === 'OPTION' || e.target.tagName === 'INPUT' ||
        e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) return;
    // Só pega foco se NENHUM outro input/select está focado
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT') && active !== input) return;
    if (!input.disabled) setTimeout(() => input.focus(), 0);
  });

  carregarLojas();
</script>
</body>
</html>
