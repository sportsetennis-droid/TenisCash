<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E5571E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TenisCash — Mensagens</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ========================================================
     DESIGN SYSTEM — TenisCash Mensagens (mobile-first)
     Identidade por tab:
       conv (chat)     → paleta neutra/profissional iMessage
       tl   (timeline) → paleta vibrante social, gradiente
     ======================================================== */
  :root {
    --bg-app: #f5f5f7;
    --bg-card: #ffffff;
    --bg-soft: #fafafc;
    --text: #0a0a0a;
    --text2: #6e6e73;
    --text3: #a8a8ad;
    --border: rgba(0,0,0,0.06);
    --border-strong: rgba(0,0,0,0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.04);
    --shadow-xl: 0 24px 64px rgba(0,0,0,0.16), 0 8px 16px rgba(0,0,0,0.04);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-xl: 28px;
    --orange: #FF6A1F;
    --orange-soft: #FFEBDC;
    --green: #25d366;
    --red: #ff3b30;
    --blue: #0a84ff;
    --purple: #8e44ec;
    --pink: #ff2d92;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.4, 1.4, 0.5, 1);

    /* tab accent (defaults; redefined per tab via body[data-tab]) */
    --accent: var(--orange);
    --accent-soft: var(--orange-soft);
    --accent-grad: linear-gradient(135deg, #FF6A1F 0%, #EE7240 100%);
    --header-bg: rgba(255,255,255,0.85);
    --header-text: var(--text);
  }
  body[data-tab="conv"] {
    --accent: #007aff;
    --accent-soft: #e1efff;
    --accent-grad: linear-gradient(135deg, #007aff 0%, #0a84ff 100%);
    --header-bg: rgba(255,255,255,0.85);
    --header-text: var(--text);
  }
  body[data-tab="tl"] {
    --accent: #FF6A1F;
    --accent-soft: #FFEBDC;
    --accent-grad: linear-gradient(135deg, #FF6A1F 0%, #FF2D92 60%, #8E44EC 100%);
    --header-bg: var(--accent-grad);
    --header-text: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-feature-settings: 'cv11', 'ss01', 'ss03'; }
  html, body { height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { background: var(--bg-app); color: var(--text); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); transition: background 0.35s var(--ease); }
  @media (min-width: 900px) {
    body { background: radial-gradient(circle at 20% 20%, #fff6ef 0%, transparent 50%), radial-gradient(circle at 80% 80%, #fde4f1 0%, transparent 50%), #f0f0f5; }
  }
  button { font-family: inherit; }
  /* Scrollbar fina e elegante (desktop). Mobile usa scroll overlay nativo. */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.32); background-clip: padding-box; border: 2px solid transparent; }
  * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }

  /* ===== APP SHELL ===== */
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg-app); position: relative; overflow: hidden; }

  /* === DESKTOP (>=1024px): split layout, sidebar fixa + thread sempre aberta === */
  @media (min-width: 1024px) {
    html, body { overflow: hidden; height: 100vh; }
    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: auto 1fr;
      max-width: 1280px;
      width: calc(100vw - 40px);
      height: calc(100vh - 40px);
      margin: 20px auto;
      border-radius: 24px;
      box-shadow: var(--shadow-xl);
      border: 1px solid rgba(0,0,0,0.06);
      overflow: hidden;
      background: var(--bg-card);
    }
    /* Topbar atravessa as 2 colunas */
    .app-top { grid-column: 1 / -1; grid-row: 1; }
    /* Content (lista) na coluna 1 */
    .content { grid-column: 1; grid-row: 2; border-right: 1px solid var(--border); background: var(--bg-app); overflow-y: auto; padding-bottom: 80px; }
    /* Bottom-nav vira nav-tabs dentro da sidebar */
    .bottom-nav { position: absolute; bottom: 16px; left: 16px; right: auto; transform: none; width: 328px; justify-content: space-around; }
    /* Thread/feed sempre visível na coluna 2 */
    .screen-thread {
      display: flex !important;
      position: static;
      grid-column: 2;
      grid-row: 2;
      max-width: none;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
      height: auto;
      padding-top: 0;
      padding-bottom: 0;
      background: var(--bg-app);
      animation: none;
    }
    /* Quando NADA está aberto, mostra placeholder */
    .screen-thread:not(.open) .thread-header,
    .screen-thread:not(.open) .thread-body,
    .screen-thread:not(.open) .composer { display: none; }
    .screen-thread:not(.open)::before {
      content: '';
      display: block;
      flex: 1;
      background:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="%23d2d2d7" stroke-width="1.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>')
        center center no-repeat;
    }
    .screen-thread:not(.open)::after {
      content: 'Selecione uma conversa ou timeline pra começar';
      display: block;
      text-align: center;
      color: var(--text2);
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 40vh;
    }
    .thread-header { border-radius: 0; }
    /* Botão back não faz sentido no desktop split */
    .screen-thread .back-btn { display: none; }
    /* Body do desktop ganha fundo gradient sutil */
    body { background: radial-gradient(circle at 20% 20%, #fff6ef 0%, transparent 50%), radial-gradient(circle at 80% 80%, #fde4f1 0%, transparent 50%), #f0f0f5; }
  }
  /* === Tablet/medium: continua frame celular centralizado === */
  @media (min-width: 900px) and (max-width: 1023.98px) {
    html, body { overflow: auto; }
    .app { height: calc(100vh - 40px); margin: 20px auto; border-radius: 32px; box-shadow: var(--shadow-xl); border: 1px solid rgba(0,0,0,0.06); overflow: hidden; }
  }

  /* ===== TOPBAR — muda de personalidade por tab ===== */
  .app-top {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    transition: all 0.4s var(--ease);
    position: relative;
    overflow: hidden;
  }
  body[data-tab="tl"] .app-top { border-bottom-color: transparent; }
  .app-top h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .app-top h1 .label { transition: opacity 0.3s var(--ease); }
  .app-top .user-chip { font-size: 13px; font-weight: 500; opacity: 0.85; }
  .app-top .gear-btn { background: rgba(0,0,0,0.05); border: none; cursor: pointer; padding: 6px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: inherit; transition: transform 0.2s var(--ease-spring); }
  body[data-tab="tl"] .app-top .gear-btn { background: rgba(255,255,255,0.2); }
  .app-top .gear-btn:active { transform: scale(0.92); }

  /* ===== CONTENT ===== */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-app); }
  .view { display: none; min-height: 100%; animation: fadeIn 0.3s var(--ease); }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== LIST HEADER ===== */
  .list-header { padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
  .list-header h2 { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.03em; }
  .list-header .header-actions { display: flex; gap: 8px; }
  .list-header button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s var(--ease-spring), box-shadow 0.2s var(--ease);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .list-header button:active { transform: scale(0.96); }
  body[data-tab="tl"] .list-header button { background: var(--accent-grad); }

  /* ===== LIST ITEMS (cartões de conversa / timeline) ===== */
  .list-items { padding: 4px 12px 100px; display: flex; flex-direction: column; gap: 6px; }
  .list-item {
    padding: 14px;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    min-height: 68px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s var(--ease-spring), box-shadow 0.2s var(--ease);
  }
  .list-item:active { transform: scale(0.985); box-shadow: var(--shadow-md); }
  .list-item .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #FF6A1F, #FF2D92);
    box-shadow: 0 4px 12px rgba(255,106,31,0.25);
  }
  .list-item.timeline-item .avatar { background: linear-gradient(135deg, #8E44EC, #0a84ff); box-shadow: 0 4px 12px rgba(142,68,236,0.25); }
  .list-item.timeline-item .avatar.public { background: linear-gradient(135deg, #FF6A1F, #FF2D92, #8E44EC); box-shadow: 0 4px 16px rgba(255,45,146,0.30); }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .list-item .preview { font-size: 13.5px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .list-item .meta { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .list-item .meta .time { font-size: 11px; color: var(--text3); font-weight: 500; }
  .list-item .meta .badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; display: inline-block; min-width: 20px; text-align: center; }
  body[data-tab="tl"] .list-item .meta .badge { background: var(--pink); }

  /* ===== EMPTY ===== */
  .empty { padding: 80px 24px; text-align: center; color: var(--text2); }
  .empty .icon { font-size: 64px; opacity: 0.4; margin-bottom: 16px; }
  .empty .title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.01em; }
  .empty .desc { font-size: 14px; color: var(--text2); max-width: 280px; margin: 0 auto; line-height: 1.5; }

  /* ===== BOTTOM NAV — pill flutuante moderno ===== */
  .bottom-nav {
    position: absolute;
    bottom: calc(12px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.9);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 999px;
    padding: 6px;
    box-shadow: var(--shadow-lg);
    z-index: 5;
  }
  .bottom-nav button {
    background: none;
    border: none;
    padding: 10px 18px;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: all 0.25s var(--ease);
    letter-spacing: -0.01em;
  }
  .bottom-nav button .icon { font-size: 18px; line-height: 1; }
  .bottom-nav button.active {
    color: #fff;
    background: var(--accent);
  }
  body[data-tab="tl"] .bottom-nav button.active { background: var(--accent-grad); }
  .bottom-nav button .badge {
    position: absolute;
    top: 2px;
    right: 4px;
    background: var(--red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 999px;
    min-width: 16px;
    text-align: center;
    border: 2px solid #fff;
  }

  /* ===== THREAD / FEED FULLSCREEN ===== */
  .screen-thread {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-app);
    display: none;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    animation: slideUp 0.3s var(--ease);
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (min-width: 900px) {
    .screen-thread { border-radius: 32px; height: calc(100vh - 40px); top: 20px; bottom: 20px; box-shadow: var(--shadow-xl); overflow: hidden; }
  }
  .screen-thread.open { display: flex; }
  .thread-header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  body[data-tab="tl"] .thread-header { border-bottom-color: transparent; }
  .thread-header .back-btn {
    background: rgba(0,0,0,0.06);
    border: none;
    color: inherit;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s var(--ease-spring);
    flex-shrink: 0;
  }
  body[data-tab="tl"] .thread-header .back-btn { background: rgba(255,255,255,0.22); }
  .thread-header .back-btn:active { transform: scale(0.9); }
  .thread-header .title { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; line-height: 1.2; }
  .thread-header .subtitle { font-size: 12px; opacity: 0.75; margin-top: 1px; font-weight: 500; }
  .thread-body { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

  /* ===== BOLHAS (chat) ===== */
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 22px;
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    position: relative;
    transition: transform 0.15s var(--ease-spring), box-shadow 0.2s var(--ease);
  }
  .bubble.from-me {
    align-self: flex-end;
    background: linear-gradient(135deg, #007aff 0%, #0a84ff 100%);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 8px rgba(10,132,255,0.25);
  }
  .bubble.from-other {
    align-self: flex-start;
    background: #fff;
    color: var(--text);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .bubble .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; font-weight: 500; }
  .bubble.long-press-active { transform: scale(0.97); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }

  /* ===== POSTS (timeline) ===== */
  .post {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    overflow: hidden; /* foto edge-to-edge respeita os cantos arredondados */
    transition: transform 0.15s var(--ease-spring);
  }
  .post:active { transform: scale(0.99); }
  .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .post-author-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .post-author-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8E44EC, #FF2D92);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  .post-author { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; line-height: 1.2; color: var(--text); }
  .post-author .username { color: var(--text2); font-weight: 500; font-size: 12.5px; }
  .post-time { font-size: 12px; color: var(--text3); margin-top: 2px; font-weight: 500; }
  .post-actions-btn { background: transparent; border: none; color: var(--text2); cursor: pointer; padding: 4px 8px; border-radius: 8px; font-size: 18px; transition: background 0.15s; }
  .post-actions-btn:active { background: var(--bg-soft); }
  .post-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: var(--text); margin-bottom: 6px; }

  /* ===== PRODUCT CARDS ===== */
  .prod-card {
    display: flex;
    gap: 12px;
    padding: 10px;
    border-radius: var(--radius-sm);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    margin-top: 6px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s var(--ease-spring);
  }
  .prod-card:active { transform: scale(0.98); }
  .bubble.from-me .prod-card { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); color: #fff; backdrop-filter: blur(8px); }
  .prod-card .pc-img { width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover; background: #f0f0f5; flex-shrink: 0; }
  .prod-card .pc-info { flex: 1; min-width: 0; }
  .prod-card .pc-name { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prod-card .pc-brand { font-size: 11.5px; opacity: 0.75; font-weight: 500; margin-top: 2px; }
  .prod-card .pc-price { font-size: 13.5px; font-weight: 700; margin-top: 3px; letter-spacing: -0.01em; }
  .prod-card .pc-old { font-size: 11.5px; text-decoration: line-through; opacity: 0.5; margin-right: 4px; font-weight: 500; }

  /* ===== COMPOSER ===== */
  .composer {
    background: rgba(255,255,255,0.95);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .composer .attach-chip {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    animation: fadeIn 0.2s var(--ease);
  }
  .composer .attach-chip button { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; opacity: 0.7; }
  .composer-row { display: flex; gap: 6px; align-items: flex-end; }
  .composer textarea {
    flex: 1;
    min-height: 44px;
    max-height: 120px;
    padding: 11px 16px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    font-size: 15px;
    resize: none;
    font-family: inherit;
    outline: none;
    background: var(--bg-soft);
    transition: border 0.2s var(--ease), background 0.2s var(--ease);
  }
  .composer textarea:focus { border-color: var(--accent); background: #fff; }
  .composer .attach-btn {
    background: var(--bg-soft);
    border: 1.5px solid var(--border);
    color: var(--text2);
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s var(--ease-spring);
  }
  .composer .attach-btn:active { transform: scale(0.92); border-color: var(--accent); color: var(--accent); }
  .composer .send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    width: 44px; height: 44px;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 700;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s var(--ease-spring), opacity 0.2s var(--ease);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  body[data-tab="tl"] .composer .send-btn { background: var(--accent-grad); }
  .composer .send-btn:active { transform: scale(0.92); }
  .composer .send-btn:disabled { opacity: 0.35; }
  .composer-hint { font-size: 11.5px; color: var(--text2); margin-top: 8px; text-align: center; font-weight: 500; }

  /* ===== MODAL (bottom sheet) ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s var(--ease); }
  .modal {
    background: #fff;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.3s var(--ease);
    box-shadow: var(--shadow-xl);
  }
  .modal::before { content: ''; display: block; width: 36px; height: 4px; background: var(--border-strong); border-radius: 999px; margin: -8px auto 16px; }
  .modal h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; color: var(--text); }
  .modal label { display: block; font-size: 12px; letter-spacing: -0.01em; color: var(--text2); font-weight: 600; margin-bottom: 8px; }
  .modal input[type=text] { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 16px; margin-bottom: 16px; background: var(--bg-soft); transition: border 0.2s var(--ease), background 0.2s var(--ease); font-family: inherit; }
  .modal input[type=text]:focus { outline: none; border-color: var(--accent); background: #fff; }
  .modal-search-result { padding: 12px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; gap: 10px; cursor: pointer; transition: background 0.15s; }
  .modal-search-result:hover, .modal-search-result:active { background: var(--bg-soft); }
  .modal-search-result button { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .modal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .modal-chip { background: var(--accent-soft); color: var(--accent); padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .modal-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; opacity: 0.6; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal-actions button { padding: 13px 16px; border-radius: var(--radius-md); font-size: 15px; font-weight: 700; cursor: pointer; border: none; flex: 1; transition: transform 0.15s var(--ease-spring); }
  .modal-actions button:active { transform: scale(0.97); }
  .modal-actions .btn-secondary { background: var(--bg-soft); color: var(--text); }
  .modal-actions .btn-primary { background: var(--accent); color: #fff; }
  body[data-tab="tl"] .modal-actions .btn-primary { background: var(--accent-grad); }

  /* ===== PRODUCT SEARCH ITEM ===== */
  .prod-search-item { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; align-items: center; transition: background 0.15s; }
  .prod-search-item:active { background: var(--bg-soft); }
  .prod-search-item img { width: 52px; height: 52px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-soft); flex-shrink: 0; }
  .prod-search-item .name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; line-height: 1.3; }
  .prod-search-item .meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .prod-search-item .price { font-weight: 700; color: var(--accent); font-size: 14px; letter-spacing: -0.01em; }

  /* ===== LOGIN REQUIRED ===== */
  .login-required { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 20px; padding: 24px; text-align: center; }
  .login-required h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .login-required a { background: var(--orange); color: #fff; padding: 14px 28px; border-radius: 999px; text-decoration: none; font-weight: 700; box-shadow: 0 4px 16px rgba(255,106,31,0.3); }

  /* ===== ACTION SHEET (long-press) ===== */
  .action-sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.4); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 25; }
  .action-sheet.open { display: flex; animation: fadeIn 0.2s var(--ease); }
  .action-sheet .sheet { background: #fff; border-radius: 24px 24px 0 0; max-width: 480px; width: 100%; padding-bottom: env(safe-area-inset-bottom); animation: slideUp 0.3s var(--ease); box-shadow: var(--shadow-xl); }
  .action-sheet .sheet::before { content: ''; display: block; width: 36px; height: 4px; background: var(--border-strong); border-radius: 999px; margin: 8px auto 0; }
  .action-sheet .sheet .emoji-row { display: flex; justify-content: space-around; padding: 16px 12px; gap: 4px; }
  .action-sheet .sheet .emoji-row button { font-size: 32px; padding: 8px; border-radius: 16px; background: none; border: none; cursor: pointer; flex: 1; transition: transform 0.15s var(--ease-spring), background 0.15s; }
  .action-sheet .sheet .emoji-row button:active { transform: scale(1.2); background: var(--bg-soft); }
  .action-sheet button { width: 100%; padding: 16px; background: none; border: none; border-top: 1px solid var(--border); font-size: 16px; font-weight: 600; cursor: pointer; color: var(--text); transition: background 0.15s; }
  .action-sheet button:active { background: var(--bg-soft); }
  .action-sheet button.danger { color: var(--red); }
  .action-sheet button.cancel { font-weight: 700; }

  /* ===== REACTIONS chips ===== */
  .reactions-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .reaction-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s var(--ease-spring);
  }
  .reaction-chip:active { transform: scale(0.92); }
  .reaction-chip.mine { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .bubble.from-me .reaction-chip { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); color: #fff; }
  .bubble.from-me .reaction-chip.mine { background: #fff; color: var(--accent); border-color: #fff; }

  /* ===== MEDIA (photo/audio) — padronizado: 4:3 sempre, object-fit cover ===== */
  .media-photo {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    margin-top: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  /* Post na timeline: foto enche o card todo (edge-to-edge tipo Instagram) */
  .post .media-photo {
    width: calc(100% + 32px);
    margin: 12px -16px 0;
    border-radius: 0;
    aspect-ratio: 4 / 3;
    box-shadow: none;
  }
  .post .media-photo:last-child {
    border-bottom-left-radius: var(--radius-md);
    border-bottom-right-radius: var(--radius-md);
    margin-bottom: -16px;
  }
  /* Chat bubble: foto 100% da bolha, aspect-ratio mantido */
  .bubble .media-photo {
    width: 100%;
    margin-top: 4px;
    aspect-ratio: 4 / 3;
  }
  /* Áudio */
  .media-audio { display: block; width: 100%; margin-top: 8px; height: 38px; }
  .bubble .media-audio { max-width: 100%; }

  /* ===== AUDIO RECORDING indicator ===== */
  .recording-bar {
    background: linear-gradient(135deg, #ff3b30, #ff2d92);
    color: #fff;
    padding: 10px 14px;
    border-radius: 999px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(255,59,48,0.3);
    animation: fadeIn 0.2s var(--ease);
  }
  .recording-bar .pulse { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }

  /* ===== HOJE: hero quando vazio ===== */
  body[data-tab="tl"] .list-header h2 { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="app">
  <div class="app-top">
    <h1>
      <span id="topbar-icon">💬</span>

<!-- THREAD/FEED FULLSCREEN -->
<div class="screen-thread" id="thread-screen">

    <div style="flex:1">

    <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="onPhotoChosen(event)">

</div>

<!-- MODAL: Profile / Username / Push -->
<div class="modal-overlay" id="modal-profile">
  <div class="modal">
    <h2>⚙️ Perfil</h2>
    <label>Seu @username (pra ser convidado em timeline)</label>
    <input type="text" id="profile-username" placeholder="ex: douglas, joaobessa">
    <div style="font-size:11px;color:#888;margin-top:-8px;margin-bottom:14px">3-20 caracteres: a-z, 0-9, _ ou .</div>
    <button class="btn-primary" style="width:100%;padding:12px;border:none;border-radius:10px;background:#E5571E;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px" onclick="saveUsername()">Salvar username</button>

    <label>Notificações push</label>

    <button class="btn-primary" id="push-toggle-btn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#E5571E;color:#fff;font-weight:700;font-size:14px;cursor:pointer" onclick="togglePush()">Ativar notificações</button>

<script>
const API = '/api/messages-v2';
const STATE = {
  view: 'conv',
  userId: null,
  conversations: [],
  timelines: [],
  activeKind: null,        // 'conv' | 'tl'
  activeId: null,
  activeMessages: [],
  activePosts: [],
  activeMeta: null,
  inviteList: [],
  attachedProduct: null,
  attachedMedia: null,
  pollTimer: null,
};

function getToken() { return localStorage.getItem('tc_admin_token') || ''; }
function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  if (res.status === 401) {
    document.body.innerHTML = '<div class="login-required"><div style="font-size:60px">🔒</div><h2>Faça login no admin primeiro</h2><a href="/admin.html">Ir pra Login</a></div>';
    throw new Error('unauth');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function initials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ============= VIEWS =============
function switchView(name) {
  STATE.view = name;
  document.body.dataset.tab = name; // muda paleta (conv azul / tl gradiente vibrante)
  const labels = { conv: 'Mensagens', tl: 'Hoje' };
  const icons = { conv: '💬', tl: '✨' };
  document.getElementById('topbar-label').textContent = labels[name] || 'TenisCash';
  document.getElementById('topbar-icon').textContent = icons[name] || '💬';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'tl' && STATE.timelines.length === 0) loadTimelines();
}

// ============= CONVERSAS LIST =============
async function loadConversations() {
  try {
    const d = await api('/conversations');
    STATE.conversations = d.conversations || [];
    renderConversations();
  } catch (e) { document.getElementById('conv-items').innerHTML = `<div class="empty"><div class="icon">⚠️</div><div class="desc">${escapeHtml(e.message)}</div></div>`; }
}
function renderConversations() {
  const el = document.getElementById('conv-items');
  if (STATE.conversations.length === 0) {
    el.innerHTML = '<div class="empty"><div class="icon">💬</div><div class="title">Sem conversas</div><div class="desc">As conversas aparecem aqui quando alguém te escreve.</div></div>';
    return;
  }
  el.innerHTML = STATE.conversations.map(c => {
    const name = c.otherParty?.name || '(conversa)';
    const preview = c.lastMessage?.content || (c.lastMessage?.productCardId ? '🛍️ Produto' : (c.lastMessage?.mediaType ? '[mídia]' : 'Iniciar conversa'));
    return `
      <div class="list-item" data-id="${c.id}">
        <div class="avatar">${initials(name)}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="preview">${escapeHtml(preview)}</div>
        </div>
        <div class="meta">
          <div class="time">${formatTime(c.lastMessageAt)}</div>
          ${c.unreadCount > 0 ? `<div class="badge">${c.unreadCount}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.list-item').forEach(it => {
    it.addEventListener('click', () => openConversation(it.getAttribute('data-id')));
  });
}

// ============= TIMELINES LIST =============
async function loadTimelines() {
  try {
    const d = await api('/timelines');
    STATE.timelines = d.timelines || [];
    renderTimelines();
  } catch (e) { document.getElementById('tl-items').innerHTML = `<div class="empty"><div class="icon">⚠️</div><div class="desc">${escapeHtml(e.message)}</div></div>`; }
}
function renderTimelines() {
  const el = document.getElementById('tl-items');
  if (STATE.timelines.length === 0) {
    el.innerHTML = '<div class="empty"><div class="icon">📭</div><div class="title">Sem timelines</div><div class="desc">Crie uma privada com seus amigos ou time.</div></div>';
    return;
  }
  el.innerHTML = STATE.timelines.map(t => `
    <div class="list-item timeline-item" data-id="${t.id}">
      <div class="avatar ${t.isPublic ? 'public' : ''}">${t.isPublic ? '🌍' : '👥'}</div>
      <div class="info">
        <div class="name">${escapeHtml(t.name)}</div>
        <div class="preview">${t.isPublic ? 'Geral · todos veem' : (t.memberCount + ' pessoas · privada')}</div>
      </div>
      <div class="meta">
        ${t.unreadCount > 0 ? `<div class="badge">${t.unreadCount}</div>` : ''}
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.list-item').forEach(it => {
    it.addEventListener('click', () => openTimeline(it.getAttribute('data-id')));
  });
}

// ============= THREAD (chat) =============

function renderThread() {
  const body = document.getElementById('thread-body');

function renderBubble(m) {
  const fromMe = m.senderId === STATE.userId;
  return `
    <div class="bubble ${fromMe ? 'from-me' : 'from-other'}" data-id="${m.id}" data-from-me="${fromMe ? 1 : 0}" data-created="${m.createdAt}" data-target-type="message">
      ${m.productCard ? renderProductCard(m.productCard) : ''}
      ${m.content ? `<div>${escapeHtml(m.content)}</div>` : ''}
      ${m.mediaUrl ? renderMedia(m) : ''}
      <div class="meta">
        ${m.editedAt ? '<span style="opacity:0.6">editada</span>' : ''}
        ${formatTime(m.createdAt)}
        ${fromMe ? (m.readAt ? '✓✓' : '✓') : ''}
      </div>
      ${renderReactions(m.reactionsGrouped, m.id, 'message')}
    </div>
  `;
}

function renderMedia(item) {
  if (!item.mediaUrl) return '';
  if (item.mediaType === 'photo' || /^data:image\//.test(item.mediaUrl)) {
    return `<img class="media-photo" src="${escapeHtml(item.mediaUrl)}" alt="foto" loading="lazy">`;
  }
  if (item.mediaType === 'audio' || /^data:audio\//.test(item.mediaUrl)) {
    return `<audio class="media-audio" controls src="${escapeHtml(item.mediaUrl)}"></audio>`;
  }
  return `<div style="font-size:12px;opacity:0.8">[${item.mediaType || 'mídia'}]</div>`;
}

function renderReactions(grouped, targetId, targetType) {
  if (!grouped || grouped.length === 0) return '';
  return `<div class="reactions-row">${grouped.map(g => `
    <span class="reaction-chip ${g.mine ? 'mine' : ''}" onclick="toggleReaction('${targetType}','${targetId}','${g.emoji}')">${g.emoji} ${g.count}</span>

}

// ============= SEND =============
async function sendActive() {
  const input = document.getElementById('composer-input');
  const content = input.value.trim();
  const productCardId = STATE.attachedProduct?.id || null;
  const media = STATE.attachedMedia;
  if (!content && !productCardId && !media) return;
  if (!STATE.activeId) return;
  input.disabled = true;
  document.getElementById('send-btn').disabled = true;
  try {
    const body = { content: content || null };
    if (productCardId) body.productCardId = productCardId;
    if (media) {
      body.mediaType = media.type;
      body.mediaUrl = media.dataUrl;
      if (media.duration) body.mediaDuration = media.duration;
    }
    if (STATE.activeKind === 'conv') {
      const d = await api('/conversations/' + STATE.activeId + '/messages', { method: 'POST', body: JSON.stringify(body) });
      STATE.activeMessages.push(d.message);
      renderThread();
      loadConversations();
    } else {
      const d = await api('/timelines/' + STATE.activeId + '/posts', { method: 'POST', body: JSON.stringify(body) });
      STATE.activePosts.unshift(d.post);
      renderFeed();
    }
    input.value = '';
    input.style.height = '';
    clearAttached();
  } catch (e) { alert('Erro: ' + e.message); }
  finally { input.disabled = false; document.getElementById('send-btn').disabled = false; input.focus(); }
}

// ============= LONG PRESS / ACTIONS =============
function wireBubbleLongPress() {
  document.querySelectorAll('.bubble').forEach(el => {
    let timer = null;
    let pressed = false;
    const start = () => { pressed = true; timer = setTimeout(() => { if (pressed) { el.classList.add('long-press-active'); openBubbleActionSheet(el); } }, 400); };
    const cancel = () => { pressed = false; clearTimeout(timer); el.classList.remove('long-press-active'); };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
  });
}

async function onPhotoChosen(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = ''; // permite re-escolher mesma foto
  if (!file) return;
  if (!/^image\//.test(file.type)) { alert('Selecione uma foto'); return; }
  try {
    const dataUrl = await compressImage(file, 1280, 0.7);
    if (dataUrl.length > 700 * 1024) {
      // recomprime mais agressivo se ficou grande
      const smaller = await compressImage(file, 1024, 0.6);
      STATE.attachedMedia = { type: 'photo', dataUrl: smaller };
    } else {
      STATE.attachedMedia = { type: 'photo', dataUrl };
    }
    renderAttachPreview();
  } catch (e) { alert('Erro processando foto: ' + e.message); }
}
function compressImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============= ÁUDIO (MediaRecorder) =============
let audioRecorder = null;
let audioChunks = [];
let audioStartedAt = 0;
async function toggleAudio() {
  if (audioRecorder && audioRecorder.state === 'recording') {
    stopAudio();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    audioStartedAt = Date.now();
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    audioRecorder = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 32000 }) : new MediaRecorder(stream);
    audioRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    audioRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: audioRecorder.mimeType });
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        if (dataUrl.length > 700 * 1024) { alert('Áudio muito longo (max ~30s)'); renderAttachPreview(); return; }
        const duration = Math.round((Date.now() - audioStartedAt) / 1000);
        STATE.attachedMedia = { type: 'audio', dataUrl, duration };
        renderAttachPreview();
      };
      reader.readAsDataURL(blob);
    };
    audioRecorder.start();
    document.getElementById('audio-btn').textContent = '⏹️';
    document.getElementById('audio-btn').style.background = '#d70015';
    document.getElementById('audio-btn').style.color = '#fff';
    document.getElementById('attach-preview').innerHTML = '<div class="recording-bar"><span class="pulse"></span> Gravando… (tap 🎤 pra parar)</div>';
    // auto-stop em 30s
    setTimeout(() => { if (audioRecorder && audioRecorder.state === 'recording') stopAudio(); }, 30000);
  } catch (e) { alert('Sem permissão de microfone: ' + e.message); }
}
function stopAudio() {
  if (audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
  document.getElementById('audio-btn').textContent = '🎤';
  document.getElementById('audio-btn').style.background = '';
  document.getElementById('audio-btn').style.color = '';
}

// ============= NOVA DM (busca pessoa + cria conv) =============
function openNewDmModal() {
  document.getElementById('dm-search-input').value = '';
  document.getElementById('dm-search-results').innerHTML = '<div style="font-size:13px;color:#888;padding:10px">Digite ao menos 2 caracteres.</div>';
  document.getElementById('modal-new-dm').classList.add('open');
  setTimeout(() => document.getElementById('dm-search-input').focus(), 80);
}
function closeNewDmModal() { document.getElementById('modal-new-dm').classList.remove('open'); }
let dmSearchDebounce;
function searchPeopleForDm() {
  clearTimeout(dmSearchDebounce);
  const q = document.getElementById('dm-search-input').value.trim();
  if (q.length < 2) { document.getElementById('dm-search-results').innerHTML = '<div style="font-size:13px;color:#888;padding:10px">Digite ao menos 2 caracteres.</div>'; return; }
  dmSearchDebounce = setTimeout(async () => {
    try {
      const d = await api('/people/search?q=' + encodeURIComponent(q));
      const people = (d.people || []).filter(p => p.id !== STATE.userId);
      const out = document.getElementById('dm-search-results');
      if (people.length === 0) { out.innerHTML = '<div style="font-size:13px;color:#888;padding:10px">Nenhuma pessoa encontrada</div>'; return; }
      out.innerHTML = people.map(p => `
        <div class="modal-search-result" data-id="${escapeHtml(p.id)}">
          <span><strong>${escapeHtml(p.name)}</strong>${p.username ? ' · @' + escapeHtml(p.username) : ''}</span>
          <button>Conversar</button>
        </div>
      `).join('');
      out.querySelectorAll('.modal-search-result').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.getAttribute('data-id');
          try {
            const r = await api('/conversations', { method: 'POST', body: JSON.stringify({ type: 'dm', toUserId: id }) });
            closeNewDmModal();
            await loadConversations();
            openConversation(r.conversation.id);
          } catch (e) { alert('Erro: ' + e.message); }
        });
      });
    } catch (e) { document.getElementById('dm-search-results').innerHTML = `<div style="color:red;padding:10px">Erro: ${escapeHtml(e.message)}</div>`; }
  }, 300);
}

// ============= PUSH NOTIFICATIONS =============
async function refreshPushStatus() {
  const status = document.getElementById('push-status');
  const btn = document.getElementById('push-toggle-btn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    status.textContent = '❌ Seu navegador não suporta notificações push';
    btn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'denied') {
    status.textContent = '🚫 Permissão bloqueada nas configurações do navegador';
    btn.style.display = 'none';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      status.textContent = '✅ Ativas neste dispositivo';
      btn.textContent = 'Desativar notificações';
      btn.style.background = '#666';
    } else {
      status.textContent = '⏸️ Desativadas';
      btn.textContent = 'Ativar notificações';
      btn.style.background = '#E5571E';
    }
  } catch (e) {
    status.textContent = 'Erro: ' + e.message;
  }
}
function urlBase64ToUint8Array(b64) {
  const padding = '='.repeat((4 - b64.length % 4) % 4);
  const base = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function togglePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      await api('/push/subscribe', { method: 'DELETE', body: JSON.stringify({ endpoint: existing.endpoint }) });
      await existing.unsubscribe();
      refreshPushStatus();
      return;
    }
    // pede permissão
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('Permissão negada'); refreshPushStatus(); return; }
    const keyResp = await api('/push/vapid-public-key');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyResp.publicKey),
    });
    await api('/push/subscribe', {
      method: 'POST',
      body: JSON.stringify({
        endpoint: sub.endpoint,
        keys: { p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'),
                auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_') },
        userAgent: navigator.userAgent,
      }),
    });
    refreshPushStatus();
    // teste imediato
    api('/push/test', { method: 'POST' }).catch(() => {});
  } catch (e) { alert('Erro ativando push: ' + e.message); refreshPushStatus(); }
}

// ============= BOOT =============
async function boot() {
  document.body.dataset.tab = 'conv'; // tema inicial (Mensagens, azul)
  if (!getToken()) {
    document.body.innerHTML = '<div class="login-required"><div style="font-size:60px">🔒</div><h2>Faça login no admin primeiro</h2><a href="/admin.html">Ir pra Login</a></div>';
    return;
  }
  try {
    const payload = JSON.parse(atob(getToken().split('.')[1]));
    STATE.userId = payload.userId;
  } catch {}
  try {
    const r = await fetch('/api/admin/me', { headers: authHeaders() });
    if (r.ok) {
      const d = await r.json();
      const me = d.user || d;
      document.getElementById('user-name').textContent = me.name || '';
      // Mostra botão "Atender" pra vendedor/admin com storeId
      if (['seller', 'admin', 'superadmin'].includes(me.role) && (me.storeId || me.role === 'admin' || me.role === 'superadmin')) {
        document.getElementById('seller-attend-btn').style.display = 'inline-block';
        if (me.store?.name) document.getElementById('seller-store-name').textContent = me.store.name;
      }
    }
  } catch {}

  // registra service worker pra push
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/sw.js'); } catch (e) { console.warn('SW register falhou', e); }
  }

  await loadConversations();
  await pollNotifications();
  STATE.pollTimer = setInterval(pollNotifications, 15000);

  // suporte a ?conv=ID ou ?user=ID na URL
  const params = new URLSearchParams(location.search);
  if (params.get('conv')) {
    setTimeout(() => openConversation(params.get('conv')), 300);
  } else if (params.get('user')) {
    // inicia DM com esse user
    api('/conversations', { method: 'POST', body: JSON.stringify({ type: 'dm', toUserId: params.get('user') }) })
      .then(r => { loadConversations(); openConversation(r.conversation.id); })
      .catch(e => console.warn('?user= falhou', e));
  }
}
boot();
