<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Seus dados · Club</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#111114;--mut:#5f5f6a;--line:#e4e4ea;--or:#E5571E;--red:#c4001a;--ok:#0a7a3d;--chip:#f0f0f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--card:#17171c;--tx:#f4f4f6;--mut:#a1a1aa;--line:#2a2a32;--chip:#22222a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Inter",system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto;padding:12px 16px}
h1{font-size:26px;margin:8px 0 4px;font-weight:900;font-style:italic;text-transform:uppercase}
h2{font-size:18px;margin:0 0 6px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}
.btn{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;margin-top:10px}
.btn.p{background:var(--or);border-color:var(--or);color:#fff}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.ok{color:var(--ok);font-weight:700}
.warn{background:var(--chip);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
a{color:var(--or)}
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.shbg.on{display:block}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-height:90vh;overflow:auto}
.sh.on{transform:none;visibility:visible}
.sh:not(.on){visibility:hidden;transition:transform .2s,visibility 0s .2s}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 12px;font-size:16px;font-family:inherit;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (min-width:900px){body{padding-top:24px}.app{box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:28px;min-height:80vh}}
</style>
</head>
<body>
<div class="app" id="app">
  <a href="/torneios.html" class="sub" style="display:inline-flex;align-items:center;min-height:44px">‹ Voltar</a>
  <h1>Seus dados</h1>
  <p class="sub">Club Sports &amp; Tennis — ligas, torneios e perfil de atleta.</p>
  <div id="body"><div class="card sub">Carregando…</div></div>
</div>
<div class="shbg" id="shbg"></div>
<div class="sh" id="sh" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  var TOKEN='';try{TOKEN=localStorage.getItem('tc_token')||'';}catch(_){}
  var box=document.getElementById('body');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},3000);}
  function api(path,opts){opts=opts||{};return fetch('/api/liga'+path,{method:opts.method||'GET',cache:'no-store',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:opts.body?JSON.stringify(opts.body):undefined});}
  if(!TOKEN){box.innerHTML='<div class="card" data-testid="privacy-login"><h2>Entre na sua conta</h2><p class="sub">Para baixar ou apagar seus dados, entre com o seu WhatsApp e senha.</p><a class="btn p" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="/torneios.html">Entrar</a></div>';return;}
  var PHRASE='APAGAR MEUS DADOS';
  api('/privacy/summary').then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});}).then(function(x){
    if(x.s===401){box.innerHTML='<div class="card" data-testid="privacy-login"><h2>Entre na sua conta</h2><a class="btn p" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="/torneios.html">Entrar</a></div>';return;}
    var S=x.j||{};PHRASE=S.confirmPhrase||PHRASE;
    box.innerHTML=
      '<div class="card"><h2>Baixar meus dados</h2><p class="sub">Um arquivo com tudo o que o Club guarda sobre você nas ligas: perfil de atleta, inscrições, elencos, gols e cartões da súmula, avisos que você escreveu, preferências de aviso, autorizações e medalhas. O CPF não vai no arquivo (a medalha só traz o código cifrado).</p>'+
      '<button class="btn p" type="button" data-a="export" data-testid="privacy-export">Baixar meus dados</button></div>'+
      '<div class="card"><h2>Apagar meus dados esportivos</h2>'+
      '<p class="sub">O que sai:</p><ul class="sub"><li>seu nome, foto e @ do perfil de atleta</li><li>seu nome nos elencos — na súmula você vira “Atleta removido” e os gols continuam valendo para o time</li><li>seus vínculos com times e clubes</li><li>suas preferências de aviso, os avisos no celular e as autorizações esportivas</li></ul>'+
      '<p class="sub" style="margin-top:10px">O que <b>fica</b>, porque a lei obriga a guardar: compras, notas fiscais, movimentações e o seu <b>saldo TenisCash</b>. Nenhum dinheiro é mexido.</p>'+
      (S.loginWillBeKept?'<div class="warn" data-testid="privacy-kept">Sua conta de login continua existindo por causa de: '+esc((S.keptBecause||[]).join(', '))+'. O pedido fica registrado e a equipe confere com você.</div>':'<div class="warn">Sem compras nem saldo: depois de apagar, a sua conta de login também é desativada.</div>')+
      '<button class="btn d" type="button" data-a="erase" data-testid="privacy-erase">Apagar meus dados esportivos</button></div>';
  }).catch(function(){box.innerHTML='<div class="card sub">Sem conexão. Tente de novo.</div>';});

  var bg=document.getElementById('shbg'),sh=document.getElementById('sh');
  function close(){bg.classList.remove('on');sh.classList.remove('on');}
  bg.addEventListener('click',close);
  function eraseSheet(){
    sh.innerHTML='<div class="grab"></div><h2>Tem certeza?</h2><p class="sub">Isso não tem volta. Para confirmar, digite <b>'+esc(PHRASE)+'</b>.</p>'+
      '<input id="cf" autocomplete="off" autocapitalize="characters" aria-label="Frase de confirmação" data-testid="privacy-phrase">'+
      '<button class="btn d" id="cf-ok" type="button" disabled data-testid="privacy-confirm">Apagar agora</button><button class="btn" id="cf-no" type="button">Cancelar</button>';
    bg.classList.add('on');sh.classList.add('on');
    var inp=document.getElementById('cf'),ok=document.getElementById('cf-ok');
    inp.addEventListener('input',function(){ok.disabled=inp.value.trim().toUpperCase()!==PHRASE;});
    document.getElementById('cf-no').onclick=close;
    ok.onclick=function(){
      ok.disabled=true;ok.textContent='Apagando…';
      api('/privacy/delete',{method:'POST',body:{confirm:inp.value.trim().toUpperCase()}}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});}).then(function(x){
        close();
        if(x.s!==200){toast((x.j&&x.j.error)||'Não deu para apagar agora');return;}
        var j=x.j;
        box.innerHTML='<div class="card" data-testid="privacy-done"><h2 class="ok">Pronto. Seus dados esportivos foram apagados.</h2>'+
          (j.loginExcluded?'<p class="sub">Sua conta de login foi desativada.</p>':'<p class="sub">Sua conta de login continua por causa de: '+esc((j.keptBecause||[]).join(', '))+'. O pedido ficou registrado para a equipe.</p>')+
          '<p class="sub">Compras, notas fiscais e saldo TenisCash não foram mexidos.</p></div>';
        if(j.loginExcluded){try{localStorage.removeItem('tc_token');}catch(_){}}
      }).catch(function(){close();toast('Sem conexão — tente de novo');});
    };
  }
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var a=b.getAttribute('data-a');
    if(a==='export'){
      b.disabled=true;b.textContent='Preparando…';
      api('/privacy/export').then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error||'erro');});return r.blob();}).then(function(blob){
        var u=URL.createObjectURL(blob);var l=document.createElement('a');l.href=u;l.download='meus-dados-club.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
        toast('Arquivo baixado');
      }).catch(function(err){toast(err.message||'Não deu para baixar');}).then(function(){b.disabled=false;b.textContent='Baixar meus dados';});
      return;
    }
    if(a==='erase')eraseSheet();
  });
})();
</script>
</body>
</html>
