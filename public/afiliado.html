<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Afiliado — Sports & Tennis</title>
<link rel="manifest" href="/manifest.json">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f7; color:#1d1d1f; padding-top:env(safe-area-inset-top); min-height:100vh; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:#f5f5f7; position:relative; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
  @media (min-width:760px){ body{padding:20px 0} .app{border-radius:24px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.16);min-height:calc(100vh - 40px)} }
  .topbar { background:linear-gradient(135deg,#5b5bd6,#7a7ae0); color:#fff; padding:16px 18px; }
  .topbar .t { font-size:17px; font-weight:800; }
  .topbar .sub { font-size:12px; opacity:.9; }
  .view { padding:16px; }
  h2.sec { font-size:13px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:#888; margin:4px 2px 12px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid #e5e5ea; border-radius:14px; padding:14px; }
  .stat .lbl { font-size:11px; color:#888; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .stat .val { font-size:22px; font-weight:800; margin-top:4px; }
  .stat .val.green{color:#1d8348} .stat .val.amber{color:#b26b00} .stat .val.blue{color:#5b5bd6}
  .card { background:#fff; border:1px solid #e5e5ea; border-radius:14px; padding:14px; margin-bottom:12px; }
  .card .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .muted { color:#888; font-size:13px; }
  .pill { font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; }
  .pill.pending{background:#fff6e5;color:#b26b00} .pill.paid,.pill.approved,.pill.available{background:#e8f7ee;color:#0a843d}
  .pill.rejected,.pill.reversed{background:#fdecea;color:#c0392b}
  .btn { min-height:46px; padding:0 16px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .btn.primary{background:#5b5bd6;color:#fff;width:100%}
  .btn.ghost{background:#fff;color:#5b5bd6;border:1.5px solid #5b5bd6}
  .btn.sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:10px}
  .btn.gray{background:#f0f0f3;color:#1d1d1f}
  .btn.green{background:#25d366;color:#fff}
  .btn:disabled{opacity:.5}
  label.f { display:block; font-size:12px; font-weight:700; color:#555; margin:12px 2px 5px; }
  input.f { width:100%; padding:12px 13px; font-size:16px; border:1.5px solid #e5e5ea; border-radius:11px; outline:none; }
  input.f:focus { border-color:#5b5bd6; }
  .help { font-size:12px; color:#999; margin:5px 2px 0; }
  .linkbox { background:#f5f5f7; border:1px solid #e5e5ea; border-radius:11px; padding:11px; font-size:13px; word-break:break-all; color:#555; }
  .nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #e5e5ea; display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:25; }
  .nav button { flex:1; background:none; border:none; padding:9px 4px; font-size:10px; font-weight:700; color:#999; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:60px; }
  .nav button.active { color:#5b5bd6; }
  .nav .ic { font-size:20px; }
  .thumb { width:54px; height:54px; border-radius:10px; object-fit:cover; background:#eee; flex-shrink:0; }
  .empty { text-align:center; color:#aaa; font-size:14px; padding:40px 20px; line-height:1.6; }
  .state { text-align:center; color:#999; padding:80px 24px; font-size:14px; line-height:1.6; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600; z-index:80; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="app" id="app"><div class="state">Carregando…</div></div>
  <div class="toast" id="toast"></div>
<script>
const API='/api/infoproducts';
const token=localStorage.getItem('tc_token')||'';
let state={ aff:null, tab:'resumo', market:[], links:[], commissions:[] };

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=(v)=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(d){ if(!d)return''; return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
async function copy(t){ try{ await navigator.clipboard.writeText(t); }catch(_){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(e){} document.body.removeChild(a);} toast('Copiado!'); }

async function api(path,{method='GET',body}={}){
  const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});
  if(res.status===401){ gate(); throw new Error('401'); }
  if(res.status===404 && path==='/affiliate/me') throw new Error('404');
  if(!res.ok){ let m='Erro'; try{m=(await res.json()).error||m}catch(e){} throw new Error(m); }
  return res.status===204?null:res.json();
}
function gate(){ $('app').innerHTML='<div class="state">Entre no app primeiro.<br><br><a class="btn primary" style="display:inline-flex;width:auto;padding:0 22px;text-decoration:none" href="/">Ir para o login</a></div>'; }

async function boot(){
  if(!token){ gate(); return; }
  try{ state.aff=await api('/affiliate/me'); shell(); go('resumo'); }
  catch(e){ if(e.message==='401')return; if(e.message==='404'){ onboarding(); return; } $('app').innerHTML='<div class="state">'+esc(e.message)+'</div>'; }
}

function onboarding(){
  $('app').innerHTML=`
    <div class="topbar"><div class="t">Seja um afiliado</div><div class="sub">Indique cursos e ganhe comissão</div></div>
    <div class="view">
      <p class="muted" style="margin-bottom:14px">Promova produtos digitais dos profissionais da Sports & Tennis e ganhe comissão por cada venda feita pelo seu link.</p>
      <label class="f">Seu nome *</label><input class="f" id="ob_name">
      <label class="f">E-mail</label><input class="f" id="ob_email" type="email">
      <label class="f">WhatsApp</label><input class="f" id="ob_phone" inputmode="numeric">
      <label class="f">Chave Pix (pra receber comissão)</label><input class="f" id="ob_pix" placeholder="CPF, e-mail, telefone ou aleatória">
      <div style="margin-top:18px"><button class="btn primary" id="ob_go">Quero ser afiliado</button></div>
    </div>`;
  $('ob_go').onclick=async()=>{
    const name=$('ob_name').value.trim(); if(!name){toast('Informe seu nome');return;}
    $('ob_go').disabled=true;
    try{ state.aff=await api('/affiliate/me',{method:'POST',body:{name,email:$('ob_email').value.trim()||undefined,phone:$('ob_phone').value.trim()||undefined,pixKey:$('ob_pix').value.trim()||undefined}}); shell(); go('resumo'); toast('Bem-vindo!'); }
    catch(e){ toast(e.message); $('ob_go').disabled=false; }
  };
}

function shell(){
  $('app').innerHTML=`
    <div class="topbar"><div class="t">${esc(state.aff.name)}</div><div class="sub">Painel do afiliado</div></div>
    <div class="view" id="view"></div>
    <div class="nav" id="nav">
      ${navBtn('resumo','💰','Resumo')}
      ${navBtn('vitrine','🛍️','Vitrine')}
      ${navBtn('links','🔗','Meus links')}
      ${navBtn('comissoes','📈','Comissões')}
    </div>`;
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function navBtn(t,ic,l){ return `<button data-tab="${t}"><span class="ic">${ic}</span>${l}</button>`; }
function go(tab){ state.tab=tab; $('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); ({resumo:rResumo,vitrine:rVitrine,links:rLinks,comissoes:rComissoes}[tab])(); }

function rResumo(){
  const a=state.aff;
  $('view').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="lbl">A receber</div><div class="val amber">${money(a.commissionPending)}</div></div>
      <div class="stat"><div class="lbl">Já recebido</div><div class="val green">${money(a.commissionPaid)}</div></div>
      <div class="stat"><div class="lbl">Total ganho</div><div class="val">${money(a.commissionTotal)}</div></div>
      <div class="stat"><div class="lbl">Vendas</div><div class="val blue">${a.salesTotal||0}</div><div class="muted">${a.clicksTotal||0} cliques</div></div>
    </div>
    <h2 class="sec">Saque</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">Chave Pix: <b>${esc(a.pixKey||'não cadastrada')}</b></div>
      <button class="btn primary" id="payoutBtn" ${a.commissionPending>0&&a.pixKey?'':'disabled'}>Sacar ${money(a.commissionPending)}</button>
      ${!a.pixKey?'<p class="help" style="color:#b26b00">Cadastre sua chave Pix abaixo pra poder sacar.</p>':''}
    </div>
    <h2 class="sec">Meus dados</h2>
    <label class="f">Chave Pix</label><input class="f" id="ed_pix" value="${esc(a.pixKey||'')}">
    <label class="f">E-mail</label><input class="f" id="ed_email" value="${esc(a.email||'')}">
    <label class="f">WhatsApp</label><input class="f" id="ed_phone" value="${esc(a.phone||'')}">
    <div style="margin:16px 0"><button class="btn gray" style="width:100%" id="ed_save">Salvar dados</button></div>
  `;
  $('payoutBtn').onclick=async()=>{
    if(!confirm('Solicitar saque de '+money(state.aff.commissionPending)+' pra sua chave Pix?'))return;
    $('payoutBtn').disabled=true;
    try{ await api('/affiliate/payout',{method:'POST'}); state.aff=await api('/affiliate/me'); toast('Saque solicitado!'); go('resumo'); }
    catch(e){ toast(e.message); $('payoutBtn').disabled=false; }
  };
  $('ed_save').onclick=async()=>{
    $('ed_save').disabled=true;
    try{ state.aff=await api('/affiliate/me',{method:'PUT',body:{pixKey:$('ed_pix').value.trim()||null,email:$('ed_email').value.trim()||null,phone:$('ed_phone').value.trim()||null}}); toast('Salvo!'); go('resumo'); }
    catch(e){ toast(e.message); $('ed_save').disabled=false; }
  };
}

async function rVitrine(){
  $('view').innerHTML='<div class="state">Carregando…</div>';
  try{ state.market=await api('/affiliate/marketplace'); }catch(e){ $('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  const joinedIds=new Set((state.links||[]).map(l=>l.productId||(l.product&&l.product.id)));
  $('view').innerHTML=`<h2 class="sec">Produtos pra promover</h2>${
    state.market.length?state.market.map(p=>marketRow(p,joinedIds.has(p.id))).join(''):'<div class="empty">Nenhum produto disponível pra afiliação no momento.</div>'
  }`;
}
function marketRow(p,joined){
  return `<div class="card"><div class="row" style="align-items:flex-start">
    ${p.coverUrl?`<img class="thumb" src="${esc(p.coverUrl)}">`:'<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:24px">🎓</div>'}
    <div style="flex:1">
      <div style="font-weight:700;line-height:1.2">${esc(p.title)}</div>
      <div class="muted">${esc((p.producer&&p.producer.displayName)||'')}</div>
      <div style="margin-top:4px;font-size:14px"><b style="color:#0a843d">${money(p.price)}</b> · comissão <b>${p.affiliateCommissionPct}%</b> = ${money(p.price*p.affiliateCommissionPct/100)}</div>
    </div>
  </div>
  <div style="margin-top:10px">${joined?'<button class="btn gray sm" style="width:100%" disabled>Já promovendo</button>':`<button class="btn primary" style="width:100%" onclick='joinProduct(${JSON.stringify(p.id)})'>Promover este produto</button>`}</div>
  </div>`;
}
async function joinProduct(id){
  try{ const link=await api('/affiliate/products/'+id+'/join',{method:'POST'}); state.links=await api('/affiliate/links'); toast(link.status==='approved'?'Link gerado!':'Solicitado — aguarde aprovação'); go('links'); }
  catch(e){ toast(e.message); }
}

async function rLinks(){
  $('view').innerHTML='<div class="state">Carregando…</div>';
  try{ state.links=await api('/affiliate/links'); }catch(e){ $('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  $('view').innerHTML=`<h2 class="sec">Meus links de afiliado</h2>${
    state.links.length?state.links.map(linkRow).join(''):'<div class="empty">Você ainda não promove nenhum produto.<br>Vá na Vitrine pra escolher.</div>'
  }`;
}
function linkRow(l){
  const st={pending:'Aguardando aprovação',approved:'Aprovado',rejected:'Rejeitado'};
  const url=location.origin+'/r/'+l.code;
  const prod=l.product||{};
  return `<div class="card">
    <div class="row" style="align-items:flex-start">
      ${prod.coverUrl?`<img class="thumb" src="${esc(prod.coverUrl)}">`:'<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:24px">🎓</div>'}
      <div style="flex:1"><div style="font-weight:700;line-height:1.2">${esc(prod.title||'Produto')}</div>
        <div class="muted">${l.clicks||0} cliques · ${l.sales||0} vendas · ${l.commissionPct}%</div></div>
      <span class="pill ${l.status}">${st[l.status]||l.status}</span>
    </div>
    ${l.status==='approved'?`<div class="linkbox" style="margin:10px 0">${esc(url)}</div>
      <button class="btn ghost sm" style="width:100%" onclick="copy('${esc(url)}')">Copiar link de divulgação</button>`:''}
  </div>`;
}

async function rComissoes(){
  $('view').innerHTML='<div class="state">Carregando…</div>';
  try{ state.commissions=await api('/affiliate/commissions'); }catch(e){ $('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  $('view').innerHTML=`<h2 class="sec">Histórico de comissões</h2>${
    state.commissions.length?state.commissions.map(commRow).join(''):'<div class="empty">Nenhuma comissão ainda.</div>'
  }`;
}
function commRow(c){
  const st={pending:'Pendente',available:'Disponível',paid:'Paga',reversed:'Estornada'};
  const s=c.sale||{};
  return `<div class="card"><div class="row">
    <div style="flex:1"><div style="font-weight:700">${money(c.amount)}</div>
      <div class="muted">${esc((s.product&&s.product.title)||'')} · ${esc(s.buyerName||'')} · ${fmtDate(c.createdAt)}</div></div>
    <span class="pill ${c.status}">${st[c.status]||c.status}</span>
  </div></div>`;
}

boot();
</script>
</body>
</html>
