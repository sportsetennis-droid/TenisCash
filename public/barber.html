<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17171A">
<meta name="description" content="BARBER — ache seu barbeiro. Agende em segundos. Estilo masculino, do seu jeito.">
<title>BARBER — ache seu barbeiro</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#C1121F; --primary-dark:#8E0E18; --primary-light:#2A1416;
    --bg:#17171A; --surface:#1F1F23; --text:#EFE7D8; --muted:#8d877d; --soft:#b8b1a4;
    --border:#34343A; --border-soft:#2a2a30;
    --success:#3BA776; --success-bg:#15281f; --danger:#E5484D;
    --cream:#EFE7D8; --navy:#1B2A4A; --gold:#C9A24B;
    --radius:14px;
    --gradient:linear-gradient(135deg,#C1121F 0%,#8E0E18 100%);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    --shadow-md:0 10px 28px rgba(0,0,0,.5);
    --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}

  /* ===== container ===== */
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
       padding-top:env(safe-area-inset-top);padding-bottom:calc(74px + env(safe-area-inset-bottom));}

  /* ===== header ===== */
  .hdr{background:var(--gradient);color:#fff;padding:16px 18px 14px;}
  .hdr-main{display:flex;align-items:center;gap:12px;}
  .hdr-titles{flex:1;min-width:0;}
  .hdr h1{font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;}
  .hdr p{font-size:12.5px;opacity:.92;margin-top:2px;}
  .back{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;display:none;}
  .topnav{display:none;gap:8px;}
  .tnav{background:rgba(255,255,255,.16);border:none;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;}
  .tnav:hover{background:rgba(255,255,255,.28);}
  .tnav.active{background:#fff;color:var(--primary);}
  .search{margin-top:12px;}
  .search input{width:100%;border:none;border-radius:10px;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.96);}
  .search input:focus{outline:none;}

  /* ===== content ===== */
  .content{padding:16px;}
  .view{display:none;} .view.show{display:block;animation:fade .2s;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .sec-title{font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;margin:18px 2px 8px;}

  /* venue card */
  .venues{display:grid;gap:13px;}
  .vcard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;border:1px solid var(--border-soft);transition:transform .1s,box-shadow .15s;}
  .vcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .vcard:active{transform:scale(.99);}
  .vcard .cover{height:104px;background:var(--primary-light) center/cover;}
  .vcard .body{padding:13px 14px;}
  .vcard .nm{font-size:16px;font-weight:700;}
  .vcard .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .pill.cash{background:var(--success-bg);color:var(--success);}
  .pill.seg{background:var(--primary-light);color:var(--primary-dark);}
  .pill.verified{background:#e3f2fd;color:#0066cc;}

  /* barber + services */
  .barbers{display:grid;gap:12px;}
  .barber{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;border:1px solid var(--border-soft);}
  .barber .top{display:flex;align-items:center;gap:11px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .barber .nm{font-weight:700;font-size:15px;}
  .barber .hl{font-size:12px;color:var(--muted);}
  .srv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border-soft);}
  .srv:first-of-type{margin-top:8px;}
  .srv .info .t{font-size:14px;font-weight:600;}
  .srv .info .d{font-size:12px;color:var(--muted);margin-top:1px;}
  .srv .price .v{font-weight:800;font-size:15px;color:var(--primary-dark);}

  /* buttons */
  .btn{width:100%;background:var(--gradient);color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;min-height:50px;box-shadow:0 4px 12px rgba(229,87,30,.25);transition:transform .1s,box-shadow .15s;}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(229,87,30,.35);}
  .btn:disabled{background:#c7c7cc;box-shadow:none;}
  .btn.sec{background:var(--surface);color:var(--text);border:1.5px solid var(--border);box-shadow:none;}
  .btn-mini{background:var(--gradient);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;}
  .linkbtn{background:none;border:none;color:var(--primary);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline;}
  .subnav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .subnav::-webkit-scrollbar{display:none;}
  .subnav-btn{flex:1;min-width:78px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 8px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap;min-height:42px;}
  .subnav-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .stat3{display:flex;justify-content:space-between;text-align:center;gap:8px;flex-wrap:wrap;}
  .stat3 .lbl{color:var(--muted);font-size:11px;font-weight:600;}
  .stat3 .val{font-weight:800;font-size:17px;margin-top:2px;}

  /* forms */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:6px;}
  .field input,.field select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:13px;font-size:15px;background:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;border:1px solid var(--border-soft);margin-bottom:13px;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .ico{font-size:44px;margin-bottom:10px;}
  .empty p{font-size:14px;margin-bottom:16px;}
  .badge-tc{background:var(--success-bg);color:var(--success);border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600;margin:4px 0 12px;display:flex;align-items:center;gap:7px;}
  .loading{text-align:center;padding:30px;color:var(--muted);font-size:14px;}

  /* dates + slots */
  .dates{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;}
  .dates::-webkit-scrollbar{display:none;}
  .datechip{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;text-align:center;cursor:pointer;min-width:58px;}
  .datechip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .datechip .dow{font-size:11px;text-transform:uppercase;font-weight:600;opacity:.8;}
  .datechip .dnum{font-size:18px;font-weight:800;}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
  .slot{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 0;text-align:center;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
  .slot:hover{border-color:var(--primary);}
  .slot.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* bottom nav (mobile) */
  .botnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;}
  .bnav{flex:1;background:none;border:none;padding:10px 0;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;}
  .bnav .ic{font-size:21px;}
  .bnav.active{color:var(--primary);}

  /* toast */
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  /* =================== DESKTOP =================== */
  @media(min-width:900px){
    .app{max-width:1080px;padding-bottom:48px;box-shadow:var(--shadow-lg);min-height:100vh;}
    body{background:#f2f2f4;}
    .hdr{padding:18px 28px;position:sticky;top:0;z-index:40;}
    .hdr h1{font-size:23px;}
    .topnav{display:flex;}                 /* mostra nav no topo */
    .botnav{display:none;}                 /* esconde nav de baixo */
    .back{order:-1;}
    .search{max-width:420px;margin-top:14px;}
    .content{padding:26px 28px;}
    .venues{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start;}
    .vcard .cover{height:130px;}
    .barbers{grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    #view-book,#view-owner{max-width:600px;margin:0 auto;}
    .slots{grid-template-columns:repeat(6,1fr);}
    .toast{bottom:28px;}
  }
  @media(min-width:900px){ .app{border-radius:0;} }
  .st-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .st-box{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .st-box h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--soft);}
  .st-alert{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:7px 9px;border-radius:8px;margin-bottom:5px;}
  .st-alert-low,.st-alert-soon{background:#fff8e0;color:#b06b00;}
  .st-alert-exp{background:var(--danger-bg);color:var(--danger);}
  .st-form{display:flex;flex-direction:column;gap:8px;}
  .st-form select,.st-form input{border:1.5px solid var(--border);border-radius:10px;padding:11px;font-size:14px;width:100%;}
  .st-btn{background:var(--gradient);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;min-height:44px;}
  .st-btn-sm{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
  .st-totals{font-size:12.5px;color:var(--soft);margin-bottom:8px;}
  .st-tablewrap{overflow-x:auto;}
  .st-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .st-table th,.st-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  .st-tag{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
  .st-tag-in{background:var(--success-bg);color:var(--success);}
  .st-tag-out{background:var(--danger-bg);color:var(--danger);}
  .st-tag-adjust{background:#e3f2fd;color:#0066cc;}

  /* ============== AMERICANA RED — redesign (dark/vintage/masculino) ============== */
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .app{background:var(--bg);}
  /* barber pole */
  .pole{width:11px;height:28px;border-radius:3px;flex-shrink:0;background:repeating-linear-gradient(45deg,var(--primary) 0 6px,#EFE7D8 6px 12px,var(--navy) 12px 18px);box-shadow:0 0 0 1px rgba(0,0,0,.45);}
  /* header slim */
  .hdr{background:#101013;color:var(--cream);padding:0;border-bottom:1px solid var(--border);}
  .hdr-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .brand{display:flex;align-items:center;gap:10px;flex:1;}
  .wordmark{font-family:'Oswald',sans-serif;font-size:23px;font-weight:700;letter-spacing:4px;color:#fff;text-transform:uppercase;}
  .ownerlink{background:transparent;border:1px solid var(--border);color:var(--soft);font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
  .ownerlink:hover{border-color:var(--primary);color:#fff;}
  .topnav{display:none !important;}
  .back{background:rgba(255,255,255,.08);color:var(--cream);}
  .hdr-title{display:block;padding:8px 16px 2px;}
  .hdr-title h1{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--cream);letter-spacing:.5px;text-transform:uppercase;}
  .hdr-title p{font-size:12px;color:var(--muted);margin-top:1px;}
  .search{padding:10px 16px 14px;}
  .search input{background:#1C1C20;border:1px solid var(--border);color:var(--cream);border-radius:12px;padding:14px 16px;font-size:15px;width:100%;}
  .search input::placeholder{color:#6f6a61;}
  /* HERO no discover */
  .app[data-view="discover"] .hdr{background:linear-gradient(180deg,rgba(16,16,19,.5) 0%,rgba(16,16,19,.8) 60%,#101013 100%),url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1100&q=70') center/cover;}
  .app[data-view="discover"] .back{display:none !important;}
  .app[data-view="discover"] .hdr-title{padding:30px 16px 10px;}
  .app[data-view="discover"] .hdr-title h1{font-size:35px;font-weight:700;line-height:.96;color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.7);}
  .app[data-view="discover"] .hdr-title p{color:rgba(239,231,216,.88);font-size:13px;margin-top:7px;}
  /* venue cards = foto pesada */
  .venues{gap:16px;}
  .vcard{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#1C1C20;min-height:208px;display:flex;align-items:flex-end;box-shadow:var(--shadow-md);}
  .vcard:active{transform:scale(.99);}
  .vcard .cover{position:absolute;inset:0;height:auto;background-size:cover;background-position:center;filter:grayscale(.55) contrast(1.05) brightness(.82);}
  .vcard::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,23,26,0) 0%,rgba(23,23,26,.4) 42%,rgba(23,23,26,.96) 100%);}
  .vcard .body{position:relative;z-index:2;padding:16px;width:100%;}
  .vcard .nm{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
  .vcard .meta{margin-top:7px;color:rgba(239,231,216,.82);}
  .vcard .meta>span{color:rgba(239,231,216,.85);}
  /* pills */
  .pill{border-radius:6px;font-weight:700;}
  .pill.seg{background:rgba(27,42,74,.7);color:#9db4e0;text-transform:uppercase;letter-spacing:.5px;}
  .pill.cash{background:var(--primary);color:#fff;}
  .pill.verified{background:var(--gold);color:#1a1a1a;}
  /* sec-title */
  .sec-title{font-family:'Oswald',sans-serif;color:var(--soft);letter-spacing:1px;}
  /* cards/inputs/buttons dark */
  .card{background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .field label{color:var(--soft);}
  .field input,.field select,.field textarea{background:#1C1C20;border:1px solid var(--border);color:var(--cream);}
  .field input::placeholder,.field textarea::placeholder{color:#6f6a61;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(193,18,31,.25);}
  .btn{background:var(--gradient);color:#fff;border-radius:12px;font-family:'Oswald',sans-serif;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 6px 18px rgba(193,18,31,.3);}
  .btn.sec{background:transparent;color:var(--cream);border:1px solid var(--border);box-shadow:none;}
  .btn-mini{background:var(--primary);color:#fff;font-family:'Oswald',sans-serif;letter-spacing:.5px;}
  .linkbtn{color:var(--primary);}
  /* bottom nav */
  .botnav{background:#0C0C0E;border-top:1px solid var(--border);}
  .bnav{color:#6f6a61;}
  .bnav.active{color:var(--primary);}
  /* venue detail hero + barbers */
  .venue-hero{position:relative;height:190px;border-radius:16px;overflow:hidden;margin-bottom:14px;display:flex;align-items:flex-end;border:1px solid var(--border);}
  .venue-hero .cover{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(.55) contrast(1.05) brightness(.78);}
  .venue-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(23,23,26,.95));}
  .venue-hero .vh-name{position:relative;z-index:2;padding:14px 16px;font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
  .barber{background:var(--surface);border:1px solid var(--border);}
  .barber .nm{font-family:'Oswald',sans-serif;letter-spacing:.3px;}
  .avatar{background:var(--gradient);}
  .srv{border-top:1px solid var(--border-soft);}
  .srv .price .v{color:#e8888d;}
  .badge-tc{background:rgba(193,18,31,.14);color:#f0a6aa;border:1px solid rgba(193,18,31,.32);}
  /* dates/slots/subnav dark */
  .datechip,.slot{background:#1C1C20;border:1px solid var(--border);color:var(--cream);}
  .datechip.active,.slot.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .subnav-btn{background:#1C1C20;border:1px solid var(--border);color:var(--soft);}
  .subnav-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .empty{color:var(--muted);}
  .empty .ico{filter:grayscale(.3);}
  @media(min-width:900px){ body{background:#0a0a0b;} .app{box-shadow:0 0 0 1px var(--border);} }
  /* ===== 4 vias — home ===== */
  .home-cards{display:grid;gap:14px;}
  .hcard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:108px;box-shadow:var(--shadow-md);overflow:hidden;}
  .hcard:active{transform:scale(.99);}
  .hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary);}
  .hcard .hc-ic{font-size:28px;line-height:1;}
  .hcard .hc-t{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;color:#fff;text-transform:uppercase;}
  .hcard .hc-d{font-size:12.5px;color:var(--muted);}
  .hcard.hbusca::before{background:repeating-linear-gradient(45deg,var(--primary) 0 5px,#EFE7D8 5px 10px,var(--navy) 10px 15px);}
  .app[data-view="home"] .hdr{background:linear-gradient(180deg,rgba(16,16,19,.55),rgba(16,16,19,.92)),url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1100&q=70') center/cover;}
  .app[data-view="home"] .hdr-title{padding:26px 16px 14px;}
  .app[data-view="home"] .hdr-title h1{font-size:30px;color:#fff;}
  .app[data-view="home"] .back{display:none !important;}
  .app[data-view="home"] .ownerlink{display:none;}
  @media(min-width:900px){ .home-cards{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-bar">
      <button class="back" id="backBtn">‹</button>
      <div class="brand"><span class="pole"></span><span class="wordmark">BARBER</span></div>
      <button class="ownerlink" data-tab="home">Início</button>
    </div>
    <div class="hdr-title">
      <h1 id="hdrTitle">ENCONTRE SEU BARBEIRO</h1>
      <p id="hdrSub">os melhores perto de você</p>
    </div>
    <div class="search" id="searchBox"><input id="q" placeholder="Busque barbearia, barbeiro ou cidade"></div>
  </header>

  <main class="content" id="content">
    <div class="view show" id="view-home"></div>
    <div class="view" id="view-discover"><div class="venues" id="venueList"><div class="loading">Carregando...</div></div></div>
    <div class="view" id="view-venue"></div>
    <div class="view" id="view-book"></div>
    <div class="view" id="view-cliente"></div>
    <div class="view" id="view-barbeiro"></div>
    <div class="view" id="view-owner"></div>
  </main>

  <nav class="botnav">
    <button class="bnav active" data-tab="home"><span class="ic">🏠</span>Início</button>
    <button class="bnav" data-tab="discover"><span class="ic">🔎</span>Buscar</button>
    <button class="bnav" data-tab="cliente"><span class="ic">👤</span>Conta</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const API='';
let TOKEN=localStorage.getItem('tc_token')||null;
let state={venue:null,venueData:null,barber:null,offer:null,date:null,slot:null,history:[]};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
async function api(path,opts={}){
  const h=opts.headers||{};h['Content-Type']='application/json';
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers:h});
  let data=null;try{data=await r.json();}catch(_){}
  if(!r.ok)throw new Error((data&&data.error)||('Erro '+r.status));
  return data;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',');}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('pt-BR',{timeZone:'America/Fortaleza',hour:'2-digit',minute:'2-digit'});}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function setView(v,{title,sub,back,search}={}){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('show'));
  document.getElementById('view-'+v).classList.add('show');
  const _app=document.querySelector('.app'); if(_app)_app.dataset.view=v;
  document.getElementById('hdrTitle').textContent=title||'BARBER';
  document.getElementById('hdrSub').textContent=sub||'';
  document.getElementById('backBtn').style.display=back?'block':'none';
  document.getElementById('searchBox').style.display=search?'block':'none';
  window.scrollTo(0,0);
}
function setActiveTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function showTab(tab){
  state.history=[]; setActiveTab(tab);
  if(tab==='home')return renderHome();
  if(tab==='discover'){setView('discover',{search:true,title:'ENCONTRE SEU BARBEIRO',sub:'os melhores perto de você'});loadVenues();return;}
  if(tab==='cliente')return renderCliente();
  if(tab==='barbeiro')return renderBarbeiro();
  renderOwner();
}
function goBack(){
  const prev=state.history.pop();
  if(prev==='venue'&&state.venue){openVenue(state.venue.slug,true);}
  else{showTab('home');}
}

// ---- DISCOVER ----
let searchT=null;
const VENUE_IMGS=['photo-1503951914875-452162b0f3f1','photo-1585747860715-2ba37e788b70','photo-1599351431202-1e0f0137899a','photo-1521590832167-7bcbfaa6381f','photo-1605497788044-5a32c7078486','photo-1622286342621-4bd786c2447c'];
function venueImg(v){if(v&&v.coverUrl)return v.coverUrl;const s=(v&&v.slug)||'';let h=0;for(let i=0;i<s.length;i++)h=(h+s.charCodeAt(i))%VENUE_IMGS.length;return `https://images.unsplash.com/${VENUE_IMGS[h]}?auto=format&fit=crop&w=900&q=70`;}
async function loadVenues(){
  const list=document.getElementById('venueList');
  list.innerHTML='<div class="loading">Carregando...</div>';
  try{
    const q=document.getElementById('q').value.trim();
    const d=await api('/api/services/discover'+(q?('?q='+encodeURIComponent(q)):''));
    if(!d.venues.length){
      list.innerHTML=`<div class="empty"><div class="ico">💈</div>
        <p>${q?'Nenhuma barbearia encontrada.':'Nenhuma barbearia na sua região ainda.'}</p>
        <button class="btn" data-action="goOwner" style="max-width:320px;margin:8px auto 0;">Tenho uma barbearia</button></div>`;
      return;
    }
    list.innerHTML=d.venues.map(v=>`
      <div class="vcard" data-action="openVenue" data-slug="${esc(v.slug)}">
        <div class="cover" style="background-image:url('${esc(venueImg(v))}')"></div>
        <div class="body">
          <div class="nm">${esc(v.name)}</div>
          <div class="meta">
            <span class="pill seg">${esc(v.segment||'barbearia')}</span>
            ${v.city?`<span>📍 ${esc(v.neighborhood||v.city)}</span>`:''}
            ${v.reviewCount>0?`<span>⭐ ${Number(v.reviewRating).toFixed(1)}</span>`:''}
            ${v.verified?`<span class="pill verified">✓</span>`:''}
            ${v.givesCashback?`<span class="pill cash">100% em T$</span>`:''}
          </div>
        </div>
      </div>`).join('');
  }catch(e){list.innerHTML=`<div class="empty"><p>Erro: ${esc(e.message)}</p></div>`;}
}

// ---- VENUE ----
async function openVenue(slug,noPush){
  if(!noPush)state.history.push('discover');
  setView('venue',{title:'Carregando...',back:true});
  document.getElementById('view-venue').innerHTML='<div class="loading">Carregando...</div>';
  try{
    const d=await api('/api/services/venue/'+slug);
    state.venue=d.venue; state.venueData=d;
    setView('venue',{title:d.venue.name,sub:d.venue.city||'',back:true});
    let html=`<div class="venue-hero"><div class="cover" style="background-image:url('${esc(venueImg(d.venue))}')"></div><div class="vh-name">${esc(d.venue.name)}</div></div>`;
    if(d.venue.givesCashback)html+=`<div class="badge-tc">💰 Ganhe 100% de volta em TenisCash — o que você paga, volta pra você</div>`;
    if(!d.professionals.length)html+='<div class="empty"><p>Sem profissionais com agenda ainda.</p></div>';
    html+='<div class="barbers">';
    d.professionals.forEach(p=>{
      html+=`<div class="barber"><div class="top"><div class="avatar">${initials(p.displayName)}</div>
        <div><div class="nm">${esc(p.displayName)}</div><div class="hl">${esc(p.headline||'Profissional')}</div></div></div>`;
      if(!p.offers.length)html+='<div class="srv"><div class="info"><div class="d">Sem serviços cadastrados</div></div></div>';
      p.offers.forEach(o=>{
        html+=`<div class="srv"><div class="info"><div class="t">${esc(o.title)}</div>
          <div class="d">${o.durationMin?o.durationMin+' min':''}${o.price>0?' · '+money(o.price):' · grátis'}</div></div>
          <div class="price"><button class="btn-mini" data-action="book" data-pid="${esc(p.id)}" data-oid="${esc(o.id)}">Agendar</button></div></div>`;
      });
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('view-venue').innerHTML=html;
  }catch(e){document.getElementById('view-venue').innerHTML=`<div class="empty"><p>${esc(e.message)}</p></div>`;}
}

// ---- BOOK ----
function startBook(pid,oid){
  const barber=state.venueData.professionals.find(p=>p.id===pid);
  const offer=barber&&barber.offers.find(o=>o.id===oid);
  if(!barber||!offer)return;
  state.barber=barber;state.offer=offer;state.date=null;state.slot=null;
  state.history.push('venue');
  setView('book',{title:'Agendar',sub:offer.title,back:true});
  const dates=[];const now=new Date();
  for(let i=0;i<14;i++){const d=new Date(now);d.setDate(now.getDate()+i);dates.push(d);}
  const dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  document.getElementById('view-book').innerHTML=`
    <div class="card"><div style="font-weight:700;font-size:15px;">${esc(offer.title)}</div>
      <div style="color:var(--muted);font-size:13px;margin-top:2px;">com ${esc(barber.displayName)} · ${offer.durationMin||30} min · ${offer.price>0?money(offer.price):'grátis'}</div></div>
    <div class="sec-title">Escolha o dia</div>
    <div class="dates" id="dates">${dates.map(d=>`<div class="datechip" data-action="pickDate" data-d="${ymd(d)}"><div class="dow">${dow[d.getDay()]}</div><div class="dnum">${d.getDate()}</div></div>`).join('')}</div>
    <div class="sec-title">Horário</div>
    <div id="slotsWrap"><div class="loading" style="padding:14px;">Escolha um dia acima</div></div>
    <div id="bookForm" style="display:none;margin-top:14px;">
      <button class="btn" id="confirmBtn" data-action="confirm">Confirmar agendamento</button>
    </div>`;
}
async function pickDate(el){
  document.querySelectorAll('#dates .datechip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');state.date=el.dataset.d;state.slot=null;
  const wrap=document.getElementById('slotsWrap');
  wrap.innerHTML='<div class="loading" style="padding:14px;">Carregando horários...</div>';
  document.getElementById('bookForm').style.display='none';
  try{
    const d=await api(`/api/services/slots?professionalId=${state.barber.id}&date=${state.date}&offerId=${state.offer.id}`);
    if(!d.slots.length){wrap.innerHTML='<div class="empty" style="padding:18px;"><p>Sem horários livres nesse dia.</p></div>';return;}
    wrap.innerHTML='<div class="slots">'+d.slots.map(s=>`<div class="slot" data-action="pickSlot" data-s="${s}">${fmtTime(s)}</div>`).join('')+'</div>';
  }catch(e){wrap.innerHTML=`<div class="empty" style="padding:18px;"><p>${esc(e.message)}</p></div>`;}
}
function pickSlot(el){
  document.querySelectorAll('#slotsWrap .slot').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');state.slot=el.dataset.s;
  document.getElementById('bookForm').style.display='block';
}
async function confirmBook(){
  if(!state.slot){toast('Escolha um horário');return;}
  if(!TOKEN){document.getElementById('view-book').innerHTML='<div class="card" style="margin-bottom:10px;"><div style="font-weight:800;font-size:16px;">Pra marcar, entre ou cadastre-se</div><div style="color:var(--muted);font-size:13px;margin-top:4px;">É rápido — e seu histórico fica salvo.</div></div>'+authForm('book');return;}
  doBook();
}

// ---- OWNER ----
async function renderOwner(){
  setView('owner',{title:'Minha barbearia',sub:'Gerencie sua agenda'});
  const el=document.getElementById('view-owner');
  if(!TOKEN){
    el.innerHTML=`<div class="card">
      <div style="font-weight:700;font-size:16px;margin-bottom:4px;">Entrar</div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:14px;">Use seu login TenisCash pra cadastrar/gerenciar sua barbearia.</div>
      <div class="field"><label>WhatsApp</label><input id="loginPhone" inputmode="tel" placeholder="(83) 9 9999-9999"></div>
      <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="••••••"></div>
      <button class="btn" id="loginBtn" data-action="login">Entrar</button></div>`;
    return;
  }
  el.innerHTML='<div class="loading">Carregando...</div>';
  try{
    const venues=await api('/api/services/me/venues');
    if(!venues.length){renderCreateVenue(el);return;}
    state.ownerVenue=venues[0];
    if(!state.ownerTab)state.ownerTab='agenda';
    renderOwnerDash();
  }catch(e){
    if(/401|inválido|expirado/i.test(e.message)){logout();return;}
    el.innerHTML=`<div class="empty"><p>${esc(e.message)}</p><button class="linkbtn" data-action="logout">Sair</button></div>`;
  }
}
function renderCreateVenue(el){
  el.innerHTML=`<div class="card">
    <div style="font-weight:700;font-size:16px;margin-bottom:3px;">Cadastrar minha barbearia</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:14px;">Em 1 minuto você fica no ar no /barber.</div>
    <div class="field"><label>Nome do estabelecimento</label><input id="cvName" placeholder="Ex: Barbearia do Zé"></div>
    <div class="row2">
      <div class="field"><label>Tipo</label><select id="cvSeg"><option value="barbearia">Barbearia</option><option value="salao">Salão</option><option value="estetica">Estética</option><option value="tattoo">Tattoo</option></select></div>
      <div class="field"><label>Cidade</label><input id="cvCity" placeholder="João Pessoa"></div>
    </div>
    <div class="field"><label>Oferecer TenisCash ao cliente?</label><select id="cvGives"><option value="1">Sim — cliente ganha 100% de volta</option><option value="0">Não</option></select></div>
    <div class="sec-title" style="margin-top:6px;">Primeiro serviço</div>
    <div class="row2">
      <div class="field"><label>Nome</label><input id="cvSrv" value="Corte"></div>
      <div class="field"><label>Preço (R$)</label><input id="cvPrice" type="number" value="40" inputmode="decimal"></div>
    </div>
    <div class="field"><label>Duração (min)</label><input id="cvDur" type="number" value="30" inputmode="numeric"></div>
    <button class="btn" id="cvBtn" data-action="createVenue">Criar e publicar</button>
    <div style="margin-top:12px;text-align:center;"><button class="linkbtn" data-action="logout">Sair</button></div></div>`;
}
async function doLogin(){
  const phone=document.getElementById('loginPhone').value.replace(/\D/g,'');
  const password=document.getElementById('loginPass').value;
  if(!phone||!password){toast('Preencha telefone e senha');return;}
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Entrando...';
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone,password})});
    TOKEN=d.token;localStorage.setItem('tc_token',TOKEN);renderOwner();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Entrar';}
}
function logout(){TOKEN=null;localStorage.removeItem('tc_token');renderOwner();}
async function publishVenue(id){try{await api(`/api/services/venues/${id}`,{method:'PATCH',body:JSON.stringify({published:true})});toast('Publicada! 🎉');renderOwner();}catch(e){toast(e.message);}}
async function createVenue(){
  const name=document.getElementById('cvName').value.trim();
  if(!name){toast('Informe o nome');return;}
  const seg=document.getElementById('cvSeg').value;
  const city=document.getElementById('cvCity').value.trim();
  const givesCashback=val('cvGives')!=='0';
  const srv=document.getElementById('cvSrv').value.trim()||'Corte';
  const price=Number(document.getElementById('cvPrice').value)||0;
  const dur=Number(document.getElementById('cvDur').value)||30;
  const btn=document.getElementById('cvBtn');btn.disabled=true;btn.textContent='Criando...';
  try{
    let pro;try{pro=await api('/api/professionals/me');}catch(_){pro=null;}
    if(!pro)pro=await api('/api/professionals/me',{method:'POST',body:JSON.stringify({displayName:name,headline:seg,category:'barber',city})});
    const venue=await api('/api/services/venues',{method:'POST',body:JSON.stringify({name,segment:seg,city,givesCashback})});
    await api(`/api/services/venues/${venue.id}/members`,{method:'POST',body:JSON.stringify({professionalId:pro.id,role:'owner'})});
    await api('/api/professionals/me/offers',{method:'POST',body:JSON.stringify({type:'class_presential',title:srv,price,durationMin:dur})});
    for(let wd=1;wd<=6;wd++){try{await api('/api/services/me/availability',{method:'POST',body:JSON.stringify({weekday:wd,startMin:540,endMin:1080})});}catch(_){}}
    await api(`/api/services/venues/${venue.id}`,{method:'PATCH',body:JSON.stringify({published:true})});
    toast('Barbearia no ar! 🎉');renderOwner();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Criar e publicar';}
}

// ---- PAINEL DO BARBEIRO (dashboard) ----
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function renderOwnerDash(){
  const v=state.ownerVenue, el=document.getElementById('view-owner');
  const tabs={agenda:'Agenda',caixa:'Caixa',produtos:'Produtos',relatorio:'Relatório',pacotes:'Pacotes',finance:'Financeiro',stock:'Estoque+',marketing:'Marketing',club:'Clube'};
  el.innerHTML=`
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div><div style="font-weight:800;font-size:17px;">${esc(v.name)}</div>
        <div style="color:var(--muted);font-size:12.5px;margin-top:2px;">${esc(v.segment)} · ${v.published?'<span style="color:var(--success);font-weight:700;">no ar</span>':'<span style="color:var(--danger);font-weight:700;">não publicada</span>'} · ${v.givesCashback?'💰 cliente ganha 100% em T$':'sem TenisCash'}</div></div>
        <button class="linkbtn" data-action="logout">Sair</button>
      </div>
      ${v.published?`<button class="btn sec" style="margin-top:10px;" data-action="copylink" data-slug="${esc(v.slug)}">📋 Copiar link da barbearia</button>`:`<button class="btn" style="margin-top:10px;" data-action="publish" data-vid="${esc(v.id)}">Publicar agora</button>`}
    </div>
    <div class="subnav">${Object.keys(tabs).map(t=>`<button class="subnav-btn ${state.ownerTab===t?'active':''}" data-action="ownerTab" data-tab="${t}">${tabs[t]}</button>`).join('')}</div>
    <div id="ownerBody"><div class="loading">Carregando...</div></div>`;
  ownerLoadTab();
}
async function ownerLoadTab(){
  const t=state.ownerTab, body=document.getElementById('ownerBody');
  if(!body)return;
  body.innerHTML='<div class="loading">Carregando...</div>';
  try{
    if(t==='agenda')return renderAgenda(body);
    if(t==='caixa')return renderCaixa(body);
    if(t==='produtos')return renderProdutos(body);
    if(t==='relatorio')return renderRelatorio(body);
    if(t==='pacotes')return renderPacotes(body);
    if(t==='finance') return renderFinance(body);
    if(t==="stock") return renderStock(body);
    if(t==="marketing") return renderMarketing(body);
    if(t==='club')return renderClube(body);
  }catch(e){body.innerHTML=`<div class="empty"><p>${esc(e.message)}</p></div>`;}
}
function ownerTab(t){state.ownerTab=t;document.querySelectorAll('.subnav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));ownerLoadTab();}

async function renderAgenda(body){
  const appts=await api('/api/services/manage/appointments');
  const up=appts.filter(a=>['booked','confirmed'].includes(a.status));
  const past=appts.filter(a=>!['booked','confirmed'].includes(a.status)).slice(0,10);
  const card=(a)=>{
    const dt=new Date(a.startAt).toLocaleString('pt-BR',{timeZone:'America/Fortaleza',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    let actions='';
    if(a.status==='booked')actions=`<button class="btn-mini" data-action="apptConfirm" data-id="${a.id}">Confirmar</button> <button class="btn-mini" data-action="openCheckout" data-id="${a.id}">Concluir</button>`;
    else if(a.status==='confirmed')actions=`<button class="btn-mini" data-action="openCheckout" data-id="${a.id}">Concluir</button>`;
    else actions=`<span class="pill seg">${a.status==='done'?'concluído':a.status==='no_show'?'faltou':a.status}</span>`;
    const extra=(a.status==='booked'||a.status==='confirmed')?`<button class="linkbtn" data-action="apptNoshow" data-id="${a.id}">faltou</button> <button class="linkbtn" data-action="apptCancel" data-id="${a.id}">cancelar</button>`:'';
    return `<div class="card" style="padding:12px 14px;margin-bottom:10px;">
      <div style="font-weight:700;">${esc(a.serviceName)} — ${esc(a.customerName||'cliente')}</div>
      <div style="color:var(--muted);font-size:12.5px;margin:2px 0 8px;">${dt}${a.price>0?' · '+money(a.price):''}${a.customerPhone?' · '+esc(a.customerPhone):''}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">${actions} ${extra}</div></div>`;
  };
  body.innerHTML=(up.length?`<div class="sec-title">Próximos</div>`+up.map(card).join(''):'<div class="empty" style="padding:24px;"><p>Nenhum agendamento futuro.</p></div>')
    +(past.length?`<div class="sec-title">Histórico</div>`+past.map(card).join(''):'');
}

async function openCheckout(id){
  const appts=await api('/api/services/manage/appointments');
  const a=appts.find(x=>x.id===id);if(!a){toast('Agendamento não achado');return;}
  let catalog=[];try{catalog=await api(`/api/services/venues/${state.ownerVenue.id}/products`);}catch(_){}
  state.checkout={appt:a,catalog,products:[]};
  renderCheckout();
}
function renderCheckout(){
  const {appt,catalog,products}=state.checkout, body=document.getElementById('ownerBody');
  const prodTotal=products.reduce((s,p)=>s+p.price*p.qty,0);
  const total=(appt.price||0)+prodTotal;
  body.innerHTML=`<div class="card">
    <div style="font-weight:700;font-size:16px;margin-bottom:6px;">Fechar conta — ${esc(appt.customerName||'cliente')}</div>
    <div class="srv"><div class="info"><div class="t">${esc(appt.serviceName)}</div></div><div class="price"><span class="v">${money(appt.price)}</span></div></div>
    ${products.map((p,i)=>`<div class="srv"><div class="info"><div class="t">${esc(p.name)} x${p.qty}</div></div><div class="price"><span class="v">${money(p.price*p.qty)}</span> <button class="linkbtn" data-action="rmCoProd" data-i="${i}">remover</button></div></div>`).join('')}
    ${catalog.length?`<div class="sec-title">Adicionar produto</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${catalog.map(c=>`<button class="btn-mini" style="background:var(--surface);color:var(--text);border:1.5px solid var(--border);" data-action="addCoProd" data-pid="${c.id}">+ ${esc(c.name)} ${money(c.price)}</button>`).join('')}</div>`:'<div style="color:var(--muted);font-size:12px;margin-top:8px;">Cadastre produtos na aba Produtos pra vender junto.</div>'}
    <div class="field" style="margin-top:12px;"><label>Forma de pagamento</label><select id="coPay"><option value="cash">Dinheiro</option><option value="pix">PIX</option><option value="card">Cartão</option></select></div>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0;"><span>Total</span><span>${money(total)}</span></div>
    <button class="btn" data-action="doCheckout" data-id="${appt.id}">Fechar conta e concluir</button>
    <div style="margin-top:10px;text-align:center;"><button class="linkbtn" data-action="ownerTab" data-tab="agenda">voltar</button></div></div>`;
}

      api('/api/services/venues/'+vid+'/products'),
      api('/api/services/venues/'+vid+'/stock/movements')
    ]);
  } catch(e){ body.innerHTML = '<div style="color:#c00;padding:12px">Erro ao carregar: '+esc(e.message)+'</div>'; return; }

  const lowCards = alerts.lowStock.map(p=>'<div class="st-alert st-alert-low"><b>'+esc(p.name)+'</b><span>'+p.stock+' / mín '+p.minStock+'</span></div>').join('') || '<div style="color:#888;font-size:13px">Nenhum produto com estoque baixo.</div>';

  const t = profit.totals||{};

function stockFmtDate(s){ if(!s) return '-'; const d=new Date(s); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
function stockFmtDateTime(s){ if(!s) return '-'; const d=new Date(new Date(s).getTime()-180*60000); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'); }

async function stockMove(){
  const vid = state.ownerVenue.id;
  const venueProductId = val('stMoveProd');
  const type = val('stMoveType');
  const qty = Number(val('stMoveQty'));
  const reason = val('stMoveReason');
  if(!venueProductId){ toast('Selecione um produto'); return; }
  if(!(qty>=0) || (type!=='adjust' && qty<=0)){ toast('Quantidade inválida'); return; }
  try {
    await api('/api/services/venues/'+vid+'/stock/movement', { method:'POST', body: JSON.stringify({ venueProductId, type, qty, reason }) });
    toast('Movimentação registrada');
    ownerLoadTab();
  } catch(e){ toast(e.message); }
}
async function stockConfig(id, name){
  const vid = state.ownerVenue.id;
  const ms = prompt('Estoque mínimo para alerta de "'+name+'" (0 = sem alerta):');
  if(ms===null) return;
  const exp = prompt('Validade de "'+name+'" (AAAA-MM-DD, vazio para limpar):','');
  if(exp===null) return;
  const payload = {};
  if(ms.trim()!=='') payload.minStock = Number(ms);
  payload.expiresAt = exp.trim()==='' ? null : exp.trim();
  try {
    await api('/api/services/venues/'+vid+'/stock/config/'+id, { method:'PATCH', body: JSON.stringify(payload) });
    toast('Config salva');
    ownerLoadTab();
  } catch(e){ toast(e.message); }
}

  let body='';
  if(tab==='agenda'){
    let appts=[];try{appts=(await api('/api/services/manage/appointments')).filter(a=>a.professionalId===pro.id);}catch(_){}
    const up=appts.filter(a=>['booked','confirmed'].includes(a.status));
    body=up.length?up.map(barberApptCard).join(''):'<div class="empty" style="padding:24px;"><p>Nenhum agendamento. Configure sua jornada pra receber.</p></div>';
  }else{
    let av=[];try{av=await api('/api/services/me/availability');}catch(_){}
    const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    body=`<div class="card"><div style="font-weight:700;margin-bottom:8px;">Adicionar dia/horário</div>
      <div class="row2"><div class="field"><label>Dia</label><select id="avDow">${dows.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div><div class="field"><label>Das</label><input id="avFrom" type="time" value="09:00"></div></div>
      <div class="field"><label>Até</label><input id="avTo" type="time" value="18:00"></div>
      <button class="btn" data-action="barberAddAvail">Adicionar</button></div>
      ${av.length?av.sort((a,b)=>a.weekday-b.weekday||a.startMin-b.startMin).map(a=>`<div class="card" style="padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;"><div>${dows[a.weekday]} · ${fmt(a.startMin)}–${fmt(a.endMin)}</div><button class="linkbtn" data-action="barberDelAvail" data-id="${a.id}">remover</button></div>`).join(''):'<div class="empty" style="padding:16px;"><p>Sem jornada. Adicione seus dias/horários pra aparecer livre.</p></div>'}`;
  }
  el.innerHTML=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-weight:800;font-size:16px;">${esc(pro.displayName)}</div><div style="color:var(--muted);font-size:12px;">${esc(pro.headline||'barbeiro')}</div></div>
      <button class="linkbtn" data-action="logout">Sair</button></div>
    <div class="subnav"><button class="subnav-btn ${tab==='agenda'?'active':''}" data-action="barberTab" data-tab="agenda">Minha Agenda</button><button class="subnav-btn ${tab==='jornada'?'active':''}" data-action="barberTab" data-tab="jornada">Jornada</button></div>
    ${body}`;
}
function barberApptCard(a){
  const dt=new Date(a.startAt).toLocaleString('pt-BR',{timeZone:'America/Fortaleza',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const act=a.status==='booked'?`<button class="btn-mini" data-action="barberConfirm" data-id="${a.id}">Confirmar</button> <button class="btn-mini" data-action="barberDone" data-id="${a.id}">Concluir</button>`:`<button class="btn-mini" data-action="barberDone" data-id="${a.id}">Concluir</button>`;
  return `<div class="card" style="padding:12px 14px;margin-bottom:10px;"><div style="font-weight:700;">${esc(a.serviceName)} — ${esc(a.customerName||'cliente')}</div><div style="color:var(--muted);font-size:12.5px;margin:2px 0 8px;">${dt}${a.price>0?' · '+money(a.price):''}</div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">${act} <button class="linkbtn" data-action="barberCancel" data-id="${a.id}">cancelar</button></div></div>`;
}
async function barberConfirm(id){try{await api(`/api/services/appointments/${id}/confirm`,{method:'POST'});toast('Confirmado');renderBarbeiro();}catch(e){toast(e.message);}}
async function barberDone(id){try{await api(`/api/services/appointments/${id}/checkout`,{method:'POST',body:JSON.stringify({paymentMethod:'cash'})});toast('Concluído ✓');renderBarbeiro();}catch(e){toast(e.message);}}
async function barberCancel(id){try{await api(`/api/services/appointments/${id}/cancel`,{method:'POST'});toast('Cancelado');renderBarbeiro();}catch(e){toast(e.message);}}
function barberTab(t){state.barberTab=t;renderBarbeiro();}
async function barberCreate(){const displayName=val('brName').trim();if(!displayName){toast('Informe seu nome');return;}try{await api('/api/professionals/me',{method:'POST',body:JSON.stringify({displayName,headline:val('brHead')||'Barbeiro',category:'barber'})});toast('Perfil criado');state.barberTab='jornada';renderBarbeiro();}catch(e){toast(e.message);}}
async function barberAddAvail(){const weekday=Number(val('avDow'));const f=(val('avFrom')||'09:00').split(':'),t=(val('avTo')||'18:00').split(':');const startMin=Number(f[0])*60+Number(f[1]),endMin=Number(t[0])*60+Number(t[1]);if(!(endMin>startMin)){toast('Horário inválido');return;}try{await api('/api/services/me/availability',{method:'POST',body:JSON.stringify({weekday,startMin,endMin})});toast('Adicionado');renderBarbeiro();}catch(e){toast(e.message);}}
async function barberDelAvail(id){try{await api(`/api/services/me/availability/${id}`,{method:'DELETE'});toast('Removido');renderBarbeiro();}catch(e){toast(e.message);}}

// ---- GATE de marcação: marcar exige conta de cliente ----
async function doBook(){
  if(!state.slot||!state.barber||!state.offer){toast('Escolha um horário');return;}
  try{await api('/api/services/book',{method:'POST',body:JSON.stringify({professionalId:state.barber.id,venueId:state.venue.id,offerId:state.offer.id,startAt:state.slot,source:'cliente'})});
    state.pendingBook=false;
    document.getElementById('view-book').innerHTML=`<div class="empty" style="padding:48px 20px;"><div class="ico">✅</div><p style="font-size:17px;font-weight:700;color:var(--text);">Agendado!</p><p>${esc(state.offer.title)} com ${esc(state.barber.displayName)}<br>${new Date(state.slot).toLocaleString('pt-BR',{timeZone:'America/Fortaleza',weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</p><button class="btn" style="margin:18px auto 0;max-width:300px;" data-action="goVia" data-via="cliente">Ver minha agenda</button></div>`;
  }catch(e){toast(e.message);}
}

// ---- event wiring (sem onclick em HTML gerado: data-action + delegation) ----
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
document.getElementById('backBtn').addEventListener('click',goBack);
document.getElementById('q').addEventListener('input',()=>{clearTimeout(searchT);searchT=setTimeout(loadVenues,350);});
document.getElementById('content').addEventListener('click',(e)=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='goVia')goVia(el.dataset.via);
  else if(a==='authLogin')authLogin(el.dataset.role);
  else if(a==='authReg')authShow(el.dataset.role,true);
  else if(a==='authDoReg')authRegister(el.dataset.role);
  else if(a==='authBackLogin')authShow(el.dataset.role,false);
  else if(a==='clienteCancel')clienteCancel(el.dataset.id);
  else if(a==='barberCreate')barberCreate();
  else if(a==='barberTab')barberTab(el.dataset.tab);
  else if(a==='barberAddAvail')barberAddAvail();
  else if(a==='barberDelAvail')barberDelAvail(el.dataset.id);
  else if(a==='barberConfirm')barberConfirm(el.dataset.id);
  else if(a==='barberDone')barberDone(el.dataset.id);
  else if(a==='barberCancel')barberCancel(el.dataset.id);
  else if(a==='openVenue')openVenue(el.dataset.slug);
  else if(a==='goOwner')showTab('owner');
  else if(a==='book')startBook(el.dataset.pid,el.dataset.oid);
  else if(a==='pickDate')pickDate(el);
  else if(a==='pickSlot')pickSlot(el);
  else if(a==='confirm')confirmBook();
  else if(a==='backDiscover')showTab('discover');
  else if(a==='login')doLogin();
  else if(a==='logout')logout();
  else if(a==='createVenue')createVenue();
  else if(a==='publish')publishVenue(el.dataset.vid);
  else if(a==='copylink'){navigator.clipboard.writeText(location.origin+'/barber?v='+el.dataset.slug);toast('Link copiado!');}
  else if(a==='ownerTab')ownerTab(el.dataset.tab);
  else if(a==='apptConfirm')apptAction(el.dataset.id,'confirm');
  else if(a==='apptNoshow')apptAction(el.dataset.id,'no-show');
  else if(a==='apptCancel')apptAction(el.dataset.id,'cancel');
  else if(a==='openCheckout')openCheckout(el.dataset.id);
  else if(a==='addCoProd')addCoProd(el.dataset.pid);
  else if(a==='rmCoProd')rmCoProd(Number(el.dataset.i));
  else if(a==='doCheckout')doCheckout(el.dataset.id);
  else if(a==='addProduct')addProduct();
  else if(a==='delProduct')delProduct(el.dataset.pid);
  else if(a==='cashEntry')cashEntry();
  else if(a==='pkgCreate')pkgCreate();
  else if(a==='pkgDelete')pkgDelete(el.dataset.pid);
  else if(a==='pkgSell')pkgSell();
  else if(a==='pkgUse')pkgUse(el.dataset.pid);
  else if(a==='finAdvAdd')finAdvAdd();
  else if(a==='finAdvSettle')finAdvSettle(el.dataset.id);
  else if(a==='finPayAdd')finPayAdd();
  else if(a==='finPayPay')finPayPay(el.dataset.id);
  else if(a==='finRecAdd')finRecAdd();
  else if(a==='finRecReceive')finRecReceive(el.dataset.id);
  else if(a==="stockMove") stockMove();
  else if(a==="stockConfig") stockConfig(el.dataset.id, el.dataset.name);
  else if(a==="mktQueue") mktQueue();
  else if(a==="mktInactive") mktInactive();
  else if(a==='clubAddTier')clubAddTier();
  else if(a==='clubDelTier')clubDelTier(el.dataset.tid);
  else if(a==='clubAddMember')clubAddMember();
  else if(a==='clubAddConsume')clubAddConsume(el.dataset.pid);
  else if(a==='clubRmConsume')clubRmConsume(Number(el.dataset.i));
  else if(a==='clubDoConsume')clubDoConsume();
});

// ---- init ----
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('v')){setActiveTab('discover');openVenue(params.get('v'));}
  else showTab('home');
})();
</script>
</body>
</html>
