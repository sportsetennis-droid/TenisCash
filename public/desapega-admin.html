<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desapega — Moderação | S&T</title>
<style>
  :root{ --orange:#E5571E; --orange-l:#EE7240; --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  header{background:linear-gradient(135deg,var(--orange),var(--orange-l));color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
  .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:19px;font-weight:800}
  .logout{background:rgba(255,255,255,.2);border:0;color:#fff;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px}
  .wrap{max-width:820px;margin:0 auto;padding:14px 16px 60px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:#374151}
  .tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
  .tab .n{display:inline-block;min-width:18px;text-align:center;background:rgba(0,0,0,.12);border-radius:999px;padding:0 6px;margin-left:5px;font-size:11px}
  .tab.on .n{background:rgba(255,255,255,.3)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .gal{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .gal img{flex:0 0 auto;width:108px;height:108px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
  .ttl{font-weight:800;font-size:17px}
  .pr{color:var(--orange);font-weight:800;font-size:17px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .meta span{background:#f3f4f6;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#374151}
  .desc{white-space:pre-wrap;color:#374151;font-size:14px;margin:6px 0}
  .seller{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:10px 12px;font-size:13px;margin:8px 0}
  .seller b{color:#9a3412}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;flex:1;min-width:120px}
  .ok{background:#16a34a;color:#fff}.no{background:#fff;color:#b91c1c;border:2px solid #fecaca}
  .sold{background:#4f46e5;color:#fff}.pause{background:#f3f4f6;color:#374151}
  .stbadge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
  .st-pending{background:#fef9c3;color:#854d0e}.st-approved{background:#dcfce7;color:#166534}
  .st-rejected{background:#fee2e2;color:#991b1b}.st-sold{background:#e0e7ff;color:#3730a3}.st-paused{background:#f3f4f6;color:#374151}
  .empty{text-align:center;color:var(--muted);padding:50px 16px}
  /* login */
  #login{max-width:380px;margin:60px auto;padding:0 20px}
  #login .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
  #login h2{margin:0 0 14px}
  #login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin-bottom:10px}
  #login button{width:100%;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer}
  .err{color:#b91c1c;font-size:13px;font-weight:600;margin-top:6px;min-height:18px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:none;align-items:center;justify-content:center}
  .lightbox.show{display:flex}.lightbox img{max-width:96%;max-height:92%;border-radius:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="box">
    <h2>Moderação Desapega</h2>
    <p style="color:var(--muted);font-size:14px;margin-top:0">Entre com sua conta de admin.</p>
    <input id="li-user" placeholder="Telefone ou e-mail" inputmode="email">
    <input id="li-pass" type="password" placeholder="Senha">
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header><div class="inner"><h1>🛍️ Desapega — Moderação</h1><button class="logout" onclick="logout()">Sair</button></div></header>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button class="tab on" data-s="pending">Pendentes <span class="n" id="n-pending">0</span></button>
      <button class="tab" data-s="approved">Publicados <span class="n" id="n-approved">0</span></button>
      <button class="tab" data-s="rejected">Reprovados <span class="n" id="n-rejected">0</span></button>
      <button class="tab" data-s="sold">Vendidos <span class="n" id="n-sold">0</span></button>
      <button class="tab" data-s="all">Todos</button>
    </div>
    <div id="list"><div class="empty">Carregando…</div></div>
  </div>
</div>

<div class="lightbox" id="lb" onclick="this.classList.remove('show')"><img id="lbimg"></div>

<script>
const API='/api/desapega';
let TOKEN=localStorage.getItem('tc_token')||'';
let STATUS='pending';
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',');}
const COND={novo_na_caixa:'Novo na caixa',seminovo:'Seminovo',usado:'Usado',bastante_usado:'Bastante usado'};
const STL={pending:'Pendente',approved:'Publicado',rejected:'Reprovado',sold:'Vendido',paused:'Pausado'};

async function api(path,opts){
  const o=opts||{};
  const r=await fetch(API+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401||r.status===403){showLogin('Sessão expirada ou sem permissão de admin.');throw new Error('auth');}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||('Erro '+r.status));
  return j;
}

function showLogin(msg){$('app').style.display='none';$('login').style.display='block';if(msg)$('loginErr').textContent=msg;}
function showApp(){$('login').style.display='none';$('app').style.display='block';load();}

async function doLogin(){
  const u=$('li-user').value.trim(),p=$('li-pass').value;
  if(!u||!p){$('loginErr').textContent='Preencha login e senha';return;}
  const body=u.includes('@')?{email:u,password:p}:{phone:u.replace(/\D/g,''),password:p};
  $('loginErr').textContent='Entrando…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Falha no login');
    const role=j.user&&j.user.role;
    if(!['admin','superadmin','manager'].includes(role)){$('loginErr').textContent='Esta conta não é admin.';return;}
    TOKEN=j.token;localStorage.setItem('tc_token',TOKEN);showApp();
  }catch(e){$('loginErr').textContent=e.message;}
}
function logout(){localStorage.removeItem('tc_token');TOKEN='';showLogin();}

$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');STATUS=t.dataset.s;load();
});

async function load(){
  $('list').innerHTML='<div class="empty">Carregando…</div>';
  try{
    const d=await api('/admin/listings?status='+STATUS+'&limit=200');
    const c=d.counts||{};
    ['pending','approved','rejected','sold'].forEach(s=>{$('n-'+s).textContent=c[s]||0;});
    if(!d.listings.length){$('list').innerHTML='<div class="empty"><div style="font-size:42px">📭</div><p>Nada aqui.</p></div>';return;}
    $('list').innerHTML=d.listings.map(card).join('');
  }catch(e){if(e.message!=='auth')$('list').innerHTML='<div class="empty"><p>'+esc(e.message)+'</p></div>';}
}

function card(l){
  const photos=(l.photos||[]);
  return '<div class="card" id="c-'+l.id+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
      '<span class="stbadge st-'+l.status+'">'+(STL[l.status]||l.status)+'</span>'+
      '<span style="font-size:11px;color:var(--muted)">'+new Date(l.createdAt).toLocaleString('pt-BR')+'</span>'+
    '</div>'+
    '<div class="gal">'+photos.map(u=>'<img src="'+u+'" onclick="lb(\''+u.replace(/'/g,"\\'")+'\')">').join('')+'</div>'+
    '<div style="display:flex;justify-content:space-between;gap:10px"><div class="ttl">'+esc(l.brand?l.brand+' ':'')+esc(l.model)+'</div><div class="pr">'+money(l.askingPrice)+'</div></div>'+
    '<div class="meta">'+
      '<span>'+(COND[l.condition]||l.condition)+'</span>'+
      (l.size?'<span>Tam: '+esc(l.size)+'</span>':'')+
      (l.color?'<span>'+esc(l.color)+'</span>':'')+
      (l.gender?'<span>'+esc(l.gender)+'</span>':'')+
      '<span>'+esc(l.category)+'</span>'+
      (l.originalPrice?'<span>novo: '+money(l.originalPrice)+'</span>':'')+
    '</div>'+
    '<div class="desc">'+esc(l.description)+'</div>'+
    '<div class="seller"><b>Vendedor:</b> '+esc(l.sellerName)+' · 📱 <a href="https://wa.me/55'+esc(l.sellerPhone)+'" target="_blank" style="color:#9a3412;font-weight:700">'+esc(l.sellerPhone)+'</a>'+
      (l.sellerEmail?' · '+esc(l.sellerEmail):'')+
      (l.sellerCity?' · '+esc(l.sellerCity)+(l.sellerState?'/'+esc(l.sellerState):''):'')+
      (l.sellerPixKey?'<br>🔑 Pix: '+esc(l.sellerPixKey):'')+
    '</div>'+
    (l.rejectionReason?'<div style="color:#b91c1c;font-size:13px"><b>Motivo reprovação:</b> '+esc(l.rejectionReason)+'</div>':'')+
    '<div class="acts">'+actions(l)+'</div>'+
  '</div>';
}
function actions(l){
  const a=[];
  if(l.status!=='approved')a.push('<button class="btn ok" onclick="approve(\''+l.id+'\')">✓ Aprovar e publicar</button>');
  if(l.status!=='rejected')a.push('<button class="btn no" onclick="reject(\''+l.id+'\')">✕ Reprovar</button>');
  if(l.status==='approved')a.push('<button class="btn sold" onclick="setStatus(\''+l.id+'\',\'sold\')">💰 Vendido</button>');
  if(l.status==='approved')a.push('<button class="btn pause" onclick="setStatus(\''+l.id+'\',\'paused\')">⏸ Pausar</button>');
  return a.join('');
}

async function approve(id){try{await api('/admin/listings/'+id+'/approve',{method:'POST'});load();}catch(e){alert(e.message);}}
async function reject(id){
  const reason=prompt('Motivo da reprovação (o vendedor vê isso):','Fotos/descrição insuficientes.');
  if(reason===null)return;
  try{await api('/admin/listings/'+id+'/reject',{method:'POST',body:{reason}});load();}catch(e){alert(e.message);}
}
async function setStatus(id,status){try{await api('/admin/listings/'+id+'/status',{method:'POST',body:{status}});load();}catch(e){alert(e.message);}}
function lb(u){$('lbimg').src=u;$('lb').classList.add('show');}

// boot
if(!TOKEN)showLogin();else api('/admin/listings?status=pending&limit=1').then(showApp).catch(e=>{if(e.message==='auth')showLogin();});
</script>
</body>
</html>
