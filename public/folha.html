<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Folha e contracheque</title>
<style>
  :root { --bg:#f4f4f6; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --brand:#E5571E; --brand-soft:#fdeee7;
    --ok:#0a843d; --ok-soft:#e3f7e9; --bad:#d70015; --bad-soft:#ffe5e7; --warn:#a35f00; --warn-soft:#fff1d6; --info:#1b4fd6; --info-soft:#e8f0ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow-x: hidden; }
  a { color: var(--brand); }
  header { background: #111; color: #fff; padding: 12px 20px 0; position: sticky; top: 0; z-index: 10; }
  header .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 200px; }
  header h1 span { color: var(--brand); }
  header .who { font-size: 12px; color: #bbb; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: none; background: transparent; color: #bbb; font-weight: 700; font-size: 14px; padding: 10px 14px; min-height: 44px; cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: #fff; border-bottom-color: var(--brand); }
  .tabs .cnt { background: var(--brand); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 6px; margin-left: 4px; }
  main { max-width: 1440px; margin: 0 auto; padding: 16px 20px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--mute); margin: 22px 0 8px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: end; }
  label { display: block; font-size: 11px; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .4px; margin: 0 0 4px; }
  .fld { margin-top: 10px; }
  input, select, textarea { width: 100%; min-height: 40px; border: 1px solid #d1d1d6; border-radius: 9px; padding: 8px 10px; font-size: 15px; background: #fff; color: var(--ink); font-family: inherit; }
  input[type=checkbox] { width: 20px; min-height: 20px; height: 20px; padding: 0; flex: none; }
  textarea { min-height: 70px; resize: vertical; }
  textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 160px; }
  input:disabled, select:disabled, textarea:disabled { background: #f2f2f5; color: #555; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-height: 40px; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: none; border-radius: 9px; background: var(--brand); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; padding: 8px 14px; white-space: nowrap; text-decoration: none; }
  .btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; }
  .btn.dark { background: #111; } .btn.ok { background: var(--ok); } .btn.ghost { background: #e9e9ee; color: var(--ink); }
  .btn.line { background: #fff; color: var(--ink); border: 1px solid #d1d1d6; }
  .btn.bad { background: #fff; color: var(--bad); border: 1px solid #f3c2c6; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
  .kpi { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .kpi .l { font-size: 11px; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .4px; }
  .kpi .v { font-size: 20px; font-weight: 900; margin-top: 4px; }
  .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); } .kpi.br .v { color: var(--brand); }
  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--mute); background: #fafafa; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.nw { white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #fff8f4; }
  tr.sub td { background: #fbfbfd; }
  .tbl-overview { min-width: 1240px; }
  .tbl-overview td:first-child { min-width: 150px; } .tbl-overview td.pcell { min-width: 220px; max-width: 300px; }
  .muted { color: var(--mute); } .small { font-size: 12px; } .b { font-weight: 800; }
  .tag { align-self: flex-start; display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: #eef1f6; color: #3a4a63; }
  .tag.EM_ANDAMENTO { background: #eef1f6; color: #3a4a63; }
  .tag.COM_PENDENCIAS { background: var(--bad-soft); color: var(--bad); }
  .tag.EM_CONFERENCIA { background: var(--info-soft); color: var(--info); }
  .tag.APROVADO { background: #f3e8ff; color: #7a2bd6; }
  .tag.FECHADO { background: #111; color: #fff; }
  .tag.PAGO { background: var(--ok-soft); color: var(--ok); }
  .tag.REABERTO, .tag.CORRIGIDO { background: var(--warn-soft); color: var(--warn); }
  .tag.CANCELADO, .tag.REVOKED, .tag.off { background: #f2f2f7; color: #8e8e93; text-decoration: line-through; }
  .tag.ACTIVE, .tag.okk { background: var(--ok-soft); color: var(--ok); }
  .tag.PENDING_VALIDATION, .tag.wr { background: var(--warn-soft); color: var(--warn); }
  .tag.bd { background: var(--bad-soft); color: var(--bad); }
  .tag.br { background: var(--brand-soft); color: var(--brand); }
  .pb { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px; margin: 1px 2px 1px 0; white-space: nowrap; cursor: help; }
  .pb.BLOQUEIA { background: var(--bad-soft); color: var(--bad); } .pb.ALERTA { background: var(--warn-soft); color: var(--warn); }
  .note { background: #fff4e5; border: 1px solid #ffd9a8; color: #7a4f00; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 10px 0; line-height: 1.45; }
  .note.info { background: var(--info-soft); border-color: #c4d6ff; color: #173c9e; }
  .note.bad { background: var(--bad-soft); border-color: #f3c2c6; color: #9b0010; }
  .note.ok { background: var(--ok-soft); border-color: #b9e6c7; color: #075c2b; }
  .empty { text-align: center; color: var(--mute); padding: 30px 10px; }
  .pend { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .pend:last-child { border-bottom: none; }
  .bar { height: 8px; background: #eee; border-radius: 99px; overflow: hidden; margin: 6px 0 3px; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .bar.done > i { background: var(--ok); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv > span:first-child { color: var(--mute); } .kv > span:last-child { font-weight: 700; text-align: right; word-break: break-word; }
  .tot { display: flex; justify-content: space-between; font-weight: 900; font-size: 15px; padding: 6px 0; }
  .tot.net { font-size: 19px; color: var(--brand); }
  details { margin-top: 6px; } summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--mute); }
  pre { background: #f6f6f8; border-radius: 8px; padding: 10px; font-size: 11.5px; overflow-x: auto; max-height: 340px; margin: 6px 0 0; white-space: pre; }
  /* drawer */
  .dr-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; justify-content: flex-end; }
  .dr { background: var(--bg); width: min(1060px, 100vw); height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  .dr-h { position: sticky; top: 0; z-index: 2; background: #111; color: #fff; padding: 12px 18px; display: flex; gap: 12px; align-items: center; }
  .dr-h .t { flex: 1; min-width: 0; }
  .dr-h .t b { font-size: 17px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dr-h .t span { font-size: 12px; color: #bbb; }
  .dr-h .x { background: #333; color: #fff; border: none; border-radius: 9px; min-width: 44px; min-height: 44px; font-size: 18px; cursor: pointer; }
  .dr-b { padding: 14px 18px 40px; }
  .seg { display: inline-flex; background: #e5e5ea; border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { min-height: 32px; border: none; border-radius: 7px; background: transparent; font-weight: 800; font-size: 13px; cursor: pointer; padding: 4px 10px; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .ver { display: flex; gap: 8px; flex-wrap: wrap; }
  .ver button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 12px; text-align: left; min-height: 40px; }
  .ver button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  /* modal */
  .md-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .md { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 14px; padding: 16px 18px 18px; }
  .md.wide { max-width: 900px; }
  .md h3 { font-size: 17px; margin: 0 0 6px; }
  .md .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; position: sticky; bottom: -18px; background: #fff; padding: 10px 0 2px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  .ed-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 6px; }
  .sp-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 90; font-size: 14px; max-width: 92vw; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.err { background: var(--bad); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: var(--brand); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: middle; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    header { padding: 10px 14px 0; } main { padding: 12px 14px 40px; }
    .grid2, .grid3, .fgrid { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr 1fr; }
    .dr-b { padding: 12px 14px 40px; }
    .md-bg { align-items: flex-end; padding: 0; }
    .md { border-radius: 16px 16px 0 0; max-height: 94vh; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .btn { min-height: 44px; } .btn.sm { min-height: 38px; }
    .ed-row { grid-template-columns: 1fr 1fr; } .ed-row > :last-child { grid-column: 1 / -1; }
    .kpi .v { font-size: 17px; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Folha <span>/</span> Contracheque</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"><div class="empty"><span class="spin"></span> Carregando…</div></main>

<script>
'use strict';
// ─────────────────────────── base ───────────────────────────
const TOKEN = localStorage.getItem('tc_admin_token') || localStorage.getItem('tc_token') || '';
const API = '/api/payroll';
const S = {
  tab: 'painel', me: null, comp: '', rows: [], names: {}, stores: {}, issuers: {},
  f: { storeId: '', issuerId: '', status: '', contractType: '', pendency: false },
  open: {}, d: null, ccStatus: 'PENDENTE', holYear: '', counts: {},
};

const STATUS = { EM_ANDAMENTO: 'Em andamento', COM_PENDENCIAS: 'Com pendências', EM_CONFERENCIA: 'Em conferência', APROVADO: 'Aprovado',
  FECHADO: 'Fechado', PAGO: 'Pago', REABERTO: 'Reaberto', CORRIGIDO: 'Corrigido', CANCELADO: 'Cancelado' };
const CONTRACT = { MENSALISTA: 'Mensalista', HORISTA: 'Horista', ESCALA_12X36: 'Escala 12x36', APRENDIZ: 'Aprendiz', PARCIAL: 'Tempo parcial', SEM_REGISTRO: 'Sem registro' };
const ENTRY_LABEL = {
  ADIANTAMENTO: 'Adiantamento salarial (vale)', PASSAGEM: 'Passagem entregue', VALE_TRANSPORTE: 'Vale-transporte entregue',
  VALE_ALIMENTACAO: 'Vale-alimentação', DOMINGO_PAGO: 'Domingo pago antecipadamente', FERIADO_PAGO: 'Feriado pago antecipadamente',
  COMISSAO_ANTECIPADA: 'Comissão adiantada', COMPRA_LOJA: 'Compra na loja', EMPRESTIMO: 'Empréstimo autorizado',
  PENSAO: 'Pensão alimentícia', OUTRO_DESCONTO: 'Outro desconto', BONUS: 'Bônus salarial', GRATIFICACAO: 'Gratificação', OUTRO_PROVENTO: 'Outro provento',
};
const NEEDS_AUTH = ['COMPRA_LOJA', 'EMPRESTIMO', 'PENSAO', 'OUTRO_DESCONTO'];
const MARK_LABEL = { FOLGA: 'Folga', FOLGA_COMPENSATORIA: 'Folga compensatória (domingo/feriado)', ATESTADO: 'Atestado médico', ABONO: 'Abono',
  FALTA_CONFIRMADA: 'Falta confirmada', ATRASO_CONFIRMADO: 'Atraso confirmado', FERIAS: 'Férias', AFASTAMENTO: 'Afastamento' };
const DAY_STATUS = { COMPLETO: 'Completo', INCOMPLETO: 'Ponto incompleto', EM_ANDAMENTO: 'Em andamento', DOMINGO_TRABALHADO: 'Domingo trabalhado', DOMINGO_TROCA: 'Domingo (troca de folga)', FOLGA_TROCA: 'Folga da troca de domingo',
  FERIADO_TRABALHADO: 'Feriado trabalhado', FOLGA: 'Folga', FOLGA_COMPENSATORIA: 'Folga compensatória', ABONO: 'Abono', ATESTADO: 'Atestado',
  ATESTADO_PARCIAL: 'Atestado parcial', FALTA_CONFIRMADA: 'Falta confirmada', FERIAS: 'Férias', AFASTAMENTO: 'Afastamento', FUTURO: '—',
  FERIADO: 'Feriado', DESCANSO: 'Descanso', SEM_PONTO: 'Sem ponto', FORA_DO_VINCULO: 'Fora do vínculo' };
const DAY_TONE = { COMPLETO: 'okk', INCOMPLETO: 'bd', SEM_PONTO: 'bd', FALTA_CONFIRMADA: 'bd', DOMINGO_TRABALHADO: 'br', FERIADO_TRABALHADO: 'br', EM_ANDAMENTO: 'wr' };
const SPECIAL_STATUS = { PAGAMENTO_PENDENTE: 'Valor do dia pendente', CONCILIADO: 'Conciliado', DIVERGENTE: 'Divergente (pago a mais)',
  TRABALHADO_E_PAGO: 'Pago — falta folga', TRABALHADO_E_NAO_PAGO: 'Trabalhado e não pago' };
const COMPOFF = { FOLGA_UTILIZADA: 'Folga utilizada', FOLGA_PENDENTE: 'Folga pendente', SEM_FOLGA: 'Sem folga prevista' };
const PUNCH = { entry: 'Entrada', break_start: 'Início do intervalo', break_end: 'Fim do intervalo', exit: 'Saída' };
const PEND_LABEL = { PONTO_INCOMPLETO: 'Ponto incompleto', SEM_PONTO: 'Dia sem ponto', FOLGA_PENDENTE: 'Folga pendente', DESCONTO_SEM_AUTORIZACAO: 'Desconto sem autorização',
  LANCAMENTO_SEM_CLASSIFICACAO: 'Lançamento sem classificação', REGRA_COMISSAO: 'Sem regra de comissão', CADASTRO: 'Cadastro de contrato', CONTRATO: 'Tipo de contrato',
  SALARIO: 'Salário', VALOR_HORA: 'Valor da hora', ADMISSAO: 'Admissão', SEM_REGISTRO: 'Sem registro', APRENDIZ_CONTRATO: 'Contrato de aprendiz',
  ESCALA_12X36: 'Escala 12x36', ABAIXO_MINIMO: 'Abaixo do mínimo', HE_PENDENTE: 'Hora extra pendente', HORAS_FALTANTES: 'Horas faltantes',
  ESPECIAL_DIVERGENTE: 'Dia especial divergente', VENDAS_PENDENTES: 'Vendas pendentes', LIQUIDO_NEGATIVO: 'Líquido negativo', PARAM_PENDENTE: 'Parâmetro pendente',
  ANTECIPADO_SEM_DIA: 'Antecipado sem dia', ANTECIPADO_SEM_PONTO: 'Antecipado sem ponto', ANTECIPADO_SEM_VALOR: 'Antecipado sem valor', PARAM: 'Parâmetro' };
const PARAM_LABEL = { INSS_EMPREGADO: 'INSS do empregado', IRRF_MENSAL: 'IRRF mensal', IRRF_REDUTOR: 'Redutor do IRRF (Lei 15.270)', SALARIO_MINIMO: 'Salário mínimo',
  FGTS: 'FGTS', VALE_TRANSPORTE: 'Vale-transporte', HORA_EXTRA: 'Hora extra', ADICIONAL_NOTURNO: 'Adicional noturno', SALARIO_FAMILIA: 'Salário-família',
  DOMINGO_TRABALHADO: 'Domingo trabalhado', FERIADO_TRABALHADO: 'Feriado trabalhado', VALE_ALIMENTACAO_DIA: 'Vale-alimentação por dia', PASSAGEM_DIA: 'Passagem por dia' };
const PARAM_STATUS = { ACTIVE: 'Vigente', PENDING_VALIDATION: 'Pendente de validação do DP', REVOKED: 'Revogado' };
const OPEN_ST = ['EM_CONFERENCIA', 'COM_PENDENCIAS', 'APROVADO'];
const FROZEN_ST = ['FECHADO', 'PAGO'];
const HAS_PDF_ST = ['FECHADO', 'PAGO', 'REABERTO', 'CORRIGIDO'];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function brl(c) { return c == null ? '—' : (Number(c) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function money(c) { return c == null || c === '' ? '' : (Number(c) / 100).toFixed(2).replace('.', ','); }
function hm(m) { m = Math.round(Number(m) || 0); const s = m < 0 ? '−' : ''; m = Math.abs(m); return s + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); }
function dmy(k) { if (!k) return '—'; const [y, m, d] = String(k).slice(0, 10).split('-'); return d + '/' + m + '/' + y; }
function dt(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function todayKey() { return new Date(Date.now() - 3 * 3600000).toISOString().slice(0, 10); }
function compLabel(c) { const [y, m] = c.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][Number(m) - 1] + '/' + y; }
function addDay(k) { const d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
// Confirmação em dois cliques dentro do próprio formulário (não perde o que foi digitado).
function confirmStep(md, btn, html) {
  if (btn.dataset.armed === '1') return true;
  let box = md.querySelector('.confirm-box');
  if (!box) { box = document.createElement('div'); box.className = 'note confirm-box'; btn.closest('.acts').before(box); }
  box.innerHTML = html + '<div class="small" style="margin-top:6px"><b>Confira e clique em “Confirmar”.</b> Mudou algo? A confirmação recomeça.</div>';
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = 'Confirmar';
  box.scrollIntoView({ block: 'nearest' });
  const reset = () => { btn.dataset.armed = ''; btn.textContent = btn.dataset.label; box.remove(); };
  md.addEventListener('input', reset, { once: true });
  return false;
}
function lastDayOf(c) { const [y, m] = c.split('-').map(Number); return c + '-' + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0'); }
// R$ digitado ("1.621,00", "1621.5", "R$ 30") → centavos inteiros (null se vazio/inválido).
function toCents(v) {
  let s = String(v == null ? '' : v).replace(/R\$|\s/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) : NaN;
}
function tag(st, label) { return '<span class="tag ' + esc(st) + '">' + esc(label || STATUS[st] || st) + '</span>'; }
function isOwner() { return !!(S.me && S.me.isOwner); }
function storeName(id) { const s = S.stores[id]; return s ? s.code + ' · ' + s.name : (id ? 'Loja ' + String(id).slice(0, 6) : '—'); }

function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5200 : 2800); }

async function req(path, { method = 'GET', body, raw } = {}) {
  const headers = { Authorization: 'Bearer ' + TOKEN };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const r = await fetch(API + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (raw && r.ok) return r;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(d.error || ('Erro ' + r.status)); e.status = r.status;
    if (r.status === 401) authFail('Sessão expirada ou inválida.');
    throw e;
  }
  return d;
}
const post = (p, b) => req(p, { method: 'POST', body: b || {} });
const put = (p, b) => req(p, { method: 'PUT', body: b || {} });

function authFail(msg) {
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('view').innerHTML = '<div class="card" style="max-width:560px;margin:40px auto;text-align:center"><h3>' + esc(msg) + '</h3>' +
    '<p class="muted">Esta área é da administração. Entre no <a href="/admin.html">painel administrativo (/admin.html)</a> neste navegador e volte para esta página.</p>' +
    '<a class="btn" href="/admin.html">Ir para o login</a></div>';
}

async function blobOpen(path, { download } = {}) {
  try {
    const r = await req(path, { raw: true });
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const cd = r.headers.get('Content-Disposition') || '';
    const m = /filename="?([^";]+)"?/.exec(cd);
    const a = document.createElement('a'); a.href = url;
    if (download) a.download = m ? m[1] : 'arquivo'; else a.target = '_blank';
    a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast(e.message, true); }
}

function modal(html, { wide } = {}) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'md-bg'; bg.id = 'md';
  bg.innerHTML = '<div class="md' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const first = bg.querySelector('input:not([type=checkbox]):not(:disabled), select:not(:disabled), textarea:not(:disabled)');
  if (first) setTimeout(() => first.focus(), 30);
  return bg.querySelector('.md');
}
function closeModal() { const m = document.getElementById('md'); if (m) m.remove(); }
// ask: diálogo de confirmação com campos opcionais. Resolve com os valores ou null.
function ask({ title, html = '', fields = [], ok = 'Confirmar', danger = false }) {
  return new Promise((resolve) => {
    const f = fields.map((x) => '<div class="fld"><label for="ask_' + x.name + '">' + esc(x.label) + (x.required ? ' *' : '') + '</label>' +
      (x.type === 'textarea' ? '<textarea id="ask_' + x.name + '" placeholder="' + esc(x.placeholder || '') + '">' + esc(x.value || '') + '</textarea>'
        : x.type === 'checkbox' ? '<label class="check" style="text-transform:none;font-size:14px;color:var(--ink)"><input type="checkbox" id="ask_' + x.name + '"' + (x.value ? ' checked' : '') + '> ' + esc(x.hint || '') + '</label>'
        : '<input id="ask_' + x.name + '" type="' + (x.type || 'text') + '" value="' + esc(x.value || '') + '" placeholder="' + esc(x.placeholder || '') + '">') + '</div>').join('');
    const md = modal('<h3>' + esc(title) + '</h3>' + html + f + '<div class="note bad" id="ask_err" style="display:none"></div>' +
      '<div class="acts"><button class="btn ghost" id="ask_no">Voltar</button><button class="btn ' + (danger ? 'bad' : '') + '" id="ask_ok">' + esc(ok) + '</button></div>');
    md.querySelector('#ask_no').onclick = () => { closeModal(); resolve(null); };
    md.querySelector('#ask_ok').onclick = () => {
      const out = {};
      for (const x of fields) {
        const el = md.querySelector('#ask_' + x.name);
        out[x.name] = x.type === 'checkbox' ? el.checked : el.value.trim();
        const min = x.minLength || 1;
        if (x.required && String(out[x.name]).length < min) {
          const e = md.querySelector('#ask_err'); e.style.display = 'block';
          e.textContent = 'Preencha: ' + x.label + (min > 1 ? ' (mínimo ' + min + ' caracteres)' : '') + '.'; el.focus(); return;
        }
      }
      closeModal(); resolve(out);
    };
  });
}
// run: executa uma ação com o botão travado e mostra o erro do servidor.
async function run(btn, fn, okMsg) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); return undefined; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

async function loadOverview() {

  if (S.f.storeId) q.set('storeId', S.f.storeId);

// A mesma pendência de cadastro pode vir duas vezes (prévia + painel): mostra uma só.
function cleanPend(list) {
  const seen = new Set(); const out = [];
  for (const p of list || []) { const k = p.code === 'CADASTRO' ? 'CADASTRO' : p.code + '|' + p.text; if (seen.has(k)) continue; seen.add(k); out.push(p); }
  return out;
}
function pendLabel(code) {
  if (PEND_LABEL[code]) return PEND_LABEL[code];
  if (code.startsWith('PARAM_')) return 'Parâmetro ' + code.slice(6).replace(/_/g, ' ').toLowerCase();
  return code.replace(/_/g, ' ').toLowerCase();
}
function pendBadges(list) {
  const groups = new Map();
  for (const p of list) {
    const g = groups.get(p.code) || { code: p.code, n: 0, sev: 'ALERTA', texts: [] };
    g.n++; if (p.severity === 'BLOQUEIA') g.sev = 'BLOQUEIA'; g.texts.push(p.text); groups.set(p.code, g);
  }
  return [...groups.values()].sort((a, b) => (a.sev === b.sev ? 0 : a.sev === 'BLOQUEIA' ? -1 : 1))
    .map((g) => '<span class="pb ' + g.sev + '" title="' + esc(g.texts.slice(0, 12).join('\n') + (g.texts.length > 12 ? '\n…' : '')) + '">' + esc(pendLabel(g.code)) + (g.n > 1 ? ' ×' + g.n : '') + '</span>').join('');
}
function pendItems(list) {
  if (!list.length) return '<div class="muted small">Sem pendências.</div>';
  return list.map((p) => '<div class="pend"><span class="pb ' + esc(p.severity) + '">' + (p.severity === 'BLOQUEIA' ? 'Bloqueia' : 'Alerta') + '</span><div><b>' + esc(pendLabel(p.code)) + '</b> — ' + esc(p.text) + '</div></div>').join('');
}

  H.push('<div class="card"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">' +
    '<div>' + (slip ? tag(st) + ' <span class="muted small">versão ' + esc(slip.version) + (slip.closedAt ? ' · fechado em ' + esc(dt(slip.closedAt)) : '') + (slip.paidAt ? ' · pago em ' + esc(dt(slip.paidAt)) : '') + '</span>' : tag('EM_ANDAMENTO', 'Sem contracheque gravado — prévia')) + '</div>' +
    '<div style="text-align:right"><div class="small muted">Líquido ' + (D.view === 'slip' && slip && slip.result ? 'da versão' : 'da prévia') + '</div><div style="font-size:24px;font-weight:900;color:var(--brand)">' + brl(result.totals.netCents) + '</div></div></div>');
  if (slip && slip.paymentRef) H.push('<div class="small muted">Comprovante do pagamento: <b>' + esc(slip.paymentRef) + '</b></div>');
  if (slip && slip.verifyCode) H.push('<div class="small muted">Código de verificação: <b>' + esc(slip.verifyCode) + '</b></div>');
  if (slip && slip.reason) H.push('<div class="small muted">Motivo/observação: ' + esc(slip.reason) + '</div>');
  const A = [];
  const canReview = isLatest && (!st || OPEN_ST.includes(st));
  if (canReview) A.push('<button class="btn dark" data-act="review">' + (st ? 'Revisar de novo' : 'Revisar (gerar conferência)') + '</button>');
  if (own && isLatest && st === 'EM_CONFERENCIA') A.push('<button class="btn ok" data-act="approve">Aprovar</button>');
  if (own && isLatest && st === 'APROVADO') A.push('<button class="btn" data-act="close">Fechar contracheque</button>');
  if (own && isLatest && st === 'FECHADO') A.push('<button class="btn ok" data-act="pay">Registrar pagamento</button>');
  if (own && isLatest && FROZEN_ST.includes(st)) A.push('<button class="btn line" data-act="notify">Reenviar WhatsApp</button><button class="btn bad" data-act="reopen">Reabrir</button>');
  if (own && isLatest && OPEN_ST.includes(st)) A.push('<button class="btn bad" data-act="cancelSlip">Cancelar rascunho</button>');
  if (slip && HAS_PDF_ST.includes(st)) A.push('<button class="btn line" data-act="pdf">PDF</button>');
  if (slip && slip.result) A.push('<button class="btn line" data-act="exp" data-f="csv">CSV</button><button class="btn line" data-act="exp" data-f="json">JSON</button>');
  if (slip && HAS_PDF_ST.includes(st)) A.push('<button class="btn line" data-act="recompute">Reprodutível?</button>');
  H.push('<div class="btns" style="margin-top:12px">' + A.join('') + '</div>');
  if (!own) H.push('<div class="small muted" style="margin-top:8px">Aprovar, fechar, pagar, reabrir e cancelar são só do dono.</div>');
  if (st === 'APROVADO' && todayKey() <= lastDayOf(D.comp)) H.push('<div class="note">A competência ainda não terminou: o fechamento só é aceito a partir de ' + esc(dmy(addDay(lastDayOf(D.comp)))) + '.</div>');
  if (st === 'COM_PENDENCIAS') H.push('<div class="note bad">Há pendências que bloqueiam a aprovação. Resolva (cadastro, ponto, lançamentos) e clique em <b>Revisar de novo</b>.</div>');
  if (slip && !slip.result) H.push('<div class="note info">Esta versão ainda não tem cálculo gravado (nova versão após reabertura). Clique em <b>Revisar</b> para gerar a conferência.</div>');
  const lk = D.locked ? ' disabled title="Competência fechada: reabra o contracheque para alterar"' : '';
  H.push('<div class="btns" style="margin-top:10px"><button class="btn sm ghost" data-act="profile">Cadastro de contrato</button><button class="btn sm ghost" data-act="newEntry"' + lk + '>+ Lançamento</button><button class="btn sm ghost" data-act="newMark"' + lk + '>+ Marcação de dia</button></div>');
  if (D.locked) H.push('<div class="small muted" style="margin-top:6px">Competência fechada: lançamentos e marcações ficam travados. Para corrigir, o dono reabre (gera nova versão).</div>');
  H.push('</div>');
  // Versões
  if (versions.length) {
    H.push('<h2>Versões desta competência</h2><div class="ver">' + versions.map((v) => '<button data-act="version" data-id="' + esc(v.id) + '" class="' + (slip && v.id === slip.id ? 'on' : '') + '"><b>v' + esc(v.version) + '</b> ' + tag(v.status) +
      '<div class="small muted">' + brl(v.netCents) + (v.closedAt ? ' · ' + esc(dt(v.closedAt)) : '') + '</div>' + (v.reason ? '<div class="small muted">' + esc(v.reason) + '</div>' : '') + '</button>').join('') + '</div>' +
      '<div class="small muted" style="margin-top:6px">Reabrir nunca apaga: a versão fechada fica preservada e nasce uma versão nova.</div>');
  }
  if (slip && slip.result) {
    H.push('<div style="margin-top:14px" class="seg"><button data-act="view" data-v="slip" class="' + (D.view === 'slip' ? 'on' : '') + '">Cálculo gravado (v' + esc(slip.version) + ')</button><button data-act="view" data-v="preview" class="' + (D.view === 'preview' ? 'on' : '') + '">Prévia ao vivo</button></div>');
  }
  if (result.provisional) H.push('<div class="note info">Prévia: valores calculados até ' + esc(dmy(result.asOfDay)) + '. Não é o contracheque oficial.</div>');
  // Pendências
  H.push('<h2>Pendências (' + pend.length + (blocking ? ', ' + blocking + ' bloqueiam' : '') + ')</h2><div class="card">' + pendItems(pend) + '</div>');
  H.push(renderResult(result));
  H.push(renderEntriesMarks());
  bg.querySelector('.dr-b').innerHTML = H.join('');
}

function renderResult(r) {
  const H = [];
  const items = r.items || [];
  const prov = items.filter((i) => i.type === 'PROVENTO'), desc = items.filter((i) => i.type === 'DESCONTO');
  const itemRows = (list) => list.map((i) => '<tr><td class="nw small muted">' + esc(i.code) + '</td><td><b>' + esc(i.label) + '</b>' + (i.provisional ? ' <span class="tag wr">provisório</span>' : '') + (i.nonTaxable ? ' <span class="tag">não tributável</span>' : '') +
    '</td><td class="nw">' + esc(i.refText || '') + '</td><td class="n b">' + brl(i.cents) + '</td><td class="small muted" style="min-width:260px">' + esc(i.memo || '') + '</td></tr>').join('');
  H.push('<h2>Contracheque — memória de cálculo</h2><div class="tw"><table style="min-width:720px"><thead><tr><th>Código</th><th>Descrição</th><th>Referência</th><th class="n">Valor</th><th>Memória de cálculo</th></tr></thead><tbody>' +
    '<tr class="sub"><td colspan="5" class="b" style="color:var(--ok)">Proventos</td></tr>' + (itemRows(prov) || '<tr><td colspan="5" class="muted">—</td></tr>') +
    '<tr class="sub"><td colspan="5" class="b" style="color:var(--bad)">Descontos</td></tr>' + (itemRows(desc) || '<tr><td colspan="5" class="muted">—</td></tr>') +
    '</tbody></table></div>');
  const t = r.totals || {};
  H.push('<div class="card" style="margin-top:10px"><div class="tot"><span>Proventos</span><span>' + brl(t.grossCents) + '</span></div><div class="tot"><span>Descontos</span><span>− ' + brl(t.deductionsCents) + '</span></div><div class="tot net"><span>Líquido</span><span>' + brl(t.netCents) + '</span></div>' +
    (r.projection ? '<div class="small muted" style="margin-top:6px">Projeção até o fim do mês (' + esc(r.projection.basis || 'ritmo atual') + '): bruto ' + brl(r.projection.grossCents) + ' · líquido ' + brl(r.projection.netCents) + ' — só informativa.</div>' : '') + '</div>');
  // Bases
  const b = r.bases || {};
  if (r.kind === 'MENSAL' || b.inss || b.fgts) {
    H.push('<h2>Bases e encargos</h2><div class="grid2"><div class="card">' +
      '<div class="kv"><span>Base de contribuição</span><span>' + brl(b.contributionBaseCents) + '</span></div>' +
      '<div class="kv"><span>INSS (desconto)</span><span>' + (b.inss ? brl(b.inss.valueCents) + '<div class="small muted">base ' + brl(b.inss.baseCents) + (b.inss.parts ? ' · ' + esc(b.inss.parts.map((p) => p.rate + '% → ' + brl(p.valueCents)).join(' + ')) : '') + '</div>' : 'não se aplica') + '</span></div>' +
      '<div class="kv"><span>IRRF (desconto)</span><span>' + (b.irrf ? brl(b.irrf.valueCents) + '<div class="small muted">base ' + brl(b.irrf.baseCents) + ' · alíquota ' + esc(b.irrf.rate) + '% · ' + (b.irrf.useSimplified ? 'desconto simplificado' : 'deduções legais') + (b.irrf.reductionCents ? ' · redução ' + brl(b.irrf.reductionCents) : '') + '</div>' : 'não se aplica') + '</span></div>' +
      '<div class="kv"><span>Dependentes IRRF</span><span>' + esc(b.dependents || 0) + '</span></div></div><div class="card">' +
      '<div class="kv"><span>FGTS<div class="small">depósito da empresa, <b>não é desconto</b></div></span><span>' + (b.fgts ? brl(b.fgts.valueCents) + '<div class="small muted">' + esc(b.fgts.rate) + '% de ' + brl(b.fgts.baseCents) + '</div>' : 'não se aplica') + '</span></div>' +
      '<div class="kv"><span>Vale-transporte</span><span>' + (b.vt ? brl(b.vt.valueCents) + '<div class="small muted">teto 6% ' + brl(b.vt.capCents) + ' · custo ' + brl(b.vt.costCents) + '</div>' : '—') + '</span></div>' +
      (r.contract ? '<div class="kv"><span>Valor da hora</span><span>' + brl(r.contract.hourCents) + (r.contract.divisor ? ' <span class="small muted">(divisor ' + esc(r.contract.divisor) + ')</span>' : '') + '</span></div>' +
        '<div class="kv"><span>Dias de vínculo no mês</span><span>' + esc(r.contract.bondDays) + '</span></div>' +
        '<div class="kv"><span>Banco de horas</span><span>' + (r.contract.timeBank ? 'sim (acordo)' : 'não') + '</span></div>' : '') +
      '</div></div>');
  }
  // Comissão
  const c = r.commission;
  if (c) {
    H.push('<h2>Comissão</h2><div class="card">');
    if (c.missingRule) H.push('<div class="note">Nenhuma regra de comissão vigente para este funcionário.</div>');
    else {
      const cf = c.confirmed || {};
      H.push('<div class="small muted">Regra: <b>' + esc(c.ruleName) + '</b> (versão ' + esc(c.ruleVersion) + ')</div>');
      H.push('<div class="grid3" style="margin-top:8px"><div class="kpi"><div class="l">Vendas confirmadas</div><div class="v">' + brl(cf.totalCents) + '</div><div class="small muted">' + esc(cf.count || 0) + ' venda(s)</div></div>' +
        '<div class="kpi"><div class="l">Alíquota atual</div><div class="v">' + esc(cf.generalPct) + '%</div></div>' +
        '<div class="kpi br"><div class="l">Comissão</div><div class="v">' + brl(cf.commissionCents) + '</div></div></div>');
      if (cf.nextTier) {
        const pct = Math.min(100, Math.round((cf.totalCents || 0) / cf.nextTier.aboveCents * 100));
        H.push('<div style="margin-top:10px"><b>Próxima faixa: ' + esc(cf.nextTier.pct) + '%</b> acima de ' + brl(cf.nextTier.aboveCents) + '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="small muted">' + pct + '% — faltam ' + brl(cf.nextTier.missingCents) + '</div></div>');
      } else H.push('<div class="small muted" style="margin-top:8px">Já está na faixa mais alta.</div>');
      for (const sp of cf.specials || []) {
        const pct = sp.aboveCents ? Math.min(100, Math.round(sp.totalCents / sp.aboveCents * 100)) : 100;
        H.push('<div style="margin-top:10px"><b>' + esc(sp.name) + '</b> — ' + esc(sp.pct) + '% acima de ' + brl(sp.aboveCents) + ' ' + (sp.reached ? '<span class="tag okk">atingida: ' + brl(sp.commissionCents) + '</span>' : '<span class="tag">não atingida</span>') +
          '<div class="bar' + (sp.reached ? ' done' : '') + '"><i style="width:' + pct + '%"></i></div><div class="small muted">' + brl(sp.totalCents) + ' vendidos' + (sp.reached ? '' : ' · faltam ' + brl(sp.missingCents)) + '</div></div>');
      }
      const pd = c.pending || {}, cc = c.canceled || {};
      H.push('<div class="grid2" style="margin-top:10px"><div>' +
        '<div class="kv"><span>Pendentes de pagamento</span><span>' + esc(pd.count || 0) + ' · ' + brl(pd.salesCents) + (pd.extraCommissionCents ? '<div class="small muted">+' + brl(pd.extraCommissionCents) + ' se confirmarem</div>' : '') + '</span></div>' +
        '<div class="kv"><span>Canceladas (fora)</span><span>' + esc(cc.count || 0) + ' · ' + brl(cc.salesCents) + '</span></div>' +
        (c.other && c.other.count ? '<div class="kv"><span>Outros status (fora)</span><span>' + esc(c.other.count) + ' · ' + esc((c.other.statuses || []).join(', ')) + '</span></div>' : '') +
        (c.projection ? '<div class="kv"><span>Projeção (' + esc(c.projection.basis) + ')</span><span>' + brl(c.projection.salesCents) + ' → ' + brl(c.projection.commissionCents) + '</span></div>' : '') +
        '</div><div>' + ((c.byCategory || []).length ? (c.byCategory.map((x) => '<div class="kv"><span>' + esc(x.category) + '</span><span>' + brl(x.salesCents) + '</span></div>').join('')) : '<div class="small muted">Sem vendas por categoria.</div>') + '</div></div>');
    }
    H.push('</div>');
  }
  // Dias especiais
  const sd = r.specialDays || [];
  if (r.kind === 'MENSAL' || sd.length) {
    H.push('<h2>Domingos e feriados trabalhados (' + sd.length + ')</h2>');
    if (!sd.length) H.push('<div class="card muted small">Nenhum no mês.</div>');
    else H.push('<div class="tw"><table style="min-width:900px"><thead><tr><th>Data</th><th>Tipo</th><th>Horário</th><th class="n">Horas</th><th class="n">Devido</th><th class="n">Pago antes</th><th class="n">Saldo</th><th>Folga compensatória</th><th>Situação</th></tr></thead><tbody>' +
      sd.map((s) => '<tr><td class="nw">' + esc(dmy(s.date)) + ' <span class="small muted">' + esc(s.weekdayName || '') + '</span></td><td>' + esc(s.type === 'FERIADO' ? 'Feriado' + (s.holiday ? ' — ' + s.holiday : '') : 'Domingo') + '</td>' +
        '<td class="nw">' + esc((s.entry || '?') + '–' + (s.exit || '?')) + '</td><td class="n">' + hm(s.workedMinutes) + '</td><td class="n">' + (s.dueCents == null ? '<span class="tag wr">pendente</span>' : brl(s.dueCents)) + '</td>' +
        '<td class="n">' + brl(s.paidCents) + (s.paidAt ? '<div class="small muted">' + esc(dmy(s.paidAt)) + '</div>' : '') + '</td><td class="n">' + (s.balanceCents == null ? '—' : brl(s.balanceCents)) + '</td>' +
        '<td>' + tag(s.compOffStatus === 'FOLGA_PENDENTE' ? 'wr' : s.compOffStatus === 'FOLGA_UTILIZADA' ? 'okk' : '', COMPOFF[s.compOffStatus] || s.compOffStatus) + (s.compensatoryDayOff ? ' <span class="small muted">' + esc(dmy(s.compensatoryDayOff)) + '</span>' : '') + '</td>' +
        '<td>' + tag(s.status === 'CONCILIADO' ? 'okk' : s.status === 'DIVERGENTE' || s.status === 'TRABALHADO_E_NAO_PAGO' ? 'bd' : 'wr', SPECIAL_STATUS[s.status] || s.status) + '</td></tr>').join('') + '</tbody></table></div>');
  }
  // Jornada
  const tm = r.time;
  if (tm) {
    const T = tm.totals || {};
    H.push('<h2>Jornada</h2><div class="kpis">' +
      '<div class="kpi"><div class="l">Registradas</div><div class="v">' + hm(T.registeredMinutes) + '</div></div>' +
      '<div class="kpi"><div class="l">Previstas</div><div class="v">' + hm(T.expectedMinutes) + '</div></div>' +
      '<div class="kpi"><div class="l">Horas extras</div><div class="v">' + hm(T.extraMinutes) + '</div><div class="small muted">' + hm(T.extraConfirmedMinutes) + ' confirmadas</div></div>' +
      '<div class="kpi' + (T.missingMinutes ? ' bad' : '') + '"><div class="l">Faltantes</div><div class="v">' + hm(T.missingMinutes) + '</div></div>' +
      '<div class="kpi"><div class="l">Creditadas (abono/atestado/folga)</div><div class="v">' + hm(T.creditedMinutes) + '</div></div>' +
      '<div class="kpi"><div class="l">Noturnas</div><div class="v">' + hm(T.nightMinutes) + '</div></div></div>');
    if (tm.shifts12x36) {
      const s = tm.shifts12x36;
      H.push('<div class="card"><b>Escala 12x36</b><div class="kv"><span>Plantão</span><span>' + hm(s.shiftMinutes) + '</span></div><div class="kv"><span>Plantões na escala / trabalhados</span><span>' + esc(s.scheduledShifts) + ' / ' + esc(s.workedShifts) + '</span></div>' +
        '<div class="kv"><span>Extra (acima do plantão)</span><span>' + hm(s.extraMinutes) + '</span></div>' + (s.missingShifts.length ? '<div class="kv"><span>Plantões pendentes</span><span>' + esc(s.missingShifts.map(dmy).join(', ')) + '</span></div>' : '') + '</div>');
    }
    if ((tm.weeks || []).length) {
      H.push('<div class="tw"><table style="min-width:820px"><thead><tr><th>Semana (seg–sáb)</th><th class="n">Prevista</th><th class="n">Registrada</th><th class="n">Crédito</th><th class="n">Saldo</th><th class="n">Extra</th><th class="n">Faltante</th><th class="n">Domingo seguinte</th><th>Situação</th></tr></thead><tbody>' +
        tm.weeks.map((w) => '<tr><td class="nw">' + esc(dmy(w.from)) + ' a ' + esc(dmy(w.to)) + (w.fullWeek ? '' : ' <span class="small muted">(parcial)</span>') + '</td><td class="n">' + hm(w.expectedMinutes) + '</td><td class="n">' + hm(w.registeredMinutes) + '</td><td class="n">' + hm(w.creditedMinutes) + '</td>' +
          '<td class="n b">' + hm(w.balanceMinutes) + '</td><td class="n">' + hm(w.extraMinutes) + '</td><td class="n">' + hm(w.missingMinutes) + '</td><td class="n">' + (w.sundayWorkedMinutes ? hm(w.sundayWorkedMinutes) : '—') + '</td>' +
          '<td>' + (w.pendingDays.length ? '<span class="tag bd">' + w.pendingDays.length + ' dia(s) pendente(s)</span>' : w.provisional ? '<span class="tag wr">provisória</span>' : '<span class="tag okk">fechada</span>') + '</td></tr>').join('') + '</tbody></table></div>');
    }
    H.push('<details style="margin-top:10px"' + ((T.incompleteDays || []).length ? ' open' : '') + '><summary>Dia a dia (' + (tm.days || []).length + ' dias)</summary><div class="tw" style="margin-top:8px"><table style="min-width:980px"><thead><tr><th>Data</th><th>Situação</th><th>Entrada</th><th>Intervalo</th><th>Saída</th><th class="n">Trabalhado</th><th class="n">Previsto</th><th class="n">Crédito</th><th>Observações</th></tr></thead><tbody>' +
      (tm.days || []).filter((x) => !x.future || x.marks.length).map((x) => '<tr><td class="nw">' + esc(dmy(x.date)) + ' <span class="small muted">' + esc(x.weekdayName) + '</span>' + (x.holiday ? '<div class="small muted">' + esc(x.holiday) + '</div>' : '') + '</td>' +
        '<td>' + tag(DAY_TONE[x.status] || '', DAY_STATUS[x.status] || x.status) + (x.pendingCorrections ? ' <span class="tag wr">' + x.pendingCorrections + ' correção pendente</span>' : '') + '</td>' +
        '<td>' + esc(x.entry || '—') + '</td><td class="nw">' + esc((x.breaks || []).map((b) => b.start + '–' + b.end).join(', ') || (x.breakStart ? x.breakStart + '–?' : '—')) + '</td><td>' + esc(x.exit || '—') + '</td>' +
        '<td class="n">' + (x.workedMinutes ? hm(x.workedMinutes) : '—') + '</td><td class="n">' + (x.expectedMinutes ? hm(x.expectedMinutes) : '—') + '</td><td class="n">' + (x.creditMinutes ? hm(x.creditMinutes) : '—') + '</td>' +
        '<td class="small">' + esc([...(x.issues || []), ...(x.marks || []).map((m) => (MARK_LABEL[m.kind] || m.kind) + (m.refDate ? ' (ref. ' + dmy(m.refDate) + ')' : '') + (m.minutes ? ' ' + hm(m.minutes) : '') + (m.note ? ' — ' + m.note : '')), ...((x.origins || []).includes('correcao') ? ['batida por correção aprovada'] : [])].join(' · ')) + '</td></tr>').join('') +
      '</tbody></table></div></details>');
  }
  // Benefícios
  if ((r.benefits || []).length) {
    H.push('<h2>Benefícios entregues (não são desconto)</h2><div class="card">' + r.benefits.map((x) => '<div class="kv"><span>' + esc(x.label) + ' · ' + esc(dmy(x.date)) + (x.description ? ' — ' + esc(x.description) : '') + '</span><span>' + brl(x.cents) + '</span></div>').join('') + '</div>');
  }
  // Parâmetros
  if (r.params && Object.keys(r.params).length) {
    H.push('<details style="margin-top:14px"><summary>Parâmetros legais usados neste cálculo</summary><div class="card" style="margin-top:8px">' +
      Object.entries(r.params).map(([k, v]) => '<div class="kv"><span>' + esc(PARAM_LABEL[k] || k) + '</span><span class="small" style="font-weight:600">' + esc(v.source || '') + ' <span class="muted">(desde ' + esc(dmy(v.validFrom)) + ')</span></span></div>').join('') + '</div></details>');
  }
  return H.join('');
}

function renderEntriesMarks() {
  const D = S.d; const own = isOwner(); const H = [];
  H.push('<h2>Lançamentos de ' + esc(compLabel(D.comp)) + ' (' + D.entries.length + ')</h2>');
  if (!D.entries.length) H.push('<div class="card muted small">Nenhum lançamento.</div>');
  else H.push('<div class="tw"><table style="min-width:860px"><thead><tr><th>Data</th><th>Tipo</th><th class="n">Valor</th><th>Descrição</th><th>Referência</th><th>Autorização</th><th>Situação</th><th></th></tr></thead><tbody>' +
    D.entries.map((e) => '<tr><td class="nw">' + esc(dmy(e.date)) + '</td><td>' + esc(ENTRY_LABEL[e.kind] || e.kind) + '</td><td class="n b">' + brl(e.amountCents) + '</td>' +
      '<td class="small">' + esc(e.description || '') + (e.receiptRef ? '<div class="muted">recibo ' + esc(e.receiptRef) + '</div>' : '') + (e.pixRef ? '<div class="muted">PIX ' + esc(e.pixRef) + '</div>' : '') + '</td>' +
      '<td class="nw">' + (e.referenceDate ? esc(dmy(e.referenceDate)) : '—') + '</td>' +
      '<td>' + (NEEDS_AUTH.includes(e.kind) ? (e.authorized ? '<span class="tag okk">autorizado</span>' + (e.authorizationRef ? '<div class="small muted">' + esc(e.authorizationRef) + '</div>' : '') : '<span class="tag bd">sem autorização</span>') : '—') + '</td>' +

  H.push('<h2>Marcações de dia (' + D.marks.length + ')</h2>');
  if (!D.marks.length) H.push('<div class="card muted small">Nenhuma marcação. Folga, atestado, abono e falta só entram no cálculo quando marcados aqui.</div>');
  else H.push('<div class="tw"><table style="min-width:720px"><thead><tr><th>Data</th><th>Tipo</th><th>Compensa</th><th class="n">Minutos</th><th>Observação</th><th>Situação</th><th></th></tr></thead><tbody>' +
    D.marks.map((m) => '<tr><td class="nw">' + esc(dmy(m.date)) + '</td><td>' + esc(MARK_LABEL[m.kind] || m.kind) + '</td><td class="nw">' + (m.refDate ? esc(dmy(m.refDate)) : '—') + '</td><td class="n">' + (m.minutes ? hm(m.minutes) : '—') + '</td>' +
      '<td class="small">' + esc(m.note || '') + '</td><td>' + (m.status === 'RECUSADO' ? '<span class="tag CANCELADO">revogada</span>' : '<span class="tag okk">' + esc((m.status || '').toLowerCase()) + '</span>') + '</td>' +
      '<td>' + (m.status !== 'RECUSADO' && !D.locked ? '<button class="btn sm bad" data-act="revokeMark" data-id="' + esc(m.id) + '">Revogar</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>');
  return H.join('');
}

function paramValue(key, v) {
  if (!v || typeof v !== 'object') return esc(JSON.stringify(v));
  if (key === 'DOMINGO_TRABALHADO' || key === 'FERIADO_TRABALHADO') return v.amountCents ? brl(v.amountCents) + ' por dia' + (v.compensatoryDayOff ? ' + folga compensatória' : '') : '<span class="tag wr">valor não cadastrado</span>';
  if (key === 'SALARIO_MINIMO') return brl(v.cents);
  if (key === 'FGTS') return esc(v.rate) + '% (aprendiz ' + esc(v.apprenticeRate) + '%)';
  if (key === 'HORA_EXTRA' || key === 'ADICIONAL_NOTURNO') return esc(v.pct) + '%';
  if (key === 'VALE_TRANSPORTE') return 'até ' + esc(v.rate) + '%';
  if (key === 'SALARIO_FAMILIA') return 'cota ' + brl(v.quotaCents) + ' · limite ' + brl(v.incomeLimitCents);
  if (key === 'INSS_EMPREGADO' && Array.isArray(v.brackets)) return v.brackets.map((b) => esc(b.rate) + '% até ' + brl(b.upToCents)).join(' · ');
  if (key === 'IRRF_MENSAL' && Array.isArray(v.brackets)) return v.brackets.map((b) => esc(b.rate) + '% ' + (b.upToCents == null ? 'acima' : 'até ' + brl(b.upToCents))).join(' · ');
  if (key === 'IRRF_REDUTOR') return 'zera o IR até ' + brl(v.fullExemptUpToCents) + ' (redução máx. ' + brl(v.maxReductionCents) + ') · redução decrescente até ' + brl(v.phaseOutUpToCents);
  return '<code class="small" style="word-break:break-all">' + esc(JSON.stringify(v)) + '</code>';
}

        '<td class="small" style="min-width:240px">' + esc(p.source) + (p.documentRef ? '<div class="muted">doc: ' + esc(p.documentRef) + '</div>' : '') + (p.notes ? '<div class="muted">' + esc(p.notes) + '</div>' : '') + '</td>' +
        '<td class="small">' + esc([p.storeId ? storeName(p.storeId) : '', p.issuerId ? issuerName(p.issuerId) : '', p.locality || '', p.unionName || '', p.category || ''].filter(Boolean).join(' · ') || 'Geral') + '</td>' +

    '<div class="fld"><label for="h_scope">Abrangência</label><select id="h_scope">' + opt('MUNICIPAL', 'Municipal', 'MUNICIPAL') + opt('ESTADUAL', 'Estadual', '') + opt('NACIONAL', 'Nacional', '') + '</select></div>' +
    '<div class="fld"><label for="h_loc">Localidade</label><input id="h_loc" placeholder="João Pessoa/PB"></div>' +
    '<div class="fld full"><label for="h_src">Fonte (lei/decreto/convenção) *</label><input id="h_src"></div></div>' +
    '<div class="note bad" id="h_err" style="display:none"></div>' +
    '<div class="acts"><button class="btn ghost" onclick="closeModal()">Voltar</button><button class="btn" id="h_ok">Cadastrar</button></div>');
  md.querySelector('#h_ok').onclick = async (ev) => {
    const g = (id) => md.querySelector('#' + id).value.trim();
    const body = { date: g('h_date'), name: g('h_name'), scope: g('h_scope'), locality: g('h_loc') || null, source: g('h_src') };
    if (!body.date || !body.name || !body.source) { const e = md.querySelector('#h_err'); e.style.display = 'block'; e.textContent = 'Informe data, nome e fonte.'; return; }
    md.querySelector('#h_err').style.display = 'none';
    if (!confirmStep(md, ev.target, 'Cadastrar <b>' + esc(body.name) + '</b> em ' + esc(dmy(body.date)) + ' (' + esc(body.scope.toLowerCase()) + ').')) return;
    const r = await run(ev.target, () => post('/admin/holidays', body), 'Feriado cadastrado');
    if (r) { closeModal(); S.holYear = body.date.slice(0, 4); go('feriados'); }
  };
};
ACT.offHoliday = async (d, b) => {
  const h = S.holidays.find((x) => x.id === d.id);
  const v = await ask({ title: 'Desativar feriado', danger: true, ok: 'Desativar', html: '<p>' + esc(h.name) + ' — ' + esc(dmy(h.date)) + '</p>', fields: [{ name: 'reason', label: 'Motivo', type: 'textarea', required: true }] });
  if (!v) return;
  const r = await run(b, () => post('/admin/holidays/' + encodeURIComponent(d.id) + '/deactivate', { reason: v.reason }), 'Feriado desativado');
  if (r) go('feriados');
};

// ─────────────────────────── REGRAS DE COMISSÃO ───────────────────────────
function ruleSummary(cfg) {
  const tiers = [...(cfg.tiers || [])].sort((a, b) => a.aboveCents - b.aboveCents);
  return tiers.map((t) => (t.aboveCents ? 'acima de ' + brl(t.aboveCents) : 'desde R$ 0') + ' → <b>' + esc(t.pct) + '%</b>').join(' · ') +
    ' <span class="tag">' + ((cfg.tierMode || 'ALL') === 'MARGINAL' ? 'por faixa (marginal)' : 'alíquota sobre o total') + '</span>';
}
async function viewComissao() {
  const d = await req('/admin/commission-rules');
  S.rules = d.rules || [];
  const today = todayKey();
  const H = ['<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div class="small muted">Nova versão encerra a anterior na véspera; nada é reescrito. Contracheques fechados guardam a regra usada.</div>' + (isOwner() ? '<button class="btn" data-act="newRule">+ Nova regra</button>' : '') + '</div>'];
  if (!S.rules.length) H.push('<div class="card empty">Nenhuma regra cadastrada.</div>');
  for (const r of S.rules) {
    const cfg = r.config || {};
    const live = r.active !== false && r.validFrom <= today && (!r.validTo || r.validTo >= today);
    H.push('<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>' + esc(r.name) + '</b><div class="small muted">versão ' + esc(r.version) + ' · ' + esc(dmy(r.validFrom)) + ' → ' + (r.validTo ? esc(dmy(r.validTo)) : 'em aberto') +
      ' · ' + esc([r.userId ? 'só ' + userName(r.userId) : '', r.storeId ? 'loja ' + storeName(r.storeId) : '', r.issuerId ? issuerName(r.issuerId) : ''].filter(Boolean).join(' · ') || 'todos os vendedores') + '</div></div>' +
      (live ? '<span class="tag okk">vigente</span>' : r.validFrom > today ? '<span class="tag wr">futura</span>' : '<span class="tag off">encerrada</span>') + '</div>' +
      '<div style="margin-top:8px">' + ruleSummary(cfg) + '</div>' +
      (cfg.special || []).map((s) => '<div class="small" style="margin-top:4px">Especial <b>' + esc(s.name) + '</b>: ' + esc(s.pct) + '% quando passar de ' + brl(s.aboveCents) + (s.match && s.match.brands && s.match.brands.length ? ' · marcas: ' + esc(s.match.brands.join(', ')) : '') + (s.match && s.match.categories && s.match.categories.length ? ' · categorias: ' + esc(s.match.categories.join(', ')) : '') + '</div>').join('') +
      (r.notes ? '<div class="small muted" style="margin-top:6px">' + esc(r.notes) + '</div>' : '') +
      '<details><summary>Configuração (JSON)</summary><pre>' + esc(JSON.stringify(cfg, null, 2)) + '</pre></details>' +
      (isOwner() ? '<div class="btns" style="margin-top:8px"><button class="btn sm line" data-act="newRule" data-from="' + esc(r.id) + '">Nova versão desta regra</button></div>' : '') + '</div>');
  }
  document.getElementById('view').innerHTML = H.join('');
}
ACT.newRule = (d) => {
  const prev = d.from ? S.rules.find((x) => x.id === d.from) : null;
  const cfg0 = prev ? JSON.parse(JSON.stringify(prev.config || {})) : { tierMode: 'ALL', tiers: [{ aboveCents: 0, pct: 1 }], special: [],
    confirmedStatuses: ['completed'], pendingStatuses: ['pending', 'pending_payment'], canceledStatuses: ['canceled', 'cancelled'], returns: 'EXCLUI_DEVOLVIDO', closingDay: 'ULTIMO_DIA' };
  const st = { tiers: (cfg0.tiers || []).map((t) => ({ above: money(t.aboveCents), pct: String(t.pct) })), special: (cfg0.special || []).map((s) => ({ name: s.name, above: money(s.aboveCents), pct: String(s.pct),
    brands: ((s.match || {}).brands || []).join(', '), categories: ((s.match || {}).categories || []).join(', '), nameIncludes: ((s.match || {}).nameIncludes || []).join(', ') })) };
  const nextMonth = (() => { const [y, m] = todayKey().split('-').map(Number); return m === 12 ? (y + 1) + '-01-01' : y + '-' + String(m + 1).padStart(2, '0') + '-01'; })();
  const md = modal('<h3>' + (prev ? 'Nova versão — ' + esc(prev.name) : 'Nova regra de comissão') + '</h3>' +
    (prev ? '<div class="note info">A versão ' + esc(prev.version) + ' será encerrada na véspera do início desta.</div>' : '') +
    '<div class="fgrid"><div class="fld full"><label for="r_name">Nome *</label><input id="r_name" value="' + esc(prev ? prev.name : '') + '"></div>' +
    '<div class="fld"><label for="r_from">Vigente a partir de *</label><input type="date" id="r_from" value="' + esc(nextMonth) + '"></div>' +
    '<div class="fld"><label for="r_to">Até (opcional)</label><input type="date" id="r_to"></div>' +
    '<div class="fld"><label for="r_store">Só para a loja</label><select id="r_store">' + opt('', 'Todas', prev ? prev.storeId || '' : '') + Object.values(S.stores).map((s) => opt(s.id, s.code + ' · ' + s.name, prev ? prev.storeId || '' : '')).join('') + '</select></div>' +
    '<div class="fld"><label for="r_user">Só para o vendedor</label><select id="r_user">' + opt('', 'Todos', prev ? prev.userId || '' : '') + Object.entries(S.names).map(([id, n]) => opt(id, n, prev ? prev.userId || '' : '')).join('') + '</select></div>' +
    '<div class="fld full"><label for="r_mode">Como as faixas se aplicam</label><select id="r_mode">' + opt('ALL', 'Alíquota da faixa atingida sobre TODAS as vendas', cfg0.tierMode || 'ALL') + opt('MARGINAL', 'Cada faixa só sobre o que passou dela (marginal)', cfg0.tierMode || 'ALL') + '</select></div></div>' +
    '<h2>Faixas</h2><div id="r_tiers"></div><button class="btn sm ghost" data-act="ruleAddTier">+ Faixa</button>' +
    '<h2>Regras especiais (por marca/categoria)</h2><div id="r_specials"></div><button class="btn sm ghost" data-act="ruleAddSpecial">+ Regra especial</button>' +
    '<div class="fld"><label for="r_notes">Observações</label><textarea id="r_notes">' + esc(prev ? prev.notes || '' : '') + '</textarea></div>' +
    '<details open><summary>JSON que será gravado</summary><pre id="r_json"></pre></details>' +
    '<div class="note bad" id="r_err" style="display:none"></div>' +
    '<div class="acts"><button class="btn ghost" onclick="closeModal()">Voltar</button><button class="btn" id="r_ok">Salvar regra</button></div>', { wide: true });
  S.ruleEd = { st, cfg0, md, prev };
  drawRuleEditor();
  md.addEventListener('input', () => { readRuleEditor(); updRuleJson(); });
  md.addEventListener('change', () => { readRuleEditor(); updRuleJson(); });
  md.querySelector('#r_ok').onclick = async (ev) => {
    readRuleEditor();
    const err = md.querySelector('#r_err'); const fail = (m) => { err.style.display = 'block'; err.textContent = m; };
    const built = buildRuleConfig(); if (built.error) return fail(built.error);
    const body = { name: md.querySelector('#r_name').value.trim(), validFrom: md.querySelector('#r_from').value, validTo: md.querySelector('#r_to').value || undefined,
      storeId: md.querySelector('#r_store').value || undefined, userId: md.querySelector('#r_user').value || undefined, previousId: prev ? prev.id : undefined,
      notes: md.querySelector('#r_notes').value.trim() || undefined, config: built.config };
    if (!body.name) return fail('Informe o nome.');
    if (!body.validFrom) return fail('Informe o início da vigência.');
    err.style.display = 'none';
    if (!confirmStep(md, ev.target, '<b>' + esc(body.name) + '</b> vigente a partir de ' + esc(dmy(body.validFrom)) + '<div style="margin-top:4px">' + ruleSummary(body.config) + '</div>' + (prev ? '<div class="small">A versão ' + esc(prev.version) + ' termina em ' + esc(dmy(new Date(Date.parse(body.validFrom + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10))) + '.</div>' : ''))) return;
    const r = await run(ev.target, () => post('/admin/commission-rules', body), 'Regra salva');
    if (r) { closeModal(); go('comissao'); }
  };
};
function drawRuleEditor() {
  const { st, md } = S.ruleEd;
  md.querySelector('#r_tiers').innerHTML = st.tiers.map((t, i) => '<div class="ed-row"><div><label>Acima de (R$)</label><input data-t="' + i + '" data-f="above" inputmode="decimal" value="' + esc(t.above) + '"' + (i === 0 ? ' title="A primeira faixa começa em R$ 0"' : '') + '></div>' +
    '<div><label>Percentual (%)</label><input data-t="' + i + '" data-f="pct" inputmode="decimal" value="' + esc(t.pct) + '"></div><button class="btn sm bad" data-act="ruleDelTier" data-i="' + i + '"' + (st.tiers.length < 2 ? ' disabled' : '') + '>Remover</button></div>').join('');
  md.querySelector('#r_specials').innerHTML = st.special.length ? st.special.map((s, i) => '<div class="sp-card"><div class="fgrid">' +
    '<div class="fld full"><label>Nome</label><input data-s="' + i + '" data-f="name" value="' + esc(s.name) + '"></div>' +
    '<div class="fld"><label>Quando passar de (R$)</label><input data-s="' + i + '" data-f="above" inputmode="decimal" value="' + esc(s.above) + '"></div>' +
    '<div class="fld"><label>Percentual (%)</label><input data-s="' + i + '" data-f="pct" inputmode="decimal" value="' + esc(s.pct) + '"></div>' +
    '<div class="fld"><label>Marcas (separe por vírgula)</label><input data-s="' + i + '" data-f="brands" value="' + esc(s.brands) + '"></div>' +
    '<div class="fld"><label>Categorias (separe por vírgula)</label><input data-s="' + i + '" data-f="categories" value="' + esc(s.categories) + '"></div>' +
    '<div class="fld full"><label>Nome do produto contém (opcional)</label><input data-s="' + i + '" data-f="nameIncludes" value="' + esc(s.nameIncludes) + '"></div></div>' +
    '<button class="btn sm bad" data-act="ruleDelSpecial" data-i="' + i + '" style="margin-top:8px">Remover regra especial</button></div>').join('') : '<div class="small muted">Nenhuma.</div>';
  updRuleJson();
}
function readRuleEditor() {
  const { st, md } = S.ruleEd;
  md.querySelectorAll('[data-t]').forEach((el) => { st.tiers[+el.dataset.t][el.dataset.f] = el.value; });
  md.querySelectorAll('[data-s]').forEach((el) => { st.special[+el.dataset.s][el.dataset.f] = el.value; });
}
function buildRuleConfig() {
  const { st, cfg0, md } = S.ruleEd;
  const list = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
  const pctOf = (s) => Number(String(s).replace(',', '.'));
  const tiers = st.tiers.map((t, i) => ({ aboveCents: i === 0 && !String(t.above).trim() ? 0 : toCents(t.above), pct: pctOf(t.pct) }));
  if (!tiers.length) return { error: 'Informe ao menos uma faixa.' };
  if (tiers.some((t) => !Number.isFinite(t.aboveCents) || t.aboveCents < 0 || !Number.isFinite(t.pct) || t.pct < 0 || t.pct > 100)) return { error: 'Faixa com valor ou percentual inválido.' };
  tiers.sort((a, b) => a.aboveCents - b.aboveCents);
  if (tiers[0].aboveCents !== 0) return { error: 'A primeira faixa precisa começar em R$ 0.' };
  if (new Set(tiers.map((t) => t.aboveCents)).size !== tiers.length) return { error: 'Duas faixas com o mesmo valor inicial.' };
  const special = [];
  for (const s of st.special) {
    const sp = { name: String(s.name || '').trim(), aboveCents: toCents(s.above) || 0, pct: pctOf(s.pct), match: {} };
    if (!sp.name) return { error: 'Regra especial sem nome.' };
    if (!Number.isFinite(sp.pct) || sp.pct < 0 || sp.pct > 100 || !Number.isFinite(sp.aboveCents)) return { error: 'Regra especial "' + sp.name + '" com valor inválido.' };
    if (list(s.brands).length) sp.match.brands = list(s.brands);
    if (list(s.categories).length) sp.match.categories = list(s.categories);
    if (list(s.nameIncludes).length) sp.match.nameIncludes = list(s.nameIncludes);
    if (!Object.keys(sp.match).length) return { error: 'Regra especial "' + sp.name + '" precisa de marca, categoria ou nome.' };
    special.push(sp);
  }
  return { config: { ...cfg0, tierMode: md.querySelector('#r_mode').value, tiers, special } };
}
function updRuleJson() { const b = buildRuleConfig(); S.ruleEd.md.querySelector('#r_json').textContent = b.error ? '⚠ ' + b.error : JSON.stringify(b.config, null, 2); }
ACT.ruleAddTier = () => { readRuleEditor(); const t = S.ruleEd.st.tiers; t.push({ above: '', pct: '' }); drawRuleEditor(); };
ACT.ruleDelTier = (d) => { readRuleEditor(); S.ruleEd.st.tiers.splice(+d.i, 1); drawRuleEditor(); };
ACT.ruleAddSpecial = () => { readRuleEditor(); S.ruleEd.st.special.push({ name: '', above: '', pct: '', brands: '', categories: '', nameIncludes: '' }); drawRuleEditor(); };
ACT.ruleDelSpecial = (d) => { readRuleEditor(); S.ruleEd.st.special.splice(+d.i, 1); drawRuleEditor(); };

// ─────────────────────────── AUDITORIA ───────────────────────────
S.auditUser = '';
const AUDIT_ACTION = { CREATE: 'Criou', UPDATE: 'Alterou', VIEW: 'Visualizou', VIEW_ADMIN: 'Visualizou (adm.)', REVIEW_CREATE: 'Gerou conferência', REVIEW_UPDATE: 'Revisou',
  APPROVE: 'Aprovou', CLOSE: 'Fechou', PAY: 'Registrou pagamento', REOPEN: 'Reabriu', CANCEL: 'Cancelou', SUPERSEDED: 'Substituído por correção', REVOKE: 'Revogou',
  DEACTIVATE: 'Desativou', REJECT: 'Recusou', REQUEST: 'Pediu', RESPOND: 'Respondeu', ACKNOWLEDGE: 'Deu ciência', EXPORT_PDF: 'Baixou PDF', EXPORT_CSV: 'Exportou CSV',
  EXPORT_JSON: 'Exportou JSON', DOWNLOAD_SIGNED_LINK: 'Abriu link do WhatsApp', NOTIFY: 'Avisou' };
async function viewAuditoria() {
  if (!isOwner()) { document.getElementById('view').innerHTML = '<div class="card empty">Auditoria é só do dono.</div>'; return; }
  const d = await req('/admin/audit' + (S.auditUser ? '?userId=' + encodeURIComponent(S.auditUser) : ''));
  const rows = d.logs || [];
  const H = ['<div class="card" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div style="min-width:240px"><label for="aUser">Funcionário</label><select id="aUser">' + opt('', 'Todos', S.auditUser) + Object.entries(S.names).map(([id, n]) => opt(id, n, S.auditUser)).join('') + '</select></div><div class="small muted">Últimos 300 registros. Toda alteração, visualização e exportação fica registrada.</div></div>'];
  if (!rows.length) H.push('<div class="card empty">Sem registros.</div>');
  else H.push('<div class="tw"><table style="min-width:1000px"><thead><tr><th>Quando</th><th>Ação</th><th>O quê</th><th>Funcionário</th><th>Quem fez</th><th>Motivo</th><th>Detalhes</th></tr></thead><tbody>' +
    rows.map((l) => '<tr><td class="nw small">' + esc(dt(l.at)) + '</td><td class="b">' + esc(AUDIT_ACTION[l.action] || l.action) + '</td><td class="small">' + esc(l.entity) + '<div class="muted">' + esc(String(l.entityId).slice(0, 40)) + '</div></td>' +
      '<td>' + esc(l.subjectUserId ? userName(l.subjectUserId) : '—') + '</td><td class="small">' + esc(l.actorId ? userName(l.actorId) : 'sistema') + (l.actorRole ? '<div class="muted">' + esc(l.actorRole) + '</div>' : '') + (l.ip ? '<div class="muted">' + esc(l.ip) + '</div>' : '') + '</td>' +
      '<td class="small">' + esc(l.reason || '') + '</td><td>' + (l.before || l.after ? '<details><summary>ver</summary><pre>' + esc(JSON.stringify({ antes: l.before, depois: l.after }, null, 2).slice(0, 6000)) + '</pre></details>' : '') + '</td></tr>').join('') + '</tbody></table></div>');
  const v = document.getElementById('view'); v.innerHTML = H.join('');
  v.querySelector('#aUser').addEventListener('change', (e) => { S.auditUser = e.target.value; go('auditoria'); });
}

boot();
</script>
