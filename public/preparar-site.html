<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparar pro site — % bipado</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--text:#e8eaed;--mut:#9aa0aa;--ok:#22c55e;--no:#f59e0b;--ac:#3b82f6;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:#0f1115ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 14px}
  h1{font-size:16px;margin:0 0 8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mut)}
  .pill b{color:var(--text)}
  input[type=range]{width:180px;vertical-align:middle}
  input[type=number]{width:64px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px}
  button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
  button.go{background:var(--ok)} button:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
  th{color:var(--mut);font-weight:600;position:sticky;top:64px;background:#12151c}
  .thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;background:#0b0d11}
  .barwrap{width:120px;background:#0b0d11;border-radius:6px;height:16px;overflow:hidden;display:inline-block;vertical-align:middle}
  .barfill{height:100%;background:var(--ok)}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
  .y{background:#14532d;color:#86efac}.n{background:#3a1414;color:#fca5a5}.w{background:#3a2a0a;color:#fcd34d}.b{background:#0c2a4d;color:#93c5fd}
  a{color:var(--ac);text-decoration:none}
  .miss{color:var(--no);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🎯 Preparar pro site — priorizar por % localizado (bipado ÷ comprado)</h1>
  <div class="row">
    <span class="pill">Mínimo <b id="kMin">50</b>%</span>
    <input type="range" id="rng" min="0" max="100" value="50" step="5" oninput="kMin.textContent=this.value;num.value=this.value">
    <input type="number" id="num" min="0" max="100" value="50" oninput="rng.value=this.value;kMin.textContent=this.value">
    <button onclick="load()">Buscar</button>
    <span class="pill">Presets:</span>
    <button class="ghost" onclick="setP(100,1000)">= 100%</button>
    <button class="ghost" onclick="setP(80,100)">80–100%</button>
    <button class="ghost" onclick="setP(50,100)">50–100%</button>
    <button class="ghost" onclick="setP(101,1000)">⚠ erro &gt;100%</button>
    <span style="flex:1"></span>
    <span class="pill">Achados: <b id="kTot">—</b></span>
  </div>
</header>

<table>
  <thead><tr><th></th><th>Produto</th><th>Comprado</th><th>Localizado</th><th>%</th><th>Status</th><th>Falta / Ação</th></tr></thead>
  <tbody id="tb"><tr><td colspan="7" style="padding:16px;color:var(--mut)">escolha a % e clique Buscar</td></tr></tbody>
</table>

<script>
const $=id=>document.getElementById(id);
let maxPct=1000;
function token(){ let t=localStorage.getItem('tc_admin_token'); if(!t){ t=prompt('Token admin:')||''; if(t) localStorage.setItem('tc_admin_token',t);} return t; }
function api(p){ return fetch('/api/admin/catalog-engine'+p,{headers:{'Authorization':'Bearer '+token()}}); }
function esc(s){ return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function setP(min,max){ maxPct=max; $('num').value=min; $('rng').value=Math.min(100,min); $('kMin').textContent=min; load(); }

async function load(){
  const minPct=$('num').value||0;
  $('tb').innerHTML='<tr><td colspan="7" style="padding:16px;color:var(--mut)">carregando…</td></tr>';
  try{
    const r=await api(`/prioritize?minPct=${minPct}&maxPct=${maxPct}&limit=400`);
    if(r.status===401){ $('tb').innerHTML='<tr><td colspan="7" style="padding:16px">token inválido. <a href="javascript:localStorage.removeItem(\'tc_admin_token\');location.reload()">trocar</a></td></tr>'; return; }
    const d=await r.json();
    $('kTot').textContent=d.total;
    maxPct=1000; // reset depois de usar preset
    if(!d.rows.length){ $('tb').innerHTML='<tr><td colspan="7" style="padding:16px;color:var(--mut)">nada nessa faixa.</td></tr>'; return; }
    $('tb').innerHTML=d.rows.map(row).join('');
  }catch(e){ $('tb').innerHTML='<tr><td colspan="7" style="padding:16px">erro: '+e.message+'</td></tr>'; }
}

function row(r){
  const pct=r.pct||0;
  const over=pct>100;
  const img=r.image?`<img class="thumb" src="${esc(r.image)}" loading="lazy">`:'<div class="thumb"></div>';
  const tags=[];
  tags.push(r.classificado?'<span class="tag y">classif ✓</span>':'<span class="tag n">classif ✗</span>');
  if(!r.tem_imagem) tags.push('<span class="tag n">sem foto</span>');
  else if(['pessima','quebrada','desconhecida'].includes(r.img_flag)) tags.push('<span class="tag w">foto ruim</span>');
  else tags.push('<span class="tag y">foto ok</span>');
  if(r.publicado) tags.push('<span class="tag b">no ar</span>');

  let acao='';
  if(over) acao='<span class="miss">⚠ bipado &gt; comprado — erro de contagem</span>';
  else if(r.publicado) acao='<span class="tag b">publicado ✓</span>';
  else if(!r.classificado) acao=`<a href="/catalog-classify.html" target="_blank">classificar →</a>`;
  else if(!r.tem_imagem || ['pessima','quebrada'].includes(r.img_flag)) acao='<span class="miss">arrumar foto</span>';
  else if(pct>=80) acao=`<button class="go" onclick="pub('${r.id}',this)">Publicar</button>`;
  else acao=`<span class="muted">bipar mais (${pct}%)</span>`;

  return `<tr>
    <td>${img}</td>
    <td><b>${esc((r.name||'').slice(0,46))}</b><br><span style="color:var(--mut);font-size:11px">${esc(r.brand||'')}</span></td>
    <td>${r.comprado}</td><td>${r.localizado}</td>
    <td><span class="barwrap"><span class="barfill" style="width:${Math.min(100,pct)}%;${over?'background:var(--bad)':''}"></span></span> ${pct}%</td>
    <td>${tags.join(' ')}</td>
    <td>${acao}</td>
  </tr>`;
}

async function pub(id,btn){
  btn.disabled=true; btn.textContent='publicando…';
  try{
    const r=await fetch('/api/admin/catalog-engine/publish/'+id,{method:'POST',headers:{'Authorization':'Bearer '+token()}});
    const d=await r.json();
    btn.outerHTML = d.ok ? '<span class="tag b">no ar ✓</span>' : '<span class="miss">'+esc((d.error||(d.result&&d.result.reason)||'falhou'))+'</span>';
  }catch(e){ btn.disabled=false; btn.textContent='Publicar'; alert('erro: '+e.message); }
}
</script>
</body>
</html>
