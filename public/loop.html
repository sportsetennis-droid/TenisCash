<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loop de Marketing · Sports & Tennis</title>
<style>
  :root{ --bg:#0a1a10; --bg2:#06120b; --card:#0f2417; --line:#1c3a26; --ink:#eef3ec; --mut:#8fae98;
         --orange:#E0531E; --yellow:#ffd400; --green:#16a34a; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        background:radial-gradient(900px 500px at 30% -10%, #103a22 0%, var(--bg) 55%, var(--bg2) 100%);
        color:var(--ink); min-height:100vh; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
  .wrap{ max-width:680px; margin:0 auto; padding:20px 0 70px; }
  h1{ font-size:24px; font-weight:800; letter-spacing:-.5px; }
  h1 .tag{ color:var(--orange); }
  .sub{ color:var(--mut); margin-top:5px; font-size:13px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0; }
  .btn{ padding:11px 16px; border:0; border-radius:10px; background:var(--orange); color:#fff; font-weight:700; font-size:14px; min-height:46px; cursor:pointer; }
  .btn.ghost{ background:#14271a; border:1px solid var(--line); color:var(--ink); }
  .learn{ background:#10241a; border:1px solid var(--line); border-left:3px solid var(--yellow); border-radius:12px; padding:13px 15px; font-size:13px; line-height:1.5; white-space:pre-wrap; margin:8px 0 4px; }
  .acct{ margin:18px 0 8px; font-weight:800; font-size:15px; color:var(--yellow); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px; margin-bottom:10px; }
  .card.tema{ border-left:3px solid var(--orange); }
  .k{ font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .g{ font-size:16px; font-weight:700; margin:6px 0; line-height:1.3; }
  .s{ font-size:13px; color:var(--mut); line-height:1.4; margin-top:3px; }
  .s b{ color:var(--ink); }
  .meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .chip{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; background:#14271a; border:1px solid var(--line); color:var(--mut); }
  .chip.voz{ color:#ffd9a8; } .chip.fmt{ color:#9fd0ff; } .chip.hr{ color:#bdf5c8; }
  .v{ font-size:12px; color:#cfeede; margin-top:8px; line-height:1.4; }
  .w{ font-size:12px; color:#9fd0ff; margin-top:8px; border-top:1px dashed var(--line); padding-top:7px; line-height:1.4; }
  .f{ font-size:11px; color:#ffd9a8; margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; line-height:1.35; }
  .info{ color:var(--mut); font-size:13px; padding:20px 4px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔁 Loop de <span class="tag">Marketing</span></h1>
  <div class="sub" id="sub">Carregando…</div>
  <div class="row">
    <button class="btn" id="btnRefresh" onclick="load()">↻ Atualizar</button>
  </div>
  <div class="learn" id="learn">…</div>
  <div id="out"><div class="info">carregando a pauta do cérebro…</div></div>
</div>

<script>
const VIEW='/api/_loopview?g=stloop2026';
const $=(s)=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

async function load(){
  try{
    const r=await (await fetch(VIEW)).json();
    if(!r.ok){ $('#out').innerHTML='<div class="info">erro: '+esc(r.error||'falhou')+'</div>'; return; }
    render(r);
  }catch(e){ $('#out').innerHTML='<div class="info">erro de conexão: '+esc(e.message)+'</div>'; }
}

function render(r){
  const s=r.slate;
  const when=r.lastBrainAt?(' · última pauta '+String(r.lastBrainAt).slice(0,16).replace('T',' ')):'';
  $('#sub').textContent='Cérebro '+(r.brain||'')+when+' · decide o que postar lendo o estoque real e aprende com a performance.';
  $('#learn').textContent = r.learnings ? ('🧠 O que o loop aprendeu:\n'+r.learnings) : '🧠 Ainda sem aprendizado — o loop começa a aprender quando entrarem os números de performance dos posts.';
  const itens=(s&&s.itens)||[];
  if(!itens.length){ $('#out').innerHTML='<div class="info">Sem pauta ainda. Toque em <b>⚡ Rodar cérebro</b> (leva ~1 min) que ele monta os posts de hoje.</div>'; return; }
  const byAcct={}; itens.forEach(it=>{ (byAcct[it.conta]=byAcct[it.conta]||[]).push(it); });
  let html='';
  Object.keys(byAcct).forEach(acct=>{
    html+='<div class="acct">'+esc(acct)+'</div>';
    html+=byAcct[acct].map(it=>`
      <div class="card ${it.tipo==='tema'?'tema':''}">
        <div class="k">${it.tipo==='tema'?'🎯 tema':'👟 '+esc(it.produto||'')}${it.preco?(' · '+esc(it.preco)):''}</div>
        <div class="g">"${esc(it.gancho)}"</div>
        ${it.pra_quem?`<div class="s"><b>Pra quem:</b> ${esc(it.pra_quem)}</div>`:''}
        ${it.resolve?`<div class="s"><b>Resolve:</b> ${esc(it.resolve)}</div>`:''}
        <div class="meta">
          ${it.voz?`<span class="chip voz">🎙️ ${esc(it.voz)}</span>`:''}
          ${it.formato?`<span class="chip fmt">📐 ${esc(it.formato)}</span>`:''}
          ${it.horario?`<span class="chip hr">⏰ ${esc(it.horario)}</span>`:''}
        </div>
        ${it.skin?`<div class="v">🎨 ${esc(it.skin)}</div>`:''}
        ${it.porque?`<div class="w">💡 ${esc(it.porque)}</div>`:''}
        ${(it.fato_a_verificar||[]).length?'<div class="f">⚠ checar: '+esc((it.fato_a_verificar||[]).join('; '))+'</div>':''}
      </div>`).join('');
  });
  $('#out').innerHTML=html;
}

load();
</script>
</body>
</html>
