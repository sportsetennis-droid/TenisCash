<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clube · Club Sports &amp; Tennis</title>
<meta name="description" content="Página do clube no Club Sports &amp; Tennis: elenco, conquistas, próximos jogos e treinos.">
<meta name="theme-color" content="#EA5128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/brand/club.webmanifest">
<link rel="icon" href="/brand/sports-tennis-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/sports-tennis-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--o1:#EA5128;--ink:#2a1206;--mut:#74412c;--dim:#8f6552;--line:rgba(70,22,0,.1);--card:#fff;--bg:#FFF4EE;--c1:#EA5128;--c2:#FFFFFF;
  --ok:#0B7A4B;--bad:#B3261E;--r:20px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ff:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(24px + var(--sab))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.hero{position:relative;color:#fff;background:linear-gradient(160deg,var(--c1),color-mix(in srgb,var(--c1) 70%,#000));padding:calc(18px + var(--sat)) 0 26px;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c2);opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top a{font-size:13px;font-weight:700;opacity:.9;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.idn{display:flex;gap:16px;align-items:center}
.crest{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-weight:900;font-size:30px;flex-shrink:0;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:cover}
.idn h1{font-size:26px;line-height:1.1;font-weight:900;font-stretch:88%;letter-spacing:-.2px}
.idn .sub{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.desc{margin-top:12px;font-size:14px;opacity:.95;white-space:pre-line}
.sec{margin-top:22px}
.sec h2{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 10px 26px -18px rgba(90,30,0,.45);border:1px solid var(--line)}
.list>*{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.list>*:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden;font-size:15px}
.av img{width:100%;height:100%;object-fit:cover}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;font-size:12.5px;color:var(--dim)}
.tx span.pill{display:inline-block;font-size:11px;color:#C93E19}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:rgba(234,81,40,.12);color:#C93E19;white-space:nowrap}
.pill.g{background:rgba(11,122,75,.12);color:var(--ok)}
.lvl{text-align:right;flex-shrink:0}
.lvl b{display:block;font-size:20px;font-weight:900;line-height:1}
.lvl span{font-size:10.5px;color:var(--dim)}
.game{padding:14px}
.game .meta{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.game .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:8px;font-weight:800}
.game .vs .h{text-align:right}
.game .vs i{font-style:normal;color:var(--dim);font-weight:700;font-size:12px}
.me{color:#C93E19}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:14px}
.btn{min-height:46px;border-radius:14px;padding:0 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.p{background:var(--o1);color:#fff}
.btn.s{background:rgba(234,81,40,.1);color:#C93E19}
.btn.w{width:100%}
.btn:disabled{opacity:.55}
.inv{padding:16px;display:grid;gap:10px}
.inv b{font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medal{display:flex;gap:12px;align-items:center}
.md{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex-shrink:0;font-size:13px}
.md.GOLD{background:linear-gradient(135deg,#E8B73A,#B98512)}.md.SILVER{background:linear-gradient(135deg,#C9CED6,#8D96A3)}.md.BRONZE{background:linear-gradient(135deg,#D38C55,#9B5A2B)}.md.FINISHER,.md.SPECIAL{background:linear-gradient(135deg,#EA5128,#9B2F10)}
.sk{background:linear-gradient(90deg,#f5e2d8,#fbeee7,#f5e2d8);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;transition:transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{transform:translateX(-50%) translateY(0)}
/* bottom-sheet */
.scrim{position:fixed;inset:0;background:rgba(30,10,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .25s;z-index:50;padding:10px 16px calc(20px + var(--sab));max-width:480px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#e3cfc4;margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:12px}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:800;color:var(--mut);margin-bottom:12px}
.f input,.f select,.f textarea{border:1.5px solid #ecd6ca;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:500;color:var(--ink);background:#fff;min-height:46px;width:100%}
.f textarea{min-height:84px;resize:vertical}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors input{padding:4px;height:46px}
.sports{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sports label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid #ecd6ca;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;min-height:40px}
.sports input{width:18px;height:18px;accent-color:var(--o1)}
.mrow{display:flex;gap:8px;align-items:center}
.mrow select{border:1.5px solid #ecd6ca;border-radius:10px;padding:8px;min-height:40px;background:#fff}
.x{min-width:40px;min-height:40px;border-radius:10px;color:var(--bad);font-weight:900}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:3px;text-align:center;padding:10px;border:1.5px dashed #ecd6ca;border-radius:12px}
.fine{font-size:12px;color:var(--dim);margin-top:8px}
@media (min-width:900px){body{padding-top:24px}.page{max-width:480px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(90,30,0,.5);background:var(--bg);min-height:calc(100vh - 48px)}}
</style>
</head>
<body>
<div class="page">
  <div id="app"><div class="hero"><div class="wrap"><div class="sk" style="height:84px;opacity:.35"></div></div></div><div class="wrap"><div class="sk" style="height:160px;margin-top:22px"></div></div></div>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div class="grab"></div><div id="sheetBody"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var SLUG=(location.pathname.split('/')[2]||'').toLowerCase();
var QS=new URLSearchParams(location.search);
var CODE=(QS.get('convite')||'').toUpperCase();
var SPORT={TENNIS:'Tênis',BEACH_TENNIS:'Beach Tennis',PADEL:'Padel',FUTSAL:'Futsal',SOCCER:'Futebol',VOLLEY:'Vôlei',BASKETBALL:'Basquete',HANDBALL:'Handebol',TABLE_TENNIS:'Tênis de mesa',RUNNING:'Corrida',OTHER:'Outros'};
var FMT={SINGLES:'Simples',DOUBLES:'Duplas',TEAM:'Time'};
var ROLE={owner:'Dono',coach:'Técnico',athlete:'Atleta',admin:'Admin'};
var TIER={GOLD:'Ouro',SILVER:'Prata',BRONZE:'Bronze',FINISHER:'Finisher',SPECIAL:'Especial'};
var D=null,app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function token(){try{return localStorage.getItem('tc_token')||'';}catch(e){return '';}}
function ini(n){return String(n||'?').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function safeImg(u){u=String(u||'');return /^https:\/\//i.test(u)||/^data:image\/(png|jpeg|webp);base64,/.test(u)?u:'';}
function color(c,d){return /^#[0-9A-Fa-f]{6}$/.test(String(c||''))?c:d;}
function when(d){if(!d)return 'Data a definir';try{return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Fortaleza',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d));}catch(e){return '';}}
function api(path,o){
  o=o||{};var h={Accept:'application/json'},t=token();
  if(t)h.Authorization='Bearer '+t;
  if(o.body!==undefined)h['Content-Type']='application/json';
  return fetch('/api'+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined,cache:'no-store'})
    .then(function(r){return r.json().catch(function(){return null;}).then(function(j){if(!r.ok){var e=new Error((j&&j.error)||'Não foi possível concluir.');e.status=r.status;throw e;}return j;});});
}
var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}
var sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function openSheet(h){document.getElementById('sheetBody').innerHTML=h;sheet.classList.add('on');scrim.classList.add('on');sheet.setAttribute('aria-hidden','false');}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');}
scrim.addEventListener('click',closeSheet);

function load(){
  return api('/clubs/'+encodeURIComponent(SLUG)).then(function(d){D=d;render();}).catch(function(e){
    app.innerHTML='<div class="hero"><div class="wrap"><div class="top"><a href="/club.html">‹ Club</a></div><h1 style="font-size:24px;font-weight:900">'+(e.status===404?'Clube não encontrado':'Não deu para abrir o clube')+'</h1></div></div><div class="wrap"><div class="card empty" style="margin-top:22px">'+esc(e.message)+'</div></div>';
  });
}

function render(){
  var c=D.club,v=D.viewer,role=v&&v.role,isMgr=role==='owner'||role==='coach'||role==='admin',isOwner=role==='owner'||role==='admin';
  document.title=c.name+' · Club Sports & Tennis';
  var root=document.documentElement;root.style.setProperty('--c1',color(c.primaryColor,'#EA5128'));root.style.setProperty('--c2',color(c.secondaryColor,'#FFFFFF'));
  var crest=safeImg(c.crestUrl);
  var h='<div class="hero"><div class="wrap"><div class="top"><a href="/club.html">‹ Club Sports &amp; Tennis</a>'+(isMgr?'<button class="btn s" style="background:rgba(255,255,255,.2);color:#fff;min-height:40px" data-a="manage">Gerenciar</button>':'')+'</div>'+
    '<div class="idn"><div class="crest">'+(crest?'<img src="'+esc(crest)+'" alt="Escudo do '+esc(c.name)+'">':esc(ini(c.name)))+'</div><div><h1>'+esc(c.name)+'</h1><div class="sub">'+esc([c.city&&c.state?c.city+'/'+c.state:c.city,c.membersCount+(c.membersCount===1?' membro':' membros')].filter(Boolean).join(' · '))+'</div></div></div>'+
    (c.sports&&c.sports.length?'<div class="chips">'+c.sports.map(function(s){return '<span class="chip">'+esc(SPORT[s]||s)+'</span>';}).join('')+'</div>':'')+
    (c.description?'<p class="desc">'+esc(c.description)+'</p>':'')+'</div></div><div class="wrap">';

  // convite
  if(v&&v.status==='PENDING'){
    h+='<div class="sec"><div class="card inv"><b>Você foi convidado como '+esc((ROLE[v.pendingRole]||'atleta').toLowerCase())+'</b><span style="color:var(--dim);font-size:14px">Aceite para entrar no elenco e receber os avisos de jogos e treinos.</span><div class="row2"><button class="btn s" data-a="decline">Recusar</button><button class="btn p" data-a="accept">Aceitar</button></div></div></div>';
  }else if(CODE&&!(v&&v.status==='ACTIVE')){
    h+='<div class="sec"><div class="card inv"><b>Convite para o '+esc(c.name)+'</b>'+(token()?'<button class="btn p w" data-a="join">Entrar no clube</button>':'<span style="color:var(--dim);font-size:14px">Entre na sua conta do Club para aceitar.</span><a class="btn p w" href="/club.html#/entrar" data-a="login">Entrar no Club</a>')+'</div></div>';
  }

  h+='<div class="sec"><h2>Próximos jogos</h2>'+gamesHtml(D.upcoming)+'</div>';
  if(D.trainings&&D.trainings.length)h+='<div class="sec"><h2>Treinos</h2><div class="card list">'+D.trainings.map(function(t){return '<div><div class="av" style="border-radius:12px">🏃</div><div class="tx"><b>'+esc(t.title)+'</b><span>'+esc([when(t.scheduledAt),t.location,t.focus].filter(Boolean).join(' · '))+'</span></div></div>';}).join('')+'</div></div>';

  h+='<div class="sec"><h2>Elenco</h2>';
  if(D.membersHidden)h+='<div class="card empty">Clube privado: o elenco aparece só para os membros.</div>';
  else if(!D.members.length)h+='<div class="card empty">Ninguém no elenco ainda.</div>';
  else h+='<div class="card list">'+D.members.map(function(m){
    var href=m.username||m.userId?'/atleta/'+encodeURIComponent(m.username||m.userId):'';
    var av=safeImg(m.avatarUrl);
    var lv=m.level?'<div class="lvl"><b>'+esc(m.level.level.toFixed(1))+'</b><span>'+esc((SPORT[m.level.sport]||m.level.sport)+(m.level.provisional?' · prov.':''))+'</span></div>':'';
    return '<a href="'+esc(href)+'" style="text-decoration:none"><div class="av">'+(av?'<img src="'+esc(av)+'" alt="">':esc(ini(m.name)))+'</div><div class="tx"><b>'+esc(m.name)+'</b><span>'+(m.role!=='athlete'?'<span class="pill">'+esc(ROLE[m.role])+'</span> ':'')+(m.username?'@'+esc(m.username):'')+'</span></div>'+lv+'</a>';
  }).join('')+'</div>';
  h+='</div>';

  if(D.medals&&D.medals.length){
    h+='<div class="sec"><h2>Conquistas <span class="pill">'+D.medals.length+'</span></h2><div class="card list">'+D.medals.map(function(md){
      return '<a class="medal" href="/v/'+encodeURIComponent(md.serial)+'" style="text-decoration:none"><div class="md '+esc(md.tier)+'">'+(md.placement?esc(md.placement)+'º':'★')+'</div><div class="tx"><b>'+esc(md.eventName)+'</b><span>'+esc([md.recipientName,md.categoryName,TIER[md.tier]||md.tier].filter(Boolean).join(' · '))+'</span></div></a>';
    }).join('')+'</div></div>';
  }
  if(D.links&&D.links.length)h+='<div class="sec"><h2>Torneios</h2><div class="card list">'+D.links.map(function(l){return '<a href="'+(l.slug?'/t/'+encodeURIComponent(l.slug):'#')+'" style="text-decoration:none"><div class="tx"><b>'+esc(l.tournament||'Torneio')+'</b><span>Inscrito como '+esc(l.entryName)+'</span></div><span class="pill">Ver</span></a>';}).join('')+'</div></div>';
  if(v&&v.status==='ACTIVE'&&role!=='owner')h+='<div class="sec"><button class="btn s w" data-a="leave">Sair do clube</button></div>';
  h+='<p class="fine" style="text-align:center;margin-top:26px">Club Sports &amp; Tennis</p></div>';
  app.innerHTML=h;
}

function gamesHtml(list){
  if(!list||!list.length)return '<div class="card empty">Nenhum jogo marcado. Os jogos aparecem aqui quando o dono liga o clube à inscrição de um torneio.</div>';
  var names={};(D.links||[]).forEach(function(l){names[l.entryName]=1;});
  return '<div class="card list" style="display:block">'+list.map(function(g){
    var live=g.status==='LIVE';
    return '<a class="game" href="'+(g.slug?'/t/'+encodeURIComponent(g.slug):'#')+'" style="display:block;text-decoration:none;border-top:1px solid var(--line)"><div class="meta"><span>'+esc(g.tournament||'')+(g.category?' · '+esc(g.category):'')+'</span><span>'+(live?'<span class="pill g">Ao vivo</span>':esc(when(g.scheduledAt)))+'</span></div>'+
      '<div class="vs"><span class="h'+(names[g.home]?' me':'')+'">'+esc(g.home||'A definir')+'</span><i>'+(live&&g.homeScore!=null?esc(g.homeScore)+' x '+esc(g.awayScore):'x')+'</i><span class="'+(names[g.away]?'me':'')+'">'+esc(g.away||'A definir')+'</span></div>'+
      (g.location?'<div class="meta" style="margin-top:6px"><span>📍 '+esc(g.location)+'</span></div>':'')+'</a>';
  }).join('').replace('border-top:1px solid var(--line)','border-top:0')+'</div>';
}

// --------------------------------------------------------------- gestão
function manageSheet(){
  var c=D.club,role=D.viewer.role,isOwner=role==='owner'||role==='admin';
  var h='<h3>Gerenciar clube</h3>';
  h+='<div class="sec" style="margin-top:0"><h2>Convite</h2><div id="invBox" class="card inv"><div class="sk" style="height:46px"></div></div></div>';
  h+='<div class="sec"><h2>Convidar atleta</h2><label class="f">@usuário do atleta<input id="invUser" autocomplete="off" autocapitalize="none" placeholder="@usuario"></label>'+
    (isOwner?'<label class="f">Papel<select id="invRole"><option value="athlete">Atleta</option><option value="coach">Técnico</option></select></label>':'')+
    '<button class="btn p w" data-a="invite">Enviar convite</button></div>';
  if(isOwner){
    h+='<div class="sec"><h2>Dados do clube</h2>'+
      '<label class="f">Nome<input id="fName" maxlength="80" value="'+esc(c.name)+'"></label>'+
      '<label class="f">Descrição<textarea id="fDesc" maxlength="2000">'+esc(c.description||'')+'</textarea></label>'+
      '<div class="row2"><label class="f">Cidade<input id="fCity" maxlength="80" value="'+esc(c.city||'')+'"></label><label class="f">UF<input id="fState" maxlength="2" value="'+esc(c.state||'')+'"></label></div>'+
      '<div class="colors"><label class="f">Cor principal<input type="color" id="fC1" value="'+esc(color(c.primaryColor,'#EA5128'))+'"></label><label class="f">Cor secundária<input type="color" id="fC2" value="'+esc(color(c.secondaryColor,'#FFFFFF'))+'"></label></div>'+
      '<div class="f" style="font-size:12.5px;font-weight:800;color:var(--mut);margin-bottom:6px">Esportes</div><div class="sports">'+Object.keys(SPORT).map(function(s){return '<label><input type="checkbox" value="'+s+'"'+(c.sports.indexOf(s)>=0?' checked':'')+'>'+esc(SPORT[s])+'</label>';}).join('')+'</div>'+
      '<label class="f">Escudo (PNG/JPG)<input type="file" id="fCrest" accept="image/png,image/jpeg,image/webp"></label>'+
      '<label class="f">Privacidade<select id="fPriv"><option value="public"'+(c.privacyLevel==='public'?' selected':'')+'>Público</option><option value="invite_only"'+(c.privacyLevel==='invite_only'?' selected':'')+'>Só com convite</option><option value="private"'+(c.privacyLevel==='private'?' selected':'')+'>Privado (elenco só pra membros)</option></select></label>'+
      '<button class="btn p w" data-a="save">Salvar</button></div>';
    h+='<div class="sec"><h2>Membros</h2><div class="card list">'+D.members.map(function(m){
      var self=m.role==='owner';
      return '<div class="mrow"><div class="tx"><b>'+esc(m.name)+'</b><span>'+esc(ROLE[m.role])+'</span></div>'+(self?'':'<select data-a="role" data-u="'+esc(m.userId)+'" aria-label="Papel de '+esc(m.name)+'"><option value="athlete"'+(m.role==='athlete'?' selected':'')+'>Atleta</option><option value="coach"'+(m.role==='coach'?' selected':'')+'>Técnico</option><option value="owner">Passar o clube (dono)</option></select><button class="x" data-a="kick" data-u="'+esc(m.userId)+'" aria-label="Remover '+esc(m.name)+'">✕</button>')+'</div>';
    }).join('')+'</div></div>';
    h+='<div class="sec"><h2>Ligar a um torneio</h2><p class="fine" style="margin:0 0 10px">Escolha o torneio e a inscrição EXATA do clube. Os jogos e treinos dessa inscrição passam a aparecer aqui.</p>'+
      '<label class="f">Torneio<select id="lkT"><option value="">Carregando…</option></select></label><label class="f">Inscrição<select id="lkE" disabled><option value="">Escolha o torneio</option></select></label><button class="btn p w" data-a="link">Ligar</button>'+
      (D.links.length?'<div class="card list" style="margin-top:12px">'+D.links.map(function(l){return '<div class="mrow"><div class="tx"><b>'+esc(l.tournament||'Torneio')+'</b><span>'+esc(l.entryName)+'</span></div><button class="x" data-a="unlink" data-l="'+esc(l.id)+'" aria-label="Desligar">✕</button></div>';}).join('')+'</div>':'')+'</div>';
  }
  openSheet(h);
  api('/clubs/'+encodeURIComponent(SLUG)+'/invite').then(function(r){
    var url=location.origin+r.path;
    document.getElementById('invBox').innerHTML='<div class="code">'+esc(r.code)+'</div><div class="row2"><button class="btn s" data-a="copy" data-u="'+esc(url)+'">Copiar link</button><button class="btn p" data-a="share" data-u="'+esc(url)+'">Compartilhar</button></div>'+(isOwner?'<button class="btn s w" data-a="regen">Gerar código novo</button>':'');
  }).catch(function(e){document.getElementById('invBox').innerHTML='<span class="fine">'+esc(e.message)+'</span>';});
  if(isOwner)api('/tournaments').then(function(r){
    var sel=document.getElementById('lkT');if(!sel)return;
    var ts=(r&&r.tournaments)||[];
    sel.innerHTML='<option value="">Escolha…</option>'+ts.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>';}).join('');
  }).catch(function(){var sel=document.getElementById('lkT');if(sel)sel.innerHTML='<option value="">Não deu para carregar</option>';});
}

function resizeImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=function(){rej(new Error('não deu para ler a imagem'));};
    fr.onload=function(){var img=new Image();img.onerror=function(){rej(new Error('imagem inválida'));};img.onload=function(){
      var S=256,cv=document.createElement('canvas');cv.width=S;cv.height=S;var cx=cv.getContext('2d');
      var r=Math.min(img.width,img.height),sx=(img.width-r)/2,sy=(img.height-r)/2;cx.drawImage(img,sx,sy,r,r,0,0,S,S);
      res(cv.toDataURL('image/png'));};img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function act(a,el){
  var base='/clubs/'+encodeURIComponent(SLUG);
  if(a==='manage')return manageSheet();
  if(a==='accept'||a==='decline')return api(base+'/respond',{method:'POST',body:{action:a}}).then(function(){toast(a==='accept'?'Bem-vindo ao clube!':'Convite recusado');return load();}).catch(function(e){toast(e.message);});
  if(a==='join')return api('/clubs/join',{method:'POST',body:{code:CODE}}).then(function(){toast('Você entrou no clube!');history.replaceState(null,'',location.pathname);CODE='';return load();}).catch(function(e){toast(e.message);});
  if(a==='login'){try{localStorage.setItem('club_join_return',location.pathname+location.search);}catch(e){}return;}
  if(a==='leave'){if(!confirm('Sair do clube?'))return;return api(base+'/members/'+encodeURIComponent(D.viewer&&D.viewer.userId||'me'),{method:'DELETE'}).then(load).catch(function(e){toast(e.message);});}
  if(a==='copy'){var u=el.getAttribute('data-u');(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Link copiado');}).catch(function(){prompt('Copie o link:',u);});return;}
  if(a==='share'){var su=el.getAttribute('data-u');if(navigator.share)navigator.share({title:D.club.name,text:'Entre no '+D.club.name+' no Club Sports & Tennis',url:su}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent('Entre no '+D.club.name+': '+su),'_blank');return;}
  if(a==='regen')return api(base+'/invite-code',{method:'POST'}).then(function(){toast('Código novo gerado');manageSheet();}).catch(function(e){toast(e.message);});
  if(a==='invite'){var un=(document.getElementById('invUser').value||'').trim().replace(/^@/,'');if(!un)return toast('Digite o @ do atleta');var rs=document.getElementById('invRole');
    return api(base+'/invite',{method:'POST',body:{username:un,role:rs?rs.value:'athlete'}}).then(function(){toast('Convite enviado');document.getElementById('invUser').value='';}).catch(function(e){toast(e.message);});}
  if(a==='save'){
    var sports=[].slice.call(document.querySelectorAll('.sports input:checked')).map(function(i){return i.value;});
    var body={name:document.getElementById('fName').value,description:document.getElementById('fDesc').value,city:document.getElementById('fCity').value,state:document.getElementById('fState').value.toUpperCase(),primaryColor:document.getElementById('fC1').value,secondaryColor:document.getElementById('fC2').value,sports:sports,privacyLevel:document.getElementById('fPriv').value};
    var f=document.getElementById('fCrest').files[0];el.disabled=true;
    return (f?resizeImage(f).then(function(d){body.crestUrl=d;}):Promise.resolve()).then(function(){return api(base,{method:'PATCH',body:body});})
      .then(function(){toast('Clube atualizado');closeSheet();return load();}).catch(function(e){toast(e.message);}).then(function(){el.disabled=false;});
  }
  if(a==='kick'){if(!confirm('Remover este membro?'))return;return api(base+'/members/'+encodeURIComponent(el.getAttribute('data-u')),{method:'DELETE'}).then(function(){toast('Removido');return load().then(manageSheet);}).catch(function(e){toast(e.message);});}
  if(a==='link'){var t=document.getElementById('lkT').value,en=document.getElementById('lkE').value;if(!t||!en)return toast('Escolha o torneio e a inscrição');
    return api(base+'/links',{method:'POST',body:{tournamentId:t,entryName:en}}).then(function(){toast('Clube ligado ao torneio');return load().then(manageSheet);}).catch(function(e){toast(e.message);});}
  if(a==='unlink')return api(base+'/links/'+encodeURIComponent(el.getAttribute('data-l')),{method:'DELETE'}).then(function(){toast('Desligado');return load().then(manageSheet);}).catch(function(e){toast(e.message);});
}

document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;var a=el.getAttribute('data-a');if(a!=='login')e.preventDefault();act(a,el);});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='lkT'){var ent=document.getElementById('lkE');ent.disabled=true;ent.innerHTML='<option>Carregando…</option>';if(!el.value){ent.innerHTML='<option value="">Escolha o torneio</option>';return;}
    api('/clubs/'+encodeURIComponent(SLUG)+'/entry-options?tournamentId='+encodeURIComponent(el.value)).then(function(r){ent.innerHTML='<option value="">Escolha…</option>'+r.entries.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');ent.disabled=false;}).catch(function(err){ent.innerHTML='<option value="">'+esc(err.message)+'</option>';});}
  if(el.getAttribute('data-a')==='role'){var v=el.value;if(v==='owner'&&!confirm('Passar o clube para este membro? Você vira técnico.')){manageSheet();return;}
    api('/clubs/'+encodeURIComponent(SLUG)+'/members/'+encodeURIComponent(el.getAttribute('data-u')),{method:'PATCH',body:{role:v}}).then(function(){toast('Papel atualizado');return load().then(function(){if(D.viewer&&(D.viewer.role==='owner'||D.viewer.role==='coach'))manageSheet();else closeSheet();});}).catch(function(err){toast(err.message);});}
});
load();
})();
</script>
</body>
</html>
