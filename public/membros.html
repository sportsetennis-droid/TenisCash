<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meus cursos — Sports & Tennis</title>
<link rel="manifest" href="/manifest.json">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f7; color:#1d1d1f; padding-top:env(safe-area-inset-top); min-height:100vh; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width:760px){ body{padding:20px 0} .app{background:#f5f5f7;border-radius:24px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.16);min-height:calc(100vh - 40px)} }
  .topbar { background:linear-gradient(135deg,#E5571E,#EE7240); color:#fff; padding:16px 18px; }
  .topbar .t { font-size:17px; font-weight:800; }
  .topbar .sub { font-size:12px; opacity:.9; }
  .view { padding:16px; }
  .card { background:#fff; border:1px solid #e5e5ea; border-radius:14px; padding:12px; margin-bottom:12px; display:flex; gap:12px; align-items:center; cursor:pointer; text-decoration:none; color:inherit; }
  .thumb { width:64px; height:64px; border-radius:11px; object-fit:cover; background:#eee; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .prog { height:6px; background:#eee; border-radius:6px; margin-top:8px; overflow:hidden; }
  .prog > i { display:block; height:100%; background:#25d366; }
  .muted { color:#888; font-size:13px; }
  .empty { text-align:center; color:#aaa; font-size:14px; padding:50px 20px; line-height:1.6; }
  .state { text-align:center; color:#999; padding:80px 24px; font-size:14px; line-height:1.6; }
  .btn { min-height:46px; padding:0 22px; border:none; border-radius:12px; font-size:15px; font-weight:700; background:#E5571E; color:#fff; text-decoration:none; display:inline-flex; align-items:center; }
</style>
</head>
<body>
  <div class="app" id="app"><div class="state">Carregando…</div></div>
<script>
const API='/api/infoproducts';
const token=localStorage.getItem('tc_token')||'';
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const PTYPE={course:'Curso',ebook:'E-book',community:'Comunidade',mentorship:'Mentoria',file:'Arquivo',bundle:'Combo'};

async function boot(){
  if(!token){ document.getElementById('app').innerHTML='<div class="state">Entre no app primeiro.<br><br><a class="btn" href="/">Ir para o login</a></div>'; return; }
  let list;
  try{
    const res=await fetch(API+'/my/purchases',{headers:{'Authorization':'Bearer '+token}});
    if(res.status===401){ document.getElementById('app').innerHTML='<div class="state">Sessão expirada.<br><br><a class="btn" href="/">Entrar</a></div>'; return; }
    list=await res.json();
  }catch(e){ document.getElementById('app').innerHTML='<div class="state">Erro ao carregar.</div>'; return; }
  document.getElementById('app').innerHTML=`
    <div class="topbar"><div class="t">Meus cursos</div><div class="sub">Conteúdos que você adquiriu</div></div>
    <div class="view">${
      list.length?list.map(row).join(''):'<div class="empty">Você ainda não tem cursos.<br>Compras feitas com seu telefone aparecem aqui automaticamente.</div>'
    }</div>`;
}
function row(e){
  const p=e.product||{};
  return `<a class="card" href="/curso/${esc(e.accessToken)}">
    ${p.coverUrl?`<img class="thumb" src="${esc(p.coverUrl)}">`:`<div class="thumb">🎓</div>`}
    <div style="flex:1">
      <div style="font-weight:700;line-height:1.2">${esc(p.title||'Curso')}</div>
      <div class="muted">${PTYPE[p.type]||''} · ${e.progressPct||0}% concluído</div>
      <div class="prog"><i style="width:${e.progressPct||0}%"></i></div>
    </div>
    <span style="color:#ccc;font-size:22px">›</span>
  </a>`;
}
boot();
</script>
</body>
</html>
