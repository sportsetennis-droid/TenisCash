<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Config PagBank (PIX) por loja</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; color: #1d1d1f;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 6px 0 2px; }
  .sub { color: #6e6e73; font-size: 13px; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .store-name { font-weight: 800; font-size: 16px; }
  .store-code { color: #8e8e93; font-size: 12px; font-weight: 600; }
  label { display: block; font-size: 11px; font-weight: 700; color: #6e6e73; letter-spacing: .5px; margin: 12px 0 4px; text-transform: uppercase; }
  input[type=text], input[type=password] { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .row label { margin: 0; text-transform: none; font-size: 14px; color: #1d1d1f; font-weight: 600; }
  .toggle { width: 52px; height: 30px; border-radius: 16px; background: #d1d1d6; position: relative; flex: none; cursor: pointer; transition: .15s; }
  .toggle.on { background: #34c759; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .15s; }
  .toggle.on::after { left: 25px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #0a843d; color: #fff; font-weight: 800; font-size: 15px; margin-top: 14px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .status { font-size: 13px; margin-top: 8px; font-weight: 700; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .pill.on { background: #e3f7e9; color: #0a843d; }
  .pill.off { background: #f2f2f7; color: #8e8e93; }
  .hint { font-size: 11px; color: #8e8e93; margin-top: 4px; line-height: 1.4; }
  .warn { background: #fff4e5; border: 1px solid #ffd9a8; color: #8a5a00; padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PagBank — PIX por loja</h1>
  <div class="sub">Cole a <b>chave (token)</b> da conta PagBank de cada loja e ligue o PIX automático.</div>
  <div class="warn">⚠️ Use uma chave <b>gerada de novo</b> no PagBank. Nunca cole a chave em conversa/chat — só aqui.</div>
  <div id="list">Carregando…</div>
</div>
<script>
const TOKEN = localStorage.getItem('tc_admin_token') || '';
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function storeCard(s) {
  const onCls = s.enabled ? 'on' : 'off';
  return `<div class="card" data-id="${s.id}">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><div class="store-name">${esc(s.name)}</div><div class="store-code">${esc(s.code)}</div></div>
      <span class="pill ${onCls}">${s.enabled ? 'PIX LIGADO' : 'desligado'}</span>
    </div>
    <label>Chave / Token PagBank ${s.hasToken ? '(já salva: ' + esc(s.tokenMasked) + ')' : ''}</label>
    <input type="password" class="f-token" placeholder="${s.hasToken ? 'deixe em branco pra manter a atual' : 'cole a chave aqui'}" autocomplete="off">
    <div class="hint">PagBank → Vendas → Plataformas e checkout → Integrações → Gerar token.</div>
    <label>Chave PIX da conta (opcional)</label>
    <input type="text" class="f-pix" value="${esc(s.pixKey)}" placeholder="chave PIX (referência)">
    <div class="row"><div class="toggle ${s.sandbox ? 'on' : ''} f-sandbox" onclick="this.classList.toggle('on')"></div><label>Modo teste (sandbox)</label></div>
    <div class="row"><div class="toggle ${s.enabled ? 'on' : ''} f-enabled" onclick="this.classList.toggle('on')"></div><label>Ligar PIX automático nesta loja</label></div>
    <button class="btn" onclick="save('${s.id}', this)">Salvar</button>
    <div class="status"></div>
  </div>`;
}
async function load() {
  const el = document.getElementById('list');
  if (!TOKEN) { el.innerHTML = '<div class="card">Faça login no <b>/admin.html</b> primeiro (neste mesmo navegador) e recarregue.</div>'; return; }
  try {
    const d = await api('/api/admin/pagbank-stores');
    el.innerHTML = (d.stores || []).map(storeCard).join('') || '<div class="card">Nenhuma loja.</div>';
  } catch (e) { el.innerHTML = '<div class="card">Erro: ' + esc(e.message) + ' — confira se está logado no admin.</div>'; }
}
async function save(id, btn) {
  const card = btn.closest('.card');
  const st = card.querySelector('.status');
  const token = card.querySelector('.f-token').value.trim();
  const pixKey = card.querySelector('.f-pix').value.trim();
  const sandbox = card.querySelector('.f-sandbox').classList.contains('on');
  const enabled = card.querySelector('.f-enabled').classList.contains('on');
  if (enabled && !token && !card.querySelector('.f-token').placeholder.includes('manter')) {
    st.style.color = '#d70015'; st.textContent = 'Cole a chave antes de ligar.'; return;
  }
  btn.disabled = true; btn.textContent = 'Salvando…'; st.textContent = '';
  try {
    const body = { pixKey, sandbox, enabled };
    if (token) body.token = token;
    const r = await api('/api/admin/pagbank-stores/' + id, { method: 'POST', body: JSON.stringify(body) });
    st.style.color = '#0a843d';
    st.textContent = '✅ Salvo. ' + (r.hasToken ? 'Chave: ' + r.tokenMasked : 'sem chave') + ' · ' + (r.sandbox ? 'teste' : 'produção') + ' · ' + (r.enabled ? 'LIGADO' : 'desligado');
    card.querySelector('.f-token').value = '';
    card.querySelector('.f-token').placeholder = r.hasToken ? 'deixe em branco pra manter a atual' : 'cole a chave aqui';
  } catch (e) { st.style.color = '#d70015'; st.textContent = 'Erro: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = 'Salvar'; }
}
load();
</script>
</body>
</html>
