<!DOCTYPE html>
<!--
  TenisCash — Torneios APEX (gestão mobile-first)
  REGRA: HTML gerado por JS NUNCA usa onclick inline. Sempre data-* + delegação.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E5571E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TenisCash — Torneios</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF6A1F; --orange-d:#E5571E; --soft:#FFEBDC;
    --grad:linear-gradient(135deg,#FF6A1F 0%,#EE7240 100%);
    --ink:#16181D; --mut:#6B7280; --line:#ECECEF; --bg:#F5F6F8; --card:#fff;
    --ok:#11A36B; --okbg:#E5F6EE; --warn:#B26A00; --warnbg:#FFF1DC; --bad:#C0392B;
    --r:16px; --rs:11px;
    --sh:0 4px 16px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
  @media(min-width:900px){#app{margin:18px auto;min-height:calc(100vh - 36px);border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,.16);overflow:hidden}}
  .top{background:var(--grad);color:#fff;padding:16px 16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .top h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px;flex:1}
  .back{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .wrap{padding:16px 16px 96px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
  .card.tap{cursor:pointer;transition:transform .08s}
  .card.tap:active{transform:scale(.99)}
  h2{font-size:15px;font-weight:800;margin:2px 0 10px;letter-spacing:-.2px}
  label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--rs);padding:12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);min-height:46px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;min-height:50px;background:var(--grad);color:#fff;letter-spacing:-.2px}
  .btn:active{opacity:.9}
  .btn.sec{background:#fff;color:var(--orange-d);border:1.5px solid var(--soft)}
  .btn.gho{background:var(--soft);color:var(--orange-d)}
  .btn.sm{min-height:40px;padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
  .btn.dang{background:#fff;color:var(--bad);border:1.5px solid #F3D2CE}
  .muted{color:var(--mut);font-size:13px;line-height:1.5}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--orange-d);text-transform:uppercase;letter-spacing:.4px}
  .pill.ok{background:var(--okbg);color:var(--ok)}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.g{background:#EEF0F3;color:var(--mut)}
  .tabs{display:flex;gap:6px;background:#EEF0F3;border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mut);font-family:inherit;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .listitem{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:0}
  .av{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
  .grow{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--mut);margin-top:1px}
  .empty{text-align:center;padding:30px 12px;color:var(--mut)}
  .empty .ic{font-size:34px;margin-bottom:8px}
  .match{display:flex;align-items:center;gap:8px;padding:11px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
  .match .side{flex:1;min-width:0;font-size:13px;font-weight:600}
  .match .side.win{font-weight:800;color:var(--ink)}
  .match .side.lose{color:var(--mut)}
  .match .sc{font-weight:800;font-size:15px;min-width:22px;text-align:center}
  .match .vs{color:var(--mut);font-size:11px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
  th{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
  td.t-nm,th.t-nm{text-align:left;font-weight:700}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
  .grab{width:38px;height:4px;background:#D7D9DE;border-radius:2px;margin:0 auto 12px}
  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .setrow label{margin:0;width:46px;flex-shrink:0}
  .setrow input{text-align:center;font-weight:800;font-size:17px}
  .fab{position:fixed;right:50%;transform:translateX(calc(232px - 100%));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30}
  @media(max-width:520px){.fab{right:16px;transform:none}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#16181D;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .spin{width:26px;height:26px;border:3px solid var(--soft);border-top-color:var(--orange);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hd-stat{display:flex;gap:8px;margin-top:12px}
  .hd-stat .b{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:9px;text-align:center}
  .hd-stat .b b{display:block;font-size:18px;font-weight:900}
  .hd-stat .b span{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
  a.plain{color:inherit;text-decoration:none}
  .linkrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .linkrow:last-child{border-bottom:0}
  .linkrow .l{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
  .linkrow .ic{font-size:19px}
  .stepper{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .stepper .sname{flex:1;min-width:0;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stepper .stp{width:42px;height:42px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-size:24px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stepper .stp:active{transform:scale(.94)}
  .stepper .snum{min-width:34px;text-align:center;font-size:24px;font-weight:900}
  .livebox{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
  .livebox .setline{padding:2px 0}
  .livetag{display:inline-flex;align-items:center;gap:5px;background:#ffe9e0;color:var(--bad);font-size:10px;font-weight:900;padding:2px 7px;border-radius:7px;text-transform:uppercase;letter-spacing:.4px;margin-left:6px}
  .livetag .dot{width:6px;height:6px;border-radius:50%;background:var(--bad);animation:lp 1.1s infinite}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
  .rkbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
  .rkbar::-webkit-scrollbar{display:none}
  .rkpill{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--mut);font-weight:800;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .rkpill.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .rkrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .rkrow:last-child{border-bottom:0}
  .rkpos{width:30px;text-align:center;font-size:21px;font-weight:900;flex:0 0 auto}
  .rkpos .rknum{font-size:15px;color:var(--mut)}
  .rkrating{font-size:21px;font-weight:900;color:var(--orange-d);flex:0 0 auto}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const SPORTS=[["TENNIS","🎾 Tênis"],["BEACH_TENNIS","🏖️ Beach Tennis"],["PADEL","🟦 Padel"],["FUTSAL","⚽ Futsal"],["SOCCER","⚽ Society"],["VOLLEY","🏐 Vôlei"],["BASKETBALL","🏀 Basquete"],["HANDBALL","🤾 Handebol"],["TABLE_TENNIS","🏓 Tênis de Mesa"],["OTHER","🏅 Outro"]];
const SPORT_LABEL=Object.fromEntries(SPORTS);
const FORMATS=[["KNOCKOUT","Mata-mata"],["ROUND_ROBIN","Pontos corridos"],["GROUPS","Fase de grupos"],["GROUPS_KNOCKOUT","Grupos + mata-mata"]];
const FMT_LABEL=Object.fromEntries(FORMATS);
const ST_LABEL={DRAFT:["Rascunho","g"],OPEN:["Inscrições abertas","w"],ONGOING:["Em andamento","ok"],FINISHED:["Encerrado","g"],CANCELED:["Cancelado","g"]};

let TOKEN=localStorage.getItem('tc_token')||'';
let ME=null;
let RK_SPORT='BEACH_TENNIS';
const app=document.getElementById('app');

// ---------- helpers ----------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function loading(){app.innerHTML='<div class="spin"></div>';}
async function api(path,opts){
  const o=opts||{};
  const r=await fetch('/api/tournaments'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},body:o.body?JSON.stringify(o.body):undefined});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||('erro '+r.status));
  return j;
}
async function authApi(path,opts){
  const o=opts||{};
  const r=await fetch('/api/auth'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},body:o.body?JSON.stringify(o.body):undefined});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||('erro '+r.status));
  return j;
}
function openSheet(html){document.getElementById('sheet').innerHTML='<div class="grab"></div>'+html;document.getElementById('sheetbg').classList.add('on');}
function closeSheet(){document.getElementById('sheetbg').classList.remove('on');}
function go(h){location.hash=h;}
function topbar(title,back){return '<div class="top">'+(back?'<button class="back" data-act="back">‹</button>':'')+'<h1>'+esc(title)+'</h1></div>';}

// ---------- boot ----------
async function boot(){
  if(!TOKEN){return renderLogin();}
  try{const r=await authApi('/me');ME=r.user;}catch(e){TOKEN='';localStorage.removeItem('tc_token');return renderLogin();}
  route();
}
window.addEventListener('hashchange',route);

function route(){
  if(!ME)return boot();
  const h=location.hash.replace(/^#\/?/,'');
  const [view,arg]=h.split('/');
  if(view==='novo')return renderCreate();
  if(view==='t'&&arg)return renderTournament(arg);
  if(view==='desafios')return renderChallenges();
  if(view==='vitrine')return renderVitrine();
  if(view==='ranking')return renderRankings();
  if(view==='avisos')return renderNotifications();
  if(view==='sumula'&&arg)return renderSumula(arg);
  if(view==='treino'&&arg)return renderTreino(arg);
  return renderHome();
}

// ---------- login ----------
function renderLogin(){
  app.innerHTML=topbar('Torneios')+
  '<div class="wrap"><div class="card"><h2>Entrar</h2>'+
  '<p class="muted" style="margin:0 0 8px">Use a mesma conta do TenisCash.</p>'+
  '<label>Telefone ou e-mail</label><input id="li-user" inputmode="email" placeholder="(83) 9... ou email@...">'+
  '<label>Senha</label><input id="li-pass" type="password" placeholder="sua senha">'+
  '<div style="height:14px"></div><button class="btn" data-act="login">Entrar</button>'+
  '<p class="muted" style="text-align:center;margin:14px 0 0">Não tem conta? <a class="plain" style="color:var(--orange-d);font-weight:800" href="/app.html">Criar no app</a></p>'+
  '</div></div>';
}
async function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  if(!u||!p)return toast('Preencha login e senha');
  const body=u.includes('@')?{email:u,password:p}:{phone:u.replace(/\D/g,''),password:p};
  try{
    const r=await authApi('/login',{method:'POST',body});
    TOKEN=r.token;localStorage.setItem('tc_token',TOKEN);ME=r.user;
    toast('Bem-vindo, '+(ME.name||'').split(' ')[0]+'!');go('');route();
  }catch(e){toast(e.message||'Falha no login');}
}

// ---------- home ----------
async function renderHome(){
  loading();
  let mine=[];
  try{mine=(await api('/mine')).tournaments||[];}catch(e){}
  let part=[];
  try{part=(await api('/my-tournaments')).tournaments||[];}catch(e){}
  const mineIds=new Set(mine.map(t=>t.id));
  part=part.filter(t=>t.ownerId!==ME.id&&!mineIds.has(t.id));
  let unread=0;
  try{unread=(await api('/notifications/mine?limit=1')).unread||0;}catch(e){}
  const handle=ME.username||ME.id;
  let html=topbar('Torneios');
  html+='<div class="wrap">';
  html+='<div class="card" style="background:var(--grad);color:#fff">'+
    '<div style="font-size:13px;opacity:.9;font-weight:700">Olá, '+esc((ME.name||'Atleta').split(' ')[0])+'</div>'+
    '<div style="font-size:20px;font-weight:900;margin-top:2px">Central de Torneios</div>'+
    '<div class="hd-stat"><div class="b"><b>'+mine.length+'</b><span>organizo</span></div>'+
    '<a class="b plain" href="/atleta/'+esc(handle)+'"><b>★</b><span>meu card</span></a>'+
    '<a class="b plain" data-act="nav" data-h="vitrine"><b>🔎</b><span>vitrine</span></a></div></div>';

  html+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h2 style="margin:0">Meus torneios</h2>'+
    '<button class="btn sm gho" data-act="nav" data-h="novo">+ Criar</button></div>';
  if(!mine.length){html+='<div class="empty"><div class="ic">🏆</div>Você ainda não organiza torneios.<br>Crie o primeiro.</div>';}
  else{mine.forEach(t=>{const st=ST_LABEL[t.status]||['',''];
    html+='<div class="listitem card-tap" data-act="open-t" data-id="'+t.id+'">'+
      '<div class="av">'+esc((SPORT_LABEL[t.sport]||'🏅').split(' ')[0])+'</div>'+
      '<div class="grow"><div class="nm">'+esc(t.name)+'</div>'+
      '<div class="sub">'+esc(FMT_LABEL[t.format]||t.format)+' · '+(t._count?t._count.entries:0)+' inscritos</div></div>'+
      '<span class="pill '+st[1]+'">'+esc(st[0])+'</span></div>';});}
  if(ME){
    html+='<div style="height:8px"></div><button class="btn sm sec" data-act="import-futsal" style="width:100%">⚽ Importar II Futsal Master Cup 2026</button>';
  }
  html+='</div>';

  if(part.length){
    html+='<div class="card"><h2 style="margin:0 0 6px">Onde eu atuo</h2>'+
      '<p class="muted" style="margin:0 0 8px;font-size:12px">Torneios em que você tem um papel (arbitragem, time, treinador...).</p>';
    part.forEach(t=>{const st=ST_LABEL[t.status]||['',''];
      const seen={};const badges=(t.myRoles||[]).filter(r=>{if(seen[r.role])return false;seen[r.role]=1;return true;}).map(r=>'<span class="pill g" style="margin-right:4px">'+(ROLE_EMOJI[r.role]||'•')+' '+esc((ROLE_LBL[r.role]||r.role))+'</span>').join('');
      html+='<div class="listitem card-tap" data-act="open-t" data-id="'+t.id+'">'+
        '<div class="av">'+esc((SPORT_LABEL[t.sport]||'🏅').split(' ')[0])+'</div>'+
        '<div class="grow"><div class="nm">'+esc(t.name)+'</div>'+
        '<div class="sub" style="margin-top:3px">'+badges+'</div></div>'+
        '<span class="pill '+st[1]+'">'+esc(st[0])+'</span></div>';});
    html+='</div>';
  }

  html+='<div class="card"><div class="linkrow" data-act="nav" data-h="avisos"><div class="l"><span class="ic">🔔</span> Avisos'+(unread?' <span class="pill w">'+unread+'</span>':'')+'</div><span style="color:var(--mut)">›</span></div>'+
    '<div class="linkrow" data-act="nav" data-h="desafios"><div class="l"><span class="ic">⚔️</span> Desafios 1v1</div><span style="color:var(--mut)">›</span></div>'+
    '<div class="linkrow" data-act="nav" data-h="ranking"><div class="l"><span class="ic">🏆</span> Ranking de atletas</div><span style="color:var(--mut)">›</span></div>'+
    '<div class="linkrow" data-act="nav" data-h="vitrine"><div class="l"><span class="ic">📢</span> Vitrine pública</div><span style="color:var(--mut)">›</span></div>'+
    '<a class="linkrow plain" href="/atleta/'+esc(handle)+'"><div class="l"><span class="ic">🪪</span> Ver meu card de atleta</div><span style="color:var(--mut)">›</span></a></div>';
  html+='</div>';
  app.innerHTML=html;
}

// ---------- vitrine (public) ----------
async function renderVitrine(){
  loading();
  let list=[];try{list=(await api('/')).tournaments||[];}catch(e){}
  let html=topbar('Vitrine',true)+'<div class="wrap">';
  if(!list.length)html+='<div class="card"><div class="empty"><div class="ic">📭</div>Nenhum torneio público no momento.</div></div>';
  else list.forEach(t=>{const st=ST_LABEL[t.status]||['',''];
    html+='<div class="card tap" data-act="open-t" data-id="'+t.id+'"><div style="display:flex;align-items:center;gap:11px">'+
      '<div class="av">'+esc((SPORT_LABEL[t.sport]||'🏅').split(' ')[0])+'</div><div class="grow">'+
      '<div class="nm">'+esc(t.name)+'</div><div class="sub">'+esc(SPORT_LABEL[t.sport]||t.sport)+(t.city?' · '+esc(t.city):'')+'</div></div>'+
      '<span class="pill '+st[1]+'">'+esc(st[0])+'</span></div></div>';});
  html+='</div>';app.innerHTML=html;
}

// ---------- create ----------
function renderCreate(){
  let html=topbar('Criar torneio',true)+'<div class="wrap"><div class="card">';
  html+='<label>Nome do torneio</label><input id="c-name" placeholder="Ex: Copa S&T de Beach Tennis">';
  html+='<label>Esporte</label><select id="c-sport">'+SPORTS.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('')+'</select>';
  html+='<label>Formato</label><select id="c-format">'+FORMATS.map(f=>'<option value="'+f[0]+'">'+f[1]+'</option>').join('')+'</select>';
  html+='<label>Tipo</label><select id="c-doubles"><option value="0">Individual</option><option value="1">Duplas</option></select>';

    html+='<div class="card"><h2 style="margin:0 0 6px">🏋️ Treinos do meu time</h2><div id="my-trainings"><div class="spin"></div></div></div>';

  else{html+='<div style="margin-top:8px">';cats.forEach(c=>{
    html+='<div class="listitem"><div class="grow"><div class="nm">'+esc(c.name)+'</div>'+
      '<div class="sub">'+(c._count?c._count.entries:0)+' inscritos · '+(c._count?c._count.matches:0)+' partidas</div></div>'+
      '<button class="btn sm sec" data-act="open-cat" data-tid="'+t.id+'" data-cid="'+c.id+'" data-cname="'+esc(c.name)+'" data-dbl="'+(t.isDoubles?1:0)+'" data-fmt="'+esc(c.format||t.format)+'">Gerir</button></div>';
  });html+='</div>';}
  html+='</div>';

  html+='<div id="cat-panel"></div>';
  if(canAssign)html+=rolesCard(t.id);
  html+=muralCard(t.id,true,posts);
  html+='</div>';

const ROLE_LBL={FOUNDER:'Fundador do campeonato',COORDINATOR:'Coordenador técnico',TEAM_ADMIN:'Administrador do time',COACH:'Treinador',REFEREE:'Arbitragem',PLAYER:'Jogador'};
const ROLE_EMOJI={FOUNDER:'★',COORDINATOR:'🧭',TEAM_ADMIN:'🛡️',COACH:'🧢',REFEREE:'🧑‍⚖️',PLAYER:'🏃'};
const TEAM_ROLES=['TEAM_ADMIN','COACH','PLAYER'];
function rolesCard(tid){
  return '<div class="card" id="roles-card"><h2 style="margin:0 0 4px">👥 Contas & Papéis</h2>'+
    '<p class="muted" style="margin:0 0 10px">Quem alimenta cada parte do torneio. Cada pessoa entra com telefone + senha.</p>'+
    '<div id="roles-list"><div class="spin"></div></div>'+
    '<div style="height:10px"></div><button class="btn sm gho" data-act="add-role" data-tid="'+tid+'" style="width:100%">+ Nomear pessoa</button></div>';

async function loadRoles(tid){
  const box=document.getElementById('roles-list');if(!box)return;
  let data;try{data=await api('/'+tid+'/roles');}catch(e){box.innerHTML='<div class="empty" style="padding:12px">'+esc(e.message)+'</div>';return;}
  const rs=data.roles||[];
  // agrupa papéis de time do mesmo clube numa linha só (clube único)
  const seen={};const rows=[];
  rs.forEach(r=>{
    const key=(r.user&&r.user.id||'')+'|'+r.role+'|'+(r.entry?r.entry.name:'');
    if(TEAM_ROLES.includes(r.role)){if(seen[key])return;seen[key]=1;}
    rows.push(r);
  });
  box.innerHTML=rows.length?rows.map(r=>{
    const nm=(r.user&&r.user.name)||'—';
    const sub=esc(ROLE_LBL[r.role]||r.role)+(r.entry?' · '+esc(r.entry.name):'')+((r.user&&r.user.phone)?' · '+esc(r.user.phone):'');
    const del=(r.id&&!r.implicit)?'<button class="btn sm dang" data-act="del-role" data-tid="'+tid+'" data-rid="'+r.id+'"'+(TEAM_ROLES.includes(r.role)?' data-uid="'+esc(r.user&&r.user.id||'')+'" data-role="'+r.role+'" data-club="'+esc(r.entry?r.entry.name:'')+'"':'')+'>✕</button>':'<span class="pill g">dono</span>';
    return '<div class="listitem"><div class="av" style="background:var(--soft);color:var(--orange-d);font-weight:800">'+initials(nm)+'</div>'+
      '<div class="grow"><div class="nm">'+esc(nm)+((r.user&&r.user.username)?' <span class="sub">@'+esc(r.user.username)+'</span>':'')+'</div><div class="sub">'+sub+'</div></div>'+del+'</div>';
  }).join(''):'<div class="empty" style="padding:12px">Só você por enquanto. Nomeie o coordenador, os árbitros e os admins dos times.</div>';
}

async function saveAddRole(tid){

    const p=await api('/'+tid+'/people',{method:'POST',body:{name,phone}});

const STAGE_LBL={LEAGUE:'Rodada',GROUP:'Grupo',RO32:'32-avos',RO16:'Oitavas',QUARTER:'Quartas',SEMI:'Semi',THIRD:'3º lugar',FINAL:'Final'};
async function loadMyMatches(tid){
  const box=document.getElementById('my-matches');if(!box)return;
  let ms=[];try{ms=(await api('/'+tid+'/my-matches')).matches||[];}catch(e){box.innerHTML='<div class="empty" style="padding:12px">'+esc(e.message)+'</div>';return;}
  if(!ms.length){box.innerHTML='<div class="empty" style="padding:12px">Nenhum jogo pra você apitar ainda.<br>A coordenação te nomeia por jogo.</div>';return;}
  box.innerHTML=ms.map(m=>{
    const done=m.status==='FINISHED'||m.status==='WALKOVER';
    const live=m.status==='LIVE';
    const sc=(m.homeScore!=null&&m.awayScore!=null)?(m.homeScore+'×'+m.awayScore):'';
    const stg=m.groupName?('Grupo '+esc(m.groupName)):(STAGE_LBL[m.stage]||m.stage)+(m.stage==='LEAGUE'?' '+m.round:'');
    return '<div class="listitem"><div class="grow">'+
      '<div class="nm">'+esc(m.home)+' <span style="color:var(--mut)">×</span> '+esc(m.away)+(sc?' <b style="color:var(--orange-d)">'+sc+'</b>':'')+'</div>'+
      '<div class="sub">'+esc(m.category)+' · '+stg+(m.scheduledAt?' · '+fmtDate(m.scheduledAt):'')+(m.location?' · '+esc(m.location):'')+'</div>'+
      '<div style="margin-top:3px">'+(m.nominated?'<span class="pill ok">você apita</span> ':'<span class="pill g">livre</span> ')+(live?'<span class="pill w">🔴 ao vivo</span>':'')+(done?'<span class="pill ok">encerrada</span>':'')+'</div></div>'+
      '<button class="btn sm '+(done?'sec':'')+'" data-act="sumula" data-mid="'+m.id+'">'+(done?'Ver':'Súmula')+'</button></div>';
  }).join('');
}

function teamPickLogo(eid){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;toast('Processando escudo...');
    var r=new FileReader();
    r.onload=function(){var img=new Image();
      img.onload=function(){
        var max=160,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,0,0,cw,ch);
        var data=cv.toDataURL('image/png');if(data.length>760000)data=cv.toDataURL('image/jpeg',0.82);
        api('/entries/'+eid+'/logo',{method:'POST',body:{logo:data}}).then(function(){toast('Escudo salvo');if(TEAM_CTX.tid)loadMyTeam(TEAM_CTX.tid,TEAM_CTX.canLogo);}).catch(function(e){toast(e.message);});
      };img.onerror=function(){toast('Imagem inválida');};img.src=r.result;};
    r.readAsDataURL(f);};
  inp.click();
}

let TREINO=null;
async function renderTreino(sid){
  loading();
  let d;try{d=await api('/trainings/'+sid);}catch(e){app.innerHTML=topbar('Treino',true)+'<div class="wrap"><div class="card"><div class="empty">'+esc(e.message)+'</div></div></div>';return;}
  TREINO={sid,last:d};const s=d.session;const done=s.status==='DONE';
  // posso gerir? (treinador/admin/coord) — pelo meu papel neste torneio.
  let canManage=false;
  try{const mr=await api('/'+s.tournamentId+'/my-roles');canManage=!!(mr.caps&&mr.caps.manageTournament)||(mr.roles||[]).some(r=>r.role==='COACH'||r.role==='TEAM_ADMIN');}catch(e){}
  const st=TRAIN_ST[s.status]||['',''];
  let html=topbar('Treino',true)+'<div class="wrap">';
  html+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0;font-size:16px">'+esc(s.title)+'</h2><span class="pill '+st[1]+'">'+esc(st[0])+'</span></div>'+
    '<div class="muted" style="margin-top:6px;font-size:13px">'+(s.scheduledAt?fmtDate(s.scheduledAt):'sem data')+(s.location?' · '+esc(s.location):'')+'</div>'+
    (s.focus?'<div style="margin-top:6px;font-size:14px">🎯 <b>Foco:</b> '+esc(s.focus)+'</div>':'')+'</div>';
  // Chamada
  html+='<div class="card"><h2 style="margin:0 0 6px;font-size:14px">Chamada ('+d.roster.length+' atletas)</h2>';
  if(!d.roster.length)html+='<div class="empty" style="padding:12px">Nenhum atleta vinculado ainda. Vincule atletas ao time pra fazer a chamada.</div>';
  else d.roster.forEach(p=>{
    const badge=p.present===true?'<span class="pill ok">presente</span>':(p.present===false?'<span class="pill dang" style="background:#fde8e8;color:#c0392b">faltou</span>':(p.confirmed?'<span class="pill w">confirmou</span>':'<span class="pill g">—</span>'));
    html+='<div class="listitem"><div class="av" style="font-size:13px">'+initials(p.name)+'</div>'+
      '<div class="grow"><div class="nm" style="font-size:14px">'+esc(p.name)+'</div><div class="sub">'+(p.confirmed?'confirmou presença':'sem confirmar')+'</div></div>'+badge+
      (canManage&&!done?'<div style="display:flex;gap:4px;margin-left:6px"><button class="btn sm '+(p.present===true?'':'sec')+'" data-act="train-mark" data-sid="'+sid+'" data-uid="'+p.userId+'" data-v="1">✓</button>'+
        '<button class="btn sm '+(p.present===false?'dang':'sec')+'" data-act="train-mark" data-sid="'+sid+'" data-uid="'+p.userId+'" data-v="0">✕</button></div>':'')+'</div>';});
  html+='</div>';
  // O que foi feito (notas) — gestor edita
  if(canManage){
    html+='<div class="card"><h2 style="margin:0 0 6px;font-size:14px">O que foi feito</h2>'+
      '<textarea id="tr-notes" placeholder="Atividades, observações do treino...">'+esc(s.notes||'')+'</textarea>'+
      '<div style="height:10px"></div><button class="btn sm sec" data-act="train-notes" data-sid="'+sid+'">Salvar o que foi feito</button></div>';
    if(!done)html+='<button class="btn" data-act="train-finalize" data-sid="'+sid+'">🏁 Encerrar treino</button>';
    else html+='<div class="card"><div class="muted" style="text-align:center">Treino encerrado.</div></div>';
  }else if(s.notes){
    html+='<div class="card"><h2 style="margin:0 0 6px;font-size:14px">O que foi feito</h2><div style="font-size:14px;white-space:pre-wrap">'+esc(s.notes)+'</div></div>';
  }
  html+='</div>';app.innerHTML=html;
}

          if(koM.length)body+='<div style="font-weight:900;font-size:15px;margin:18px 0 4px">🏆 Mata-mata</div>'+renderMatchRounds(koM);
          else{
            const allDone=groupM.every(m=>m.status==='FINISHED'||m.status==='WALKOVER');

    else{
      const byG={};st.forEach(s=>{(byG[s.groupName||'_']=byG[s.groupName||'_']||[]).push(s);});
      Object.keys(byG).sort().forEach(g=>{

      const top=rows.filter(r=>metric==='cards'?(r.yellow+r.red)>0:(metric==='assists'?r.assists>0:r.goals>0)).slice(0,15);

      return h+'</tbody></table>';
    };

    body+=all||'<div class="empty" style="padding:16px">Sem dados ainda. Preencha as súmulas dos jogos (botão 📋 na Chave).</div>';
  }

// renderiza partidas agrupadas por rodada (com súmula set-a-set quando concluída)
function renderMatchRounds(arr){
  let h='';
  const rounds={};arr.forEach(m=>{(rounds[m.round]=rounds[m.round]||[]).push(m);});
  Object.keys(rounds).sort((a,b)=>a-b).forEach(r=>{
    const lbl=rounds[r][0].stage;
    h+='<div style="font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">'+esc(stageName(lbl,r))+'</div>';
    rounds[r].forEach(m=>{h+=matchCard(m);});
  });
  return h;
}
function matchCard(m){
  const hw=m.winnerEntryId&&m.homeEntry&&m.winnerEntryId===m.homeEntry.id;
  const aw=m.winnerEntryId&&m.awayEntry&&m.winnerEntryId===m.awayEntry.id;
  const done=m.status==='FINISHED'||m.status==='WALKOVER';
  const isLive=m.status==='LIVE';
  const can=m.homeEntry&&m.awayEntry&&m.status!=='WALKOVER';
  let liveStr='';
  if(isLive&&m.liveState&&m.liveState.sets&&m.liveState.sets.length)liveStr=m.liveState.sets.map(s=>(s.h||0)+'-'+(s.a||0)).join(' ');
  // súmula set-a-set (registro oficial dos sets)
  const sumula=(done&&m.games&&m.games.length)?m.games.map(s=>s.homeGames+'-'+s.awayGames).join('  '):'';
  return '<div class="match"><div style="flex:1;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      '<div class="side '+(hw?'win':done?'lose':'')+'">'+esc(m.homeEntry?m.homeEntry.name:'—')+'</div>'+
      '<div class="sc">'+(done?(m.homeScore==null?'-':m.homeScore):'')+'</div><div class="vs">'+(done?'×':'vs')+'</div><div class="sc">'+(done?(m.awayScore==null?'-':m.awayScore):'')+'</div>'+
      '<div class="side '+(aw?'win':done?'lose':'')+'" style="text-align:right">'+esc(m.awayEntry?m.awayEntry.name:'—')+'</div>'+
    '</div>'+
    (sumula?'<div style="margin-top:5px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.3px">📋 '+esc(sumula)+'</div>':(m.status==='WALKOVER'?'<div style="margin-top:5px;font-size:12px;color:var(--mut);font-weight:700">W.O.</div>':''))+
    ((m.scheduledAt||m.location)?'<div class="muted" style="margin-top:4px;font-size:12px">📅 '+(m.scheduledAt?esc(fmtDate(m.scheduledAt)):'')+(m.location?(m.scheduledAt?' · ':'')+esc(m.location):'')+'</div>':'')+
    (isLive?'<div style="margin-top:6px"><span class="livetag"><span class="dot"></span>ao vivo</span> <b style="font-size:13px">'+esc(liveStr)+'</b></div>':'')+
    (can?'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+
      (!done?'<button class="btn sm gho" data-act="live" data-mid="'+m.id+'" data-h="'+esc(m.homeEntry.name)+'" data-a="'+esc(m.awayEntry.name)+'">▶ ao vivo</button>':'')+
      '<button class="btn sm gho" data-act="sumula" data-mid="'+m.id+'">📋 súmula</button>'+
      '<button class="btn sm sec" data-act="result" data-mid="'+m.id+'" data-h="'+esc(m.homeEntry.name)+'" data-a="'+esc(m.awayEntry.name)+'" data-hid="'+m.homeEntry.id+'" data-aid="'+m.awayEntry.id+'">'+(done?'editar':'placar final')+'</button>'+
      '<button class="btn sm gho" data-act="sched" data-mid="'+m.id+'" data-when="'+esc(m.scheduledAt||'')+'" data-loc="'+esc(m.location||'')+'">📅 '+((m.scheduledAt||m.location)?'reagendar':'agendar')+'</button>'+
    '</div>':'')+
    ((!m.homeEntry||!m.awayEntry)&&m.status!=='WALKOVER'?'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm gho" data-act="set-teams" data-mid="'+m.id+'">👥 definir times</button>'+
      '<button class="btn sm gho" data-act="sched" data-mid="'+m.id+'" data-when="'+esc(m.scheduledAt||'')+'" data-loc="'+esc(m.location||'')+'">📅 '+((m.scheduledAt||m.location)?'reagendar':'agendar')+'</button></div>':'')+
  '</div></div>';
}
function stdTable(rows){
  let h='<table><thead><tr><th class="t-nm">#</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SP</th><th>Pts</th></tr></thead><tbody>';
  rows.forEach(s=>{h+='<tr><td class="t-nm">'+s.rank+'. '+esc(s.entry?s.entry.name:'?')+'</td><td>'+s.played+'</td><td>'+s.won+'</td><td>'+s.drawn+'</td><td>'+s.lost+'</td><td>'+((s.scoreFor||0)-(s.scoreAgainst||0))+'</td><td><b>'+s.points+'</b></td></tr>';});
  h+='</tbody></table>';return h;
}
function stageName(lbl,r){const M={FINAL:'Final',THIRD:'Disputa de 3º lugar',SEMI:'Semifinais',QUARTER:'Quartas',RO16:'Oitavas',RO32:'32-avos',RO64:'64-avos',LEAGUE:'Rodada '+r,GROUP:'Rodada '+r};return M[lbl]||('Rodada '+r);}

async function renderChallenges(){
  loading();

  else list.forEach(c=>{
    const iAmChallenger=c.challengerId===ME.id;
    const opp=iAmChallenger?c.challenged:c.challenger;
    const stMap={PENDING:['Pendente','w'],ACCEPTED:['Aceito','ok'],DECLINED:['Recusado','g'],PLAYED:['Jogado','g'],CANCELED:['Cancelado','g']};
    const s=stMap[c.status]||['',''];
    let actions='';
    if(c.status==='PENDING'&&!iAmChallenger)actions='<button class="btn sm gho" data-act="ch-resp" data-id="'+c.id+'" data-a="accept">Aceitar</button> <button class="btn sm dang" data-act="ch-resp" data-id="'+c.id+'" data-a="decline">Recusar</button>';
    else if(c.status==='PENDING'&&iAmChallenger)actions='<button class="btn sm dang" data-act="ch-resp" data-id="'+c.id+'" data-a="cancel">Cancelar</button>';
    else if(c.status==='ACCEPTED')actions='<button class="btn sm sec" data-act="ch-result" data-id="'+c.id+'" data-h="'+esc(c.challenger.name||'')+'" data-a="'+esc(c.challenged.name||'')+'">Lançar resultado</button>';
    else if(c.status==='PLAYED')actions='<span class="pill '+(c.winnerId===ME.id?'ok':'g')+'">'+(c.winnerId===ME.id?'Você venceu':'Você perdeu')+'</span>';

      '<div class="grow"><div class="nm">'+(iAmChallenger?'vs ':'de ')+esc(opp&&opp.name||'@'+(opp&&opp.username))+'</div>'+
      '<div class="sub">'+esc(SPORT_LABEL[c.sport]||c.sport)+(c.message?' · '+esc(c.message):'')+'</div></div>'+
      '<span class="pill '+s[1]+'">'+esc(s[0])+'</span></div>'+
      (actions?'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+actions+'</div>':'')+'</div>';});
  html+='</div>';app.innerHTML=html;
}

  var body={name:name,number:num!==''?Number(num):null,isGoalkeeper:document.getElementById('rp-gk').checked,isCaptain:document.getElementById('rp-cap').checked,role:document.getElementById('rp-role').value,started:document.getElementById('rp-start').checked};
  try{await api('/entries/'+eid+'/players',{method:'POST',body:body});closeSheet();toast('Adicionado ao elenco');sumReload();}catch(e){toast(e.message);}
}
function pickTeamLogo(eid){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;toast('Processando escudo...');
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=160,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        cv.getContext('2d').drawImage(img,0,0,cw,ch);
        var data=cv.toDataURL('image/png');
        if(data.length>760000)data=cv.toDataURL('image/jpeg',0.82);
        api('/entries/'+eid+'/logo',{method:'POST',body:{logo:data}}).then(function(){toast('Escudo salvo');renderCatPanel('inscritos');}).catch(function(e){toast(e.message);});
      };
      img.onerror=function(){toast('Imagem inválida');};
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
async function sumOfficials(mid){
  var g=function(id){var e=document.getElementById(id);return e?e.value:undefined;};
  try{await api('/matches/'+mid+'/officials',{method:'POST',body:{referee1:g('ref1'),referee2:g('ref2'),referee3:g('ref3'),scorer:g('refm'),timekeeper:g('reft')}});toast('Arbitragem salva');}catch(e){toast(e.message);}
}
function sumFinalize(mid){
  if(!SUMULA||!SUMULA.last)return;
  var s=SUMULA.last, tie=s.liveScore.home===s.liveScore.away;
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  openSheet('<h3>Fechar súmula</h3><p class="muted">Placar '+s.liveScore.home+'×'+s.liveScore.away+'. Confere a arbitragem e fecha. Encerra o jogo e atualiza a classificação/chave.</p>'+
    '<label>Árbitro 1</label><input id="fz-ref1" value="'+esc(g("ref1")||s.match.referee1||"")+'">'+
    '<label>Árbitro 2</label><input id="fz-ref2" value="'+esc(g("ref2")||s.match.referee2||"")+'">'+
    (tie?('<div class="pill w" style="margin:10px 0">Empate — no mata-mata informe os pênaltis pra definir o vencedor (fica fora do placar de gols).</div>'+
      '<div class="row"><div style="flex:1"><label>Pênaltis '+esc(s.home.entry?s.home.entry.name:"casa")+'</label><input id="fz-pk-h" type="number" inputmode="numeric" placeholder="0"></div>'+
      '<div style="flex:1"><label>Pênaltis '+esc(s.away.entry?s.away.entry.name:"fora")+'</label><input id="fz-pk-a" type="number" inputmode="numeric" placeholder="0"></div></div>'):'')+
    '<div style="height:12px"></div><button class="btn" data-act="fz-go" data-mid="'+mid+'">🏁 Fechar súmula</button>');
}
async function sumFinalizeGo(mid){
  var g=function(id){var e=document.getElementById(id);return e&&e.value!==''?e.value:undefined;};
  var body={referee1:g('fz-ref1'),referee2:g('fz-ref2'),homePenalties:g('fz-pk-h'),awayPenalties:g('fz-pk-a')};
  try{var r=await api('/matches/'+mid+'/finalize',{method:'POST',body:body});closeSheet();toast('Súmula fechada: '+r.homeScore+'×'+r.awayScore+(r.decidedByPenalties?' (pên. '+r.homePenalties+'×'+r.awayPenalties+')':''));sumReload();}catch(e){toast(e.message);}
}
