<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{OG_TITLE}}</title>
<meta name="description" content="{{OG_DESC}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:type" content="profile">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/brand/sports-tennis-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#16161a;--card2:#1e1e24;--line:#2a2a31;--ink:#f5f5f7;--mut:#a1a1aa;--dim:#71717a;--o:#E5571E;--o2:#ff7a45;--ok:#22c55e;--bad:#f87171;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;padding-top:var(--st);padding-bottom:calc(24px + var(--sb))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
#app{max-width:480px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.top img{height:30px;width:auto;display:block}
.top a.btn-s{font-size:13px}
.kicker{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;color:var(--o);letter-spacing:.5px;font-size:15px}
h1{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:40px;line-height:.95;margin-top:4px}
h2{font-size:20px;font-weight:800;margin:24px 0 10px}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--o);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%}
.btn:disabled{opacity:.55}
.btn-s{min-height:38px;padding:0 12px;border-radius:10px;font-size:14px}
.hero{background:linear-gradient(160deg,#1b0f0a 0%,#0b0b0d 70%);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:6px}
.hero p{margin-top:8px;color:#d4d4d8}
.prof{display:flex;gap:14px;align-items:center;margin-top:6px}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--o);background:var(--o);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;flex:0 0 auto;color:#fff}
.prof h1{font-size:30px}
.stats{display:flex;gap:18px;margin-top:6px;font-size:14px;color:var(--mut)}
.stats b{color:var(--ink);font-size:17px}
.bio{margin-top:10px;color:#d4d4d8;white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.shoe{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.shoe .ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.shoe .ph img{width:100%;height:100%;object-fit:contain}
.shoe .tx{padding:9px 10px 10px}
.shoe .br{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--o);letter-spacing:.4px}
.shoe .md{font-size:14px;font-weight:700;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shoe .mt{font-size:12px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.tag{position:absolute;left:8px;top:8px;background:var(--o);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:3px 8px;text-transform:uppercase}
.tag.h{background:#3f3f46}
.empty{color:var(--mut);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:16px;margin-top:12px}
.people{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.person{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-decoration:none}
.person .av{width:46px;height:46px;font-size:17px;border-width:2px}
.person .nm{font-weight:800}
.person .th{display:flex;gap:4px;margin-left:auto}
.person .th img{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#fff}
.share{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;margin-top:12px}
.share code{flex:1;font-size:13px;color:#e4e4e7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:13px;font-weight:700;color:#d4d4d8;margin-top:12px}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#0f0f12;margin-top:5px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.switch input{width:22px;min-height:22px;height:22px;accent-color:var(--o);margin:0}
.msg{margin-top:10px;font-size:14px;font-weight:700}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#121216;border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:41;padding:10px 16px calc(20px + var(--sb));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sheet.on{transform:none;visibility:visible;transition:transform .25s}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#3f3f46;margin:2px auto 10px}
.sheet .in{max-width:480px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-top:6px}
.tabs button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--o);border-color:var(--o);color:#fff}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pick{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;text-align:left}
.pick.on{border-color:var(--o)}
.pick img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block}
.pick div{padding:6px 8px;font-size:12px;line-height:1.2}
.pick b{display:block;font-size:10px;color:var(--o);text-transform:uppercase}
.det img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:16px}
.det h3{font-size:22px;font-weight:800;margin-top:10px;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.like{min-height:48px}
.like.on{background:#2a0f06;color:var(--o2);border:1px solid var(--o)}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:30px}
.spin{color:var(--mut);text-align:center;padding:24px}
@media (min-width:900px){body{background:#050506}#app{background:var(--bg);min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.6);padding-bottom:30px}}
</style>
</head>
<body>
<div id="app"><div class="spin">Carregando…</div></div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="in" id="sin"></div></div>
<script>
(function () {
  'use strict';
  var $app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var token = function () { try { return localStorage.getItem('tc_token') || ''; } catch (_) { return ''; } };
  var LOGO = '<a href="/meustenis"><img src="/brand/club-sports-tennis.svg?v=4" alt="Club Sports &amp; Tennis"></a>';
  var handle = ''; try { handle = decodeURIComponent((/^\/meustenis\/([^/?#]+)/.exec(location.pathname) || [])[1] || ''); } catch (_) { handle = '-'; }
  var ME = null;

  function api(path, opts) {
    opts = opts || {};
    var h = { 'Content-Type': 'application/json' };
    if (token()) h.Authorization = 'Bearer ' + token();
    return fetch('/api/meustenis' + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Não deu certo.'); e.status = r.status; throw e; } return j; }); });
  }
  function initials(n) { return String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }
  function avatar(u) { return u.avatar ? '<img class="av" src="' + esc(u.avatar) + '" alt="">' : '<div class="av">' + esc(initials(u.name)) + '</div>'; }
  function shoeCard(it, opts) {
    var meta = [it.color, it.size ? 'Tam. ' + it.size : ''].filter(Boolean).join(' · ');
    return '<button class="shoe" data-id="' + esc(it.id) + '"><div class="ph">' + (it.photo ? '<img loading="lazy" src="' + esc(it.photo) + '" alt="' + esc(it.model) + '">' : '') +
      (opts && opts.own && it.hidden ? '<span class="tag h">oculto</span>' : (it.naLoja ? '<span class="tag">na loja</span>' : '')) + '</div><div class="tx">' +
      (it.brand ? '<div class="br">' + esc(it.brand) + '</div>' : '') + '<div class="md">' + esc(it.model) + '</div><div class="mt"><span>' + esc(meta) + '</span><span>🧡 ' + (it.likes || 0) + '</span></div></div></button>';
  }
  function publicUrl(h) { return location.origin + '/meustenis/' + encodeURIComponent(h); }
  function share(h, name) {
    var url = publicUrl(h);
    if (navigator.share) return navigator.share({ title: 'Meus tênis — ' + name, text: 'Olha meus tênis no Club Sports & Tennis', url: url }).catch(function () {});
    copy(url);
  }
  function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Link copiado'); }).catch(function () { prompt('Copie o link:', t); }); }
  function toast(t) { var d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f5f5f7;color:#0b0b0d;font-weight:800;padding:10px 16px;border-radius:999px;z-index:60'; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 1800); }

  // ───────── sheet ─────────
  function openSheet(html) { document.getElementById('sin').innerHTML = html; document.getElementById('sbg').style.display = 'block'; requestAnimationFrame(function () { document.getElementById('sheet').classList.add('on'); }); }
  function closeSheet() { document.getElementById('sheet').classList.remove('on'); document.getElementById('sbg').style.display = 'none'; }
  document.getElementById('sbg').onclick = closeSheet;

  function detail(it, opts) {
    var chips = [it.color, it.size ? 'Tamanho ' + it.size : '', it.naLoja ? 'Tem na Sports & Tennis' : ''].filter(Boolean).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('');
    var html = '<div class="det">' + (it.photo ? '<img src="' + esc(it.photo) + '" alt="">' : '') + (it.brand ? '<div class="kicker" style="margin-top:10px">' + esc(it.brand) + '</div>' : '') +
      '<h3>' + esc(it.model) + '</h3><div class="chips">' + chips + '</div>' + (it.note ? '<p class="mut" style="margin-top:10px">' + esc(it.note) + '</p>' : '') + '<div class="row">';
    if (opts.own) html += '<button class="btn g" id="ed">Editar</button><button class="btn g" id="rm" style="color:var(--bad)">Tirar</button>';
    else html += '<button class="btn g like' + (it.liked ? ' on' : '') + '" id="lk">🧡 ' + (it.liked ? 'Curtido' : 'Curtir') + ' · ' + (it.likes || 0) + '</button>';
    html += '</div>' + (it.naLoja ? '<a class="btn w" style="margin-top:10px" href="https://sportstennis2.lojavirtualnuvem.com.br/" target="_blank" rel="noopener">Ver na loja</a>' : '') + '</div>';
    openSheet(html);
    var lk = document.getElementById('lk');
    if (lk) lk.onclick = function () {
      if (!token()) { closeSheet(); return loginSheet('Entre para curtir.'); }
      lk.disabled = true;
      api('/items/' + it.id + '/like', { method: 'POST' }).then(function (r) { it.liked = r.liked; it.likes = r.likes; detail(it, opts); var c = document.querySelector('.shoe[data-id="' + it.id + '"] .mt span:last-child'); if (c) c.textContent = '🧡 ' + r.likes; })
        .catch(function (e) { toast(e.message); lk.disabled = false; });
    };
    var rm = document.getElementById('rm');
    if (rm) rm.onclick = function () { if (!confirm('Tirar este tênis do seu guarda-tênis?')) return; api('/items/' + it.id, { method: 'DELETE' }).then(function () { closeSheet(); mine(); }).catch(function (e) { toast(e.message); }); };
    var ed = document.getElementById('ed');
    if (ed) ed.onclick = function () { editSheet(it); };
  }

  // ───────── foto do celular → JPEG leve ─────────
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file); var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1400 / Math.max(img.width, img.height)); var c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { reject(new Error('Não consegui abrir essa foto.')); };
      img.src = url;
    });
  }

  // ───────── incluir tênis ─────────
  var ADD = { tab: 'cat', results: [], pick: null };
  function addSheet() {
    ADD = { tab: 'cat', results: [], pick: null, q: '' };
    openSheet('<div class="kicker">Incluir tênis</div><h2 style="margin-top:4px">Qual tênis você tem?</h2>' +
      '<div class="tabs"><button data-t="cat" class="on">Catálogo</button><button data-t="web">Internet</button><button data-t="up">Minha foto</button></div><div id="addBody"></div>');
    document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { ADD.tab = b.dataset.t; ADD.results = []; ADD.pick = null; document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); }); addBody(); }; });
    addBody();
  }
  function addBody() {
    var el = document.getElementById('addBody');
    if (ADD.tab === 'up') {
      el.innerHTML = '<label>Foto do tênis<input type="file" id="uf" accept="image/*"></label><label>Marca<input id="ub" maxlength="60" placeholder="Ex.: Mizuno"></label>' +
        '<label>Modelo<input id="um" maxlength="140" placeholder="Ex.: Wave Rider 28"></label><div class="row" style="margin-top:0"><label>Cor<input id="uc" maxlength="60"></label><label>Tamanho<input id="us" maxlength="12" inputmode="decimal"></label></div>' +
        '<button class="btn w" id="ugo" style="margin-top:14px">Incluir no meu guarda-tênis</button><div class="msg" id="um2"></div>';
      document.getElementById('ugo').onclick = function () {
        var f = document.getElementById('uf').files[0], m = document.getElementById('um2'), go = document.getElementById('ugo');
        if (!f) { m.className = 'msg bad'; m.textContent = 'Escolha a foto.'; return; }
        if (!document.getElementById('um').value.trim()) { m.className = 'msg bad'; m.textContent = 'Informe o modelo.'; return; }
        go.disabled = true; go.textContent = 'Enviando…';
        shrink(f).then(function (photo) {
          return api('/items', { method: 'POST', body: { photo: photo, brand: document.getElementById('ub').value, model: document.getElementById('um').value, color: document.getElementById('uc').value, size: document.getElementById('us').value } });
        }).then(function () { closeSheet(); toast('Tênis incluído'); mine(); }).catch(function (e) { m.className = 'msg bad'; m.textContent = e.message; go.disabled = false; go.textContent = 'Incluir no meu guarda-tênis'; });
      };
      return;
    }
    el.innerHTML = '<label>' + (ADD.tab === 'cat' ? 'Procure no catálogo da Sports &amp; Tennis' : 'Procure nos sites das marcas') + '<input id="q" type="search" placeholder="Ex.: Mizuno Wave Rider" value="' + esc(ADD.q || '') + '" enterkeyhint="search"></label>' +
      '<button class="btn w g" id="qgo" style="margin-top:10px">Buscar</button><div id="qres"></div>';
    var q = document.getElementById('q'); var qgo = document.getElementById('qgo');
    var run = function () {
      ADD.q = q.value.trim(); if (ADD.q.length < 2) return;
      var box = document.getElementById('qres'); box.innerHTML = '<div class="spin">Buscando…</div>'; qgo.disabled = true;
      api((ADD.tab === 'cat' ? '/search?q=' : '/search/web?q=') + encodeURIComponent(ADD.q)).then(function (r) {
        ADD.results = r; ADD.pick = null; qgo.disabled = false; results();
      }).catch(function (e) { box.innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; qgo.disabled = false; });
    };
    qgo.onclick = run; q.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); run(); } };
    if (ADD.results.length) results();
    setTimeout(function () { q.focus(); }, 250);
  }
  function results() {
    var box = document.getElementById('qres');
    if (!ADD.results.length) {
      box.innerHTML = '<div class="empty">Não achei.' + (ADD.tab === 'cat' ? '<br><br><button class="btn btn-s" id="toWeb">Buscar nos sites das marcas</button>' : '<br><br><button class="btn btn-s" id="toUp">Enviar minha foto</button>') + '</div>';
      var tw = document.getElementById('toWeb'); if (tw) tw.onclick = function () { document.querySelector('.tabs button[data-t=web]').click(); setTimeout(function () { document.getElementById('qgo').click(); }, 50); };
      var tu = document.getElementById('toUp'); if (tu) tu.onclick = function () { document.querySelector('.tabs button[data-t=up]').click(); };
      return;
    }
    box.innerHTML = '<p class="dim small" style="margin-top:10px">Toque no seu tênis:</p><div class="res">' + ADD.results.map(function (r, i) {
      return '<button class="pick" data-i="' + i + '"><img loading="lazy" src="' + esc(r.photo) + '" alt=""><div><b>' + esc(r.brand || '') + '</b>' + esc(r.model) + (r.color ? ' · ' + esc(r.color) : '') + '</div></button>';
    }).join('') + '</div>' + (ADD.tab === 'cat' ? '<button class="btn btn-s g w" id="toWeb2" style="margin-top:10px">Não está aqui? Buscar nos sites das marcas</button>' : '') + '<div id="pickForm"></div>';
    var tw2 = document.getElementById('toWeb2'); if (tw2) tw2.onclick = function () { var qq = ADD.q; document.querySelector('.tabs button[data-t=web]').click(); document.getElementById('q').value = qq; document.getElementById('qgo').click(); };
    box.querySelectorAll('.pick').forEach(function (b) { b.onclick = function () {
      box.querySelectorAll('.pick').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); ADD.pick = ADD.results[+b.dataset.i];
      var r = ADD.pick;
      document.getElementById('pickForm').innerHTML = '<div class="row"><label>Cor<input id="pc" maxlength="60" value="' + esc(r.color || '') + '"></label><label>Tamanho<input id="ps" maxlength="12" inputmode="decimal"></label></div>' +
        '<button class="btn w" id="pgo" style="margin-top:14px">Incluir no meu guarda-tênis</button><div class="msg" id="pm"></div>';
      document.getElementById('pickForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('pgo').onclick = function () {
        var go = document.getElementById('pgo'), m = document.getElementById('pm'); go.disabled = true; go.textContent = 'Incluindo…';
        var body = { color: document.getElementById('pc').value, size: document.getElementById('ps').value };
        if (r.productId) body.productId = r.productId; else { body.webPhoto = r.photo; body.brand = r.brand; body.model = r.model; }
        api('/items', { method: 'POST', body: body }).then(function () { closeSheet(); toast('Tênis incluído'); mine(); })
          .catch(function (e) { m.className = 'msg bad'; m.textContent = e.message; go.disabled = false; go.textContent = 'Incluir no meu guarda-tênis'; });
      };
    }; });
  }
  function editSheet(it) {
    openSheet('<div class="kicker">Editar tênis</div><label>Marca<input id="eb" maxlength="60" value="' + esc(it.brand || '') + '"></label><label>Modelo<input id="em" maxlength="140" value="' + esc(it.model) + '"></label>' +
      '<div class="row" style="margin-top:0"><label>Cor<input id="ec" maxlength="60" value="' + esc(it.color || '') + '"></label><label>Tamanho<input id="es" maxlength="12" value="' + esc(it.size || '') + '"></label></div>' +
      '<label>Comentário (opcional)<textarea id="en" maxlength="200" placeholder="Ex.: meu tênis de maratona">' + esc(it.note || '') + '</textarea></label>' +
      '<label>Trocar a foto (opcional)<input type="file" id="ef" accept="image/*"></label>' +
      '<div class="switch"><span>Esconder da minha página pública</span><input type="checkbox" id="eh"' + (it.hidden ? ' checked' : '') + '></div>' +
      '<button class="btn w" id="ego" style="margin-top:14px">Salvar</button><div class="msg" id="emm"></div>');
    document.getElementById('ego').onclick = function () {
      var go = document.getElementById('ego'), m = document.getElementById('emm'), f = document.getElementById('ef').files[0];
      go.disabled = true; go.textContent = 'Salvando…';
      (f ? shrink(f) : Promise.resolve(null)).then(function (photo) {
        var body = { brand: document.getElementById('eb').value, model: document.getElementById('em').value, color: document.getElementById('ec').value, size: document.getElementById('es').value, note: document.getElementById('en').value, hidden: document.getElementById('eh').checked };
        if (photo) body.photo = photo;
        return api('/items/' + it.id, { method: 'PATCH', body: body });
      }).then(function () { closeSheet(); toast('Salvo'); mine(); }).catch(function (e) { m.className = 'msg bad'; m.textContent = e.message; go.disabled = false; go.textContent = 'Salvar'; });
    };
  }

  // ───────── login ─────────
  function loginSheet(why) {
    openSheet('<div class="kicker">Club Sports &amp; Tennis</div><h2 style="margin-top:4px">' + esc(why || 'Entre na sua conta') + '</h2>' +
      '<label>WhatsApp ou e-mail<input id="li" autocomplete="username" inputmode="email"></label><label>Senha<input id="lp" type="password" autocomplete="current-password"></label>' +
      '<button class="btn w" id="lgo" style="margin-top:14px">Entrar</button><div class="msg" id="lm"></div>' +
      '<p class="mut small" style="margin-top:14px;text-align:center">Não tem conta? <a href="/?next=/meustenis" style="color:var(--o2);font-weight:800">Crie no Club</a> (é grátis).</p>');
    document.getElementById('lgo').onclick = function () {
      var id = document.getElementById('li').value.trim(), pw = document.getElementById('lp').value, m = document.getElementById('lm'), go = document.getElementById('lgo');
      if (!id || !pw) { m.className = 'msg bad'; m.textContent = 'Preencha os dois campos.'; return; }
      go.disabled = true;
      var body = id.indexOf('@') > 0 ? { email: id, password: pw } : { phone: id.replace(/\D/g, ''), password: pw };
      fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.token) throw new Error(j.error || 'Não deu para entrar.'); return j; }); })
        .then(function (j) { try { localStorage.setItem('tc_token', j.token); if (j.user) localStorage.setItem('tc_user', JSON.stringify(j.user)); } catch (_) {} closeSheet(); route(); })
        .catch(function (e) { m.className = 'msg bad'; m.textContent = e.message; go.disabled = false; });
    };
  }

  // ───────── telas ─────────
  function exploreHtml(list) {
    if (!list.length) return '<div class="empty">Ninguém mostrou os tênis ainda. Seja o primeiro!</div>';
    return '<div class="people">' + list.map(function (p) {
      return '<a class="person" href="/meustenis/' + encodeURIComponent(p.handle) + '">' + avatar(p) + '<div><div class="nm">' + esc(p.name) + '</div><div class="dim small">@' + esc(p.handle) + ' · ' + p.count + (p.count === 1 ? ' tênis' : ' tênis') + '</div></div><div class="th">' +
        (p.thumbs || []).slice(0, 3).map(function (t) { return '<img loading="lazy" src="' + esc(t.photo) + '" alt="">'; }).join('') + '</div></a>';
    }).join('') + '</div>';
  }
  function loadExplore(target) {
    api('/explore').then(function (l) { var el = document.getElementById(target); if (el) el.innerHTML = exploreHtml(l); }).catch(function () { var el = document.getElementById(target); if (el) el.innerHTML = '<div class="empty">Não deu para carregar agora.</div>'; });
  }

  function landing() {
    document.title = 'Meus Tênis — Club Sports & Tennis';
    $app.innerHTML = '<div class="top">' + LOGO + '<button class="btn btn-s g" id="ent">Entrar</button></div>' +
      '<div class="hero"><div class="kicker">Meus Tênis</div><h1>Seu guarda-tênis digital</h1><p>Mostre os tênis que você tem num link só seu. Coloque na bio do Instagram e veja os tênis da galera do Club.</p>' +
      '<button class="btn w" id="start" style="margin-top:16px">Montar o meu</button></div><h2>Guarda-tênis da galera</h2><div id="exp"><div class="spin">Carregando…</div></div><div class="foot">Club Sports &amp; Tennis · João Pessoa/PB</div>';
    document.getElementById('ent').onclick = function () { loginSheet(); };
    document.getElementById('start').onclick = function () { loginSheet('Entre para montar o seu guarda-tênis'); };
    loadExplore('exp');
  }

  function mine() {
    api('/me').then(function (d) {
      ME = d;
      document.title = 'Meus Tênis — Club Sports & Tennis';
      var h = d.user.handle;
      var head = '<div class="top">' + LOGO + '<button class="btn btn-s g" id="out">Sair</button></div>' +
        '<div class="prof">' + avatar(d.user) + '<div><div class="kicker">Meus Tênis</div><h1>' + esc(d.user.name.split(' ')[0]) + '</h1><div class="stats"><span><b>' + d.items.length + '</b> tênis</span><span><b>' + d.items.reduce(function (s, i) { return s + (i.likes || 0); }, 0) + '</b> curtidas</span><span><b>' + (d.profile.views || 0) + '</b> visitas</span></div></div></div>';
      var link = h ? '<div class="share"><code>' + esc(publicUrl(h).replace(/^https?:\/\//, '')) + '</code><button class="btn btn-s" id="cp">Copiar</button><button class="btn btn-s g" id="sh">Enviar</button></div>' +
        '<p class="dim small" style="margin-top:6px">Cole esse link na bio do seu Instagram.</p>' :
        '<div class="hero" style="margin-top:12px"><b>Escolha o seu @ para ter o link público</b><label>Seu @<input id="hd" maxlength="30" placeholder="ex.: joao.corre" autocapitalize="none" autocorrect="off"></label><button class="btn w" id="hgo" style="margin-top:10px">Criar meu link</button><div class="msg" id="hm"></div></div>';
      $app.innerHTML = head + link +
        '<div class="row"><button class="btn" id="add">+ Incluir tênis</button>' + (h ? '<a class="btn g" href="/meustenis/' + encodeURIComponent(h) + '">Ver como fica</a>' : '') + '</div>' +
        '<div class="switch"><span>Página pública (qualquer pessoa com o link vê)</span><input type="checkbox" id="pub"' + (d.profile.isPublic ? ' checked' : '') + '></div>' +
        '<label>Frase do seu perfil (opcional)<textarea id="bio" maxlength="160" placeholder="Ex.: Corredor de rua, 3 maratonas">' + esc(d.profile.bio || '') + '</textarea></label><button class="btn btn-s g" id="bgo" style="margin-top:8px">Salvar frase</button>' +
        '<h2>Meu guarda-tênis</h2>' + (d.items.length ? '<div class="grid">' + d.items.map(function (i) { return shoeCard(i, { own: true }); }).join('') + '</div>' : '<div class="empty">Você ainda não incluiu nenhum tênis.<br>Toque em <b>+ Incluir tênis</b>.</div>') +
        '<h2>Guarda-tênis da galera</h2><div id="exp"><div class="spin">Carregando…</div></div><div class="foot">Club Sports &amp; Tennis</div>';
      document.getElementById('out').onclick = function () { try { localStorage.removeItem('tc_token'); localStorage.removeItem('tc_user'); } catch (_) {} route(); };
      document.getElementById('add').onclick = addSheet;
      var cp = document.getElementById('cp'); if (cp) cp.onclick = function () { copy(publicUrl(h)); };
      var sh = document.getElementById('sh'); if (sh) sh.onclick = function () { share(h, d.user.name); };
      var hgo = document.getElementById('hgo'); if (hgo) hgo.onclick = function () {
        var m = document.getElementById('hm'); hgo.disabled = true;
        api('/me/handle', { method: 'POST', body: { handle: document.getElementById('hd').value } }).then(function () { mine(); }).catch(function (e) { m.className = 'msg bad'; m.textContent = e.message; hgo.disabled = false; });
      };
      document.getElementById('pub').onchange = function () { api('/me', { method: 'PUT', body: { isPublic: this.checked, bio: document.getElementById('bio').value } }).then(function () { toast('Salvo'); }).catch(function (e) { toast(e.message); }); };
      document.getElementById('bgo').onclick = function () { api('/me', { method: 'PUT', body: { isPublic: document.getElementById('pub').checked, bio: document.getElementById('bio').value } }).then(function () { toast('Frase salva'); }).catch(function (e) { toast(e.message); }); };
      $app.querySelectorAll('.grid .shoe').forEach(function (b) { b.onclick = function () { detail(d.items.find(function (i) { return i.id === b.dataset.id; }), { own: true }); }; });
      loadExplore('exp');
    }).catch(function (e) {
      if (e.status === 401) { try { localStorage.removeItem('tc_token'); } catch (_) {} return landing(); }
      $app.innerHTML = '<div class="top">' + LOGO + '</div><div class="empty">' + esc(e.message) + '</div>';
    });
  }

  function person(h) {
    api('/u/' + encodeURIComponent(h) + '?v=1').then(function (d) {
      document.title = d.user.name + ' — Meus Tênis';
      $app.innerHTML = '<div class="top">' + LOGO + '<a class="btn btn-s g" href="/meustenis">' + (token() ? 'Meu guarda-tênis' : 'Montar o meu') + '</a></div>' +
        '<div class="prof">' + avatar(d.user) + '<div><div class="kicker">Meus Tênis</div><h1>' + esc(d.user.name) + '</h1><div class="dim small">@' + esc(d.user.handle) + '</div>' +
        '<div class="stats"><span><b>' + d.items.length + '</b> tênis</span><span><b>' + d.likes + '</b> curtidas</span></div></div></div>' +
        (d.bio ? '<p class="bio">' + esc(d.bio) + '</p>' : '') +
        '<div class="row"><button class="btn" id="sh">Compartilhar</button>' + (d.own ? '<a class="btn g" href="/meustenis">Editar</a>' : '') + '</div>' +
        (d.items.length ? '<div class="grid">' + d.items.map(function (i) { return shoeCard(i); }).join('') + '</div>' : '<div class="empty">Ainda sem tênis por aqui.</div>') +
        '<h2>Monte o seu também</h2><p class="mut">Mostre os seus tênis num link só seu, grátis, no Club Sports &amp; Tennis.</p><a class="btn w" style="margin-top:12px" href="/meustenis">Montar meu guarda-tênis</a>' +
        '<h2>Guarda-tênis da galera</h2><div id="exp"><div class="spin">Carregando…</div></div><div class="foot">Club Sports &amp; Tennis</div>';
      document.getElementById('sh').onclick = function () { share(d.user.handle, d.user.name); };
      $app.querySelectorAll('.grid .shoe').forEach(function (b) { b.onclick = function () { detail(d.items.find(function (i) { return i.id === b.dataset.id; }), { own: false }); }; });
      loadExplore('exp');
    }).catch(function (e) {
      $app.innerHTML = '<div class="top">' + LOGO + '</div><div class="empty">' + esc(e.message) + '<br><br><a class="btn btn-s" href="/meustenis">Ver o Meus Tênis</a></div>';
    });
  }

  function route() { if (handle) return person(handle); if (token()) return mine(); return landing(); }
  route();
})();
</script>
</body>
</html>
