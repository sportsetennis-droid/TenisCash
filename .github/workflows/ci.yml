name: CI — o app sobe?

# Roda a cada push na main e em PR. NÃO bloqueia o deploy do Railway (que é automático),
# mas avisa NA HORA (✅/❌ no GitHub) se o commit não sobe — pega o tipo de erro que
# derrubou o prod em 2026-06-07 (require de arquivo gitignored -> MODULE_NOT_FOUND -> 502).
# Junto com o healthcheck do Railway, deploy quebrado vira "deploy falhou", não "prod fora".

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stock-replacement:
    name: substituição — estoque, arquivo e autorização
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roundtest
          POSTGRES_DB: stock_replacement_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55329:5432
        options: >-
          --health-cmd "pg_isready -U roundtest -d stock_replacement_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://roundtest@127.0.0.1:55329/stock_replacement_ci
      ROUND_TEST_DATABASE_URL: postgresql://roundtest@127.0.0.1:55329/stock_replacement_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run test:stock-replacement
      - name: Financeiro e maquininha Stone — rotas com Postgres (schema 2x, dono, auditoria, webhook Stone)
        run: npm run test:fin-http
      - name: Medalhas digitais — assinatura OB 3.0, emissão pelo resultado oficial, revogação (Postgres descartável)
        run: MEDAL_TEST_DATABASE_URL="$DATABASE_URL" npm run test:medals
      - name: Contracheque — ponta a ponta com Postgres (acesso, isolamento, fechar/reabrir, PDF, auditoria)
        run: npm run test:payroll-http
  rede-neural:
    name: rede neural de agentes — motor, neurônios e ganchos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rnatest
          POSTGRES_DB: rede_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55330:5432
        options: >-
          --health-cmd "pg_isready -U rnatest -d rede_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rnatest@127.0.0.1:55330/rede_ci
      RNA_TEST_DATABASE_URL: postgresql://rnatest@127.0.0.1:55330/rede_ci
      JWT_SECRET: ci-somente-teste
      RNA_RELOGIO: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - name: Motor — contrato, ondas, orçamento, política, aprendizado
        run: node scripts/test-rede.js
      - name: Ganchos — eventos reais viram sinais (sem vazar telefone)
        run: node scripts/test-rede-ganchos.js
      - name: Mini agentes de NF-e, estoque, bipe e compras
        run: node scripts/test-rede-estoque.js
      - name: Mini agentes de Nuvemshop, conteúdo e preço
        run: node scripts/test-rede-nuvem.js
      - name: Mini agentes de vendas, CRM, marketing, financeiro e Club
        run: node scripts/test-rede-comercial.js
      - name: Mini agentes de meta e segurança
        run: node scripts/test-rede-meta.js
      - name: Gerente de marca — raio-x por marca (estoque, venda loja × site, site, cadastro)
        run: node scripts/test-rede-marcas.js
      - name: Painel dos gerentes de marca — sintaxe, mobile-first e rotas
        run: node scripts/test-marcas-painel.cjs
      - name: Servidor MCP — acesso só do dono, ferramentas, confirmação e sem vazar PII
        env:
          PSQL: psql
          MCP_TEST_DATABASE_URL: postgresql://rnatest@127.0.0.1:55330/rede_mcp
        run: node scripts/test-rede-mcp.js
      - name: Painel da rede — sintaxe, mobile-first e rotas
        run: node scripts/test-rede-painel.cjs
  club:
    name: club — campeonato, ao vivo, inscrição, atividade, ranking e varejo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: club_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55331:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d club_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: ci-somente-teste
      RNA_RELOGIO: '0'
      PGHOST: localhost
      PGPORT: '55331'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Bancos descartáveis (um por suíte)
        run: |
          for d in t_db t_f2 t_f3 t_f4 t_f5 t_f6 t_rem; do
            psql -c "create database $d" postgres
            DATABASE_URL=postgresql://postgres@localhost:55331/$d npx prisma db push --skip-generate
          done
      - name: Motor de campeonato — formatos, desempate, suspensão
        run: node scripts/test-tournament-engine.js && node scripts/test-tournament-formats.js
      - name: Campeonato no banco — fluxos, HTTP e schema aditivo
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_db }
        run: node scripts/test-tournament-db.js
      - name: Ao vivo, artes, QR, telão, calendário, patrocinadores
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_f2 }
        run: node scripts/test-tournament-media.js
      - name: Inscrição paga, lista de espera e check-in
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_f3, TREG_TEST_DATABASE_URL: postgresql://postgres@localhost:55331/t_f3 }
        run: node scripts/test-tournament-registration.js
      - name: App de atividade (GPS, import, segmentos, conquistas, beacon)
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_f4 }
        run: node scripts/test-apex-atividade.js
      - name: Fuso de Fortaleza no agendamento + lembrete 3h antes (sem WhatsApp)
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_rem }
        run: node scripts/test-activity-reminders.js
      - name: Ranking Glicko-2, push e clube permanente
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_f5 }
        run: node scripts/test-club-ranking.js
      - name: Varejo — busca, catálogo offline, logs, carteira, calendário, painel
        env: { DATABASE_URL: postgresql://postgres@localhost:55331/t_f6, VAREJO_TEST_DATABASE_URL: postgresql://postgres@localhost:55331/t_f6 }
        run: node scripts/test-varejo-tech.js
  boot-check:
    name: deps + sintaxe + requires resolvem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instala deps (sem postinstall, pra ser determinístico)
        run: npm ci --ignore-scripts

      - name: Gera Prisma Client
        run: npx prisma generate

      - name: Ponto e produção diária da Meta Fardamentos
        run: npm run test:mf-daily

      - name: Bipagem — leitor, identificação e entradas manuais
        run: npm run test:scanner

      - name: Financeiro — lucro, impostos e valor do PIX/TenisCash
        run: npm run test:financial

      - name: Sintaxe — node --check em todo src/
        run: find src -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Requires resolvem no git? (pega MODULE_NOT_FOUND / 502)
        run: node scripts/check-requires.js

      - name: Financeiro e Stone — centavos, plano de contas, auditoria, pedido da maquininha (sem banco)
        run: npm run test:fin

      - name: Contracheque — motor de cálculo (44h, 12x36, domingo, feriado, comissão, INSS/IRRF/FGTS)
        run: npm run test:payroll
