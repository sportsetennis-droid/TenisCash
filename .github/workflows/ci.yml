name: CI — o app sobe?

# Roda a cada push na main e em PR. NÃO bloqueia o deploy do Railway (que é automático),
# mas avisa NA HORA (✅/❌ no GitHub) se o commit não sobe — pega o tipo de erro que
# derrubou o prod em 2026-06-07 (require de arquivo gitignored -> MODULE_NOT_FOUND -> 502).
# Junto com o healthcheck do Railway, deploy quebrado vira "deploy falhou", não "prod fora".

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stock-replacement:
    name: substituição — estoque, arquivo e autorização
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roundtest
          POSTGRES_DB: stock_replacement_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55329:5432
        options: >-
          --health-cmd "pg_isready -U roundtest -d stock_replacement_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://roundtest@127.0.0.1:55329/stock_replacement_ci
      ROUND_TEST_DATABASE_URL: postgresql://roundtest@127.0.0.1:55329/stock_replacement_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run test:stock-replacement
      - name: Financeiro — rotas /api/fin com Postgres (schema 2x, dono, auditoria imutável)
        run: npm run test:fin-http
  boot-check:
    name: deps + sintaxe + requires resolvem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instala deps (sem postinstall, pra ser determinístico)
        run: npm ci --ignore-scripts

      - name: Gera Prisma Client
        run: npx prisma generate

      - name: Ponto e produção diária da Meta Fardamentos
        run: npm run test:mf-daily

      - name: Bipagem — leitor, identificação e entradas manuais
        run: npm run test:scanner

      - name: Financeiro — lucro, impostos e valor do PIX/TenisCash
        run: npm run test:financial

      - name: Sintaxe — node --check em todo src/
        run: find src -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Requires resolvem no git? (pega MODULE_NOT_FOUND / 502)
        run: node scripts/check-requires.js

      - name: Financeiro — centavos, plano de contas, contas e auditoria (sem banco)
        run: npm run test:fin
