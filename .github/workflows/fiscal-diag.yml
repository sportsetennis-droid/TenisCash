# TEMPORÁRIO (remover junto com /api/_fiscaldiag): o runner do GitHub tem
# internet livre — ele abre o diagnóstico fiscal em produção e o relatório
# fica legível no log do job (a sessão Claude lê via MCP; o sandbox dela
# não alcança teniscash.com.br). Disparo manual (workflow_dispatch).
name: fiscal-diag
# push na branch de trabalho = dispara (o dispatch por API deu 403 pro app);
# workflow_dispatch continua pra disparo manual pela UI do GitHub.
on:
  workflow_dispatch:
  push:
    branches: [claude/teniscash-invoice-exchange-r4dtdb]

jobs:
  diag:
    name: relatorio fiscal de producao
    runs-on: ubuntu-latest
    steps:
      - name: health (o deploy novo esta no ar?)
        run: curl -sS -m 30 https://teniscash.com.br/api/health || echo "HEALTH FALHOU"
      - name: espera deploy v3 + atualiza agentes + relatorio
        run: |
          # 1) espera o deploy novo do Railway (marcador [diag v3])
          R=""
          for i in $(seq 1 40); do
            R=$(curl -sS -m 120 "https://teniscash.com.br/api/_fiscaldiag?g=stxdiag2026" || true)
            echo "$R" | grep -q "\[diag v3\]" && break
            echo "(tentativa $i: deploy v3 ainda nao esta no ar — aguardando 15s)"
            sleep 15
          done
          # 2) manda TODOS os agentes das lojas se atualizarem pro v2.4-certinfo
          echo "==================== AGENTPUSH ===================="
          curl -sS -m 300 -X POST "https://teniscash.com.br/api/_agentpush?g=stxdiag2026"
          echo ""
          # 3) espera os agentes reiniciarem com a versao nova
          sleep 75
          # 4) relatorio final (agora com a validade do certificado por loja)
          R=$(curl -sS -m 300 "https://teniscash.com.br/api/_fiscaldiag?g=stxdiag2026" || true)
          echo "==================== RELATORIO ===================="
          echo "$R"
          echo "==================== FIM =========================="
