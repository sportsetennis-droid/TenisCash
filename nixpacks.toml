# Nixpacks config — instala fontes no container Linux do Railway
# (Sharp/librsvg precisam de fontes do SO pra renderizar SVG text overlay)

[phases.setup]
nixPkgs = [
  "dejavu_fonts",       # DejaVu Sans/Serif/Mono — fonte universal Linux
  "liberation_ttf",     # Liberation Sans/Serif/Mono — métricas idênticas a Arial/Times
  "noto-fonts-emoji",   # Pra renderizar emojis em SVG (R$ 😎 etc)
]

# Garante que fontconfig encontra as fontes
[phases.setup.envs]
FONTCONFIG_PATH = "/etc/fonts"
